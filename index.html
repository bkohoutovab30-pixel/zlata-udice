<!DOCTYPE html>
<html lang="cs">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">

  <title>Zlatá udice – trénink</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#062d59">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef7fb;
      color: #17324d;
    }

    .app {
      max-width: 600px;
      margin: auto;
      min-height: 100vh;
      padding: 20px;
    }

    .player-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      border-radius: 15px;
      padding: 11px 14px;
      margin-bottom: 25px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
    }

    .player {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
    }

    .player-avatar {
      font-size: 24px;
    }

    .change-player {
      color: #567;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
    }

    .header {
      text-align: center;
      margin-bottom: 35px;
    }

    .header h1 {
      margin-bottom: 8px;
      font-size: 34px;
    }

    .header p {
      margin: 0;
      color: #567;
      font-size: 17px;
    }

    .menu {
      display: grid;
      gap: 15px;
    }

    .card {
      display: block;
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: 0.2s;
      text-decoration: none;
      color: #17324d;
    }

    .card:hover {
      transform: translateY(-2px);
    }

    .card:active {
      transform: scale(0.99);
    }

    .icon {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .card h2 {
      margin: 0 0 5px 0;
      font-size: 22px;
    }

    .card p {
      margin: 0;
      color: #678;
      line-height: 1.4;
    }

    .test {
      margin-top: 12px;
      background: #17324d;
      color: white;
    }

    .test p {
      color: #dce8f2;
    }

    /* =========================================
       OFFLINE
    ========================================= */

    .offline-box {
      margin-top: 22px;
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      text-align: center;
    }

    .offline-box h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .offline-box p {
      margin: 0 0 15px;
      color: #678;
      line-height: 1.4;
      font-size: 14px;
    }

    .offline-button {
      width: 100%;
      border: none;
      border-radius: 14px;
      background: #17324d;
      color: white;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .offline-button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .offline-status {
      margin-top: 14px;
      color: #567;
      font-size: 14px;
      line-height: 1.5;
      min-height: 20px;
    }

    .progress-bar {
      width: 100%;
      height: 10px;
      background: #dfeef5;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 15px;
      display: none;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #17324d;
      transition: width 0.15s;
    }

    .offline-groups {
      margin-top: 12px;
      font-size: 12px;
      color: #789;
    }
  </style>
</head>

<body>

<main class="app">

  <!-- HRÁČ -->

  <div class="player-bar">

    <div class="player">

      <span
        class="player-avatar"
        id="playerAvatar">
      </span>

      <span id="playerName"></span>

    </div>

    <a
      class="change-player"
      href="profily.html">
      Změnit hráče
    </a>

  </div>


  <!-- HLAVIČKA -->

  <div class="header">

    <h1>
      🎣 Zlatá udice
    </h1>

    <p>
      Uč se, procvičuj a připrav se na soutěž
    </p>

  </div>


  <!-- MENU -->

  <div class="menu">

    <a
