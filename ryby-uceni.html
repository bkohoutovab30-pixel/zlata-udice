<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">

  <title>Učení ryb | Zlatá udice</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef7fb;
      color: #17324d;
    }

    .app {
      max-width: 600px;
      margin: auto;
      min-height: 100vh;
      padding: 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .back {
      color: #567;
      text-decoration: none;
      font-weight: bold;
    }

    .counter {
      color: #678;
      font-weight: bold;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 5px 0;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      color: #678;
    }

    .fish-card {
      background: white;
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      text-align: center;
    }

    .photo {
      width: 100%;
      min-height: 280px;
      background: #f3f7f9;
      border-radius: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #789;
      margin-bottom: 22px;
      overflow: hidden;
    }

    .fish-photo {
      width: 100%;
      max-height: 420px;
      object-fit: contain;
      display: block;
      border-radius: 18px;
    }

    .photo-placeholder {
      width: 100%;
      min-height: 280px;
      border: 2px dashed #c7d8e2;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .photo-icon {
      font-size: 60px;
      margin-bottom: 10px;
    }

    .fish-number {
      display: inline-block;
      background: #dfeef5;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .fish-name {
      font-size: 30px;
      margin: 5px 0 18px;
    }

    .sound-button {
      border: none;
      background: #e6f2f7;
      color: #17324d;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .sound-button:active {
      transform: scale(0.97);
    }

    .sound-note {
      color: #789;
      font-size: 13px;
      margin-top: 8px;
    }

    .navigation {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }

    .nav-button {
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .previous {
      background: white;
      color: #17324d;
    }

    .next {
      background: #17324d;
      color: white;
    }

    .nav-button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .jump {
      margin-top: 20px;
    }

    select {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid #c7d8e2;
      background: white;
      color: #17324d;
      font-size: 16px;
    }

    @media(max-width:520px) {

      .app {
        padding: 15px;
      }

      .photo,
      .photo-placeholder {
        min-height: 220px;
      }

      .fish-photo {
        max-height: 340px;
      }

      .fish-name {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

<main class="app">

  <div class="topbar">
    <a class="back" href="ryby.html">← Ryby</a>
    <span class="counter" id="counter"></span>
  </div>

  <div class="header">
    <div style="font-size:42px;">📖🐟</div>
    <h1>Učení</h1>
    <p>Procházej ryby jednu po druhé</p>
  </div>

  <div class="fish-card">

    <div class="photo" id="photoArea"></div>

    <div class="fish-number" id="fishNumber"></div>

    <h2 class="fish-name" id="fishName"></h2>

    <button
      class="sound-button"
      onclick="playName()">
      🔊 Přehrát název
    </button>

    <div class="sound-note">
      Klepni a poslechni si název
    </div>

  </div>

  <div class="navigation">

    <button
      class="nav-button previous"
      id="previousButton"
      onclick="previousFish()">
      ← Předchozí
    </button>

    <button
      class="nav-button next"
      id="nextButton"
      onclick="nextFish()">
      Další →
    </button>

  </div>

  <div class="jump">

    <select id="fishSelect" onchange="jumpToFish()">

      <option value="" selected disabled>
        Vybrat rybu…
      </option>

    </select>

  </div>

</main>

<script>

/* ========================================
   RYBY
======================================== */

const fish = [

  {card:"1", name:"Amur bílý", image:"amur-bily.webp"},
  {card:"2", name:"Blatňák tmavý", image:"blatnak-tmavy.webp"},
  {card:"3", name:"Bolen dravý", image:"bolen-dravy.webp"},
  {card:"4", name:"Candát obecný", image:"candat-obecny.webp"},
  {card:"5", name:"Candát východní"},

  {card:"8", name:"Cejn velký", image:"cejn-velky.webp"},
  {card:"9", name:"Cejnek malý", image:"cejnek-maly.webp"},
  {card:"10", name:"Drsek menší", image:"drsek-mensi.webp"},
  {card:"11", name:"Hlavačka mramorovaná", image:"hlavacka-mramorovana.webp"},
  {card:"12", name:"Hlavatka obecná", image:"hlavatka-obecna.webp"},
  {card:"13", name:"Hořavka duhová", image:"horavka-duhova.webp"},

  {card:"17", name:"Hrouzek obecný", image:"hrouzek-obecny.webp"},
  {card:"18", name:"Jelec jesen", image:"jelec-jesen.webp"},
  {card:"19", name:"Jelec proudník"},
  {card:"20", name:"Jelec tloušť", image:"jelec-tloust.webp"},

  {card:"21", name:"Jeseter malý", image:"jeseter-maly.webp"},
  {card:"22", name:"Ježdík obecný", image:"jezdik-obecny.webp"},
  {card:"23", name:"Ježdík žlutý", image:"jezdik-zluty.webp"},

  {card:"24", name:"Kapr obecný", image:"kapr-obecny.webp"},
  {card:"25", name:"Karas obecný", image:"karas-obecny.webp"},
  {card:"26", name:"Karas stříbřitý", image:"karas-stribrity.webp"},
  {card:"27", name:"Koljuška tříostná", image:"koljuska-triostna.webp"},

  {card:"28", name:"Lipan podhorní", image:"lipan-podhorni.webp"},
  {card:"29", name:"Lín obecný", image:"lin-obecny.webp"},
  {card:"30", name:"Losos obecný", image:"losos-obecny.webp"},

  {card:"31", name:"Mník jednovousý", image:"mnik-jednovousy.webp"},
  {card:"32", name:"Mřenka mramorovaná"},

  {card:"33", name:"Okoun říční", image:"okoun-ricni.webp"},
  {card:"34", name:"Okounek pstruhový"},

  {card:"35", name:"Ostroretka stěhovavá", image:"ostroretka-stehovava.webp"},
  {card:"36", name:"Ostrucha křivočará"},

  {card:"37", name:"Ouklej obecná", image:"ouklej-obecna.webp"},
  {card:"38", name:"Ouklejka pruhovaná", image:"ouklejka-pruhovana.webp"},

  {card:"39", name:"Parma obecná", image:"parma-obecna.webp"},
  {card:"40", name:"Parma středomořská"},

  {card:"41", name:"Perlín ostrobřichý", image:"perlin-ostrobrichy.webp"},
  {card:"42", name:"Piskoř pruhovaný"},

  {card:"43", name:"Plotice obecná", image:"plotice-obecna.webp"},
  {card:"44", name:"Podoustev říční", image:"podoustev-ricni.webp"},

  {card:"45", name:"Pstruh duhový", image:"pstruh-duhovy.webp"},

  /*
    V prezentaci máme zatím společný obrázek
    pstruha obecného.
  */

  {card:"46", name:"Pstruh obecný - f. mořská", image:"pstruh-obecny.webp"},
  {card:"47", name:"Pstruh obecný - f. potoční", image:"pstruh-obecny.webp"},

  {card:"50", name:"Siven americký", image:"siven-americky.webp"},

  {card:"51", name:"Síh severní - maréna"},
  {card:"52", name:"Síh peleď"},

  {card:"53", name:"Slunečnice pestrá", image:"slunecnice-pestra.webp"},
  {card:"54", name:"Slunka stříbřitá", image:"slunka-stribrita.webp"},

  {card:"55", name:"Střevle potoční"},
  {card:"56", name:"Střevlička východní"},

  {card:"57", name:"Sumec velký", image:"sumec-velky.webp"},
  {card:"58", name:"Sumeček americký", image:"sumecek-americky.webp"},
  {card:"59", name:"Štika obecná", image:"stika-obecna.webp"},

  {card:"60", name:"Tolstolobik bílý", image:"tolstolobik-bily.webp"},

  {card:"62", name:"Úhoř říční", image:"uhor-ricni.webp"},

  {card:"63", name:"Vranka obecná", image:"vranka-obecna.webp"},
  {card:"64", name:"Vranka pruhoploutvá"}

];


/* ========================================
   PROMĚNNÉ
======================================== */

let currentFish = 0;

const fishName =
  document.getElementById("fishName");

const fishNumber =
  document.getElementById("fishNumber");

const counter =
  document.getElementById("counter");

const previousButton =
  document.getElementById("previousButton");

const nextButton =
  document.getElementById("nextButton");

const fishSelect =
  document.getElementById("fishSelect");

const photoArea =
  document.getElementById("photoArea");


/* ========================================
   SEZNAM RYB
======================================== */

function createFishSelect() {

  fish.forEach((item,index) => {

    const option =
      document.createElement("option");

    option.value =
      index;

    option.textContent =
      item.card +
      ". " +
      item.name;

    fishSelect.appendChild(
      option
    );

  });

}


/* ========================================
   ZÁSTUPNÝ OBRÁZEK
======================================== */

function showPlaceholder() {

  photoArea.innerHTML = `
    <div class="photo-placeholder">

      <div class="photo-icon">
        🖼️
      </div>

      <strong>
        Fotografii doplníme
      </strong>

      <span>
        Pro tuto rybu zatím fotografii nemáme.
      </span>

    </div>
  `;

}


/* ========================================
   FOTOGRAFIE
======================================== */

function showPhoto(item) {

  photoArea.innerHTML =
    "";

  if (!item.image) {

    showPlaceholder();

    return;

  }

  const img =
    document.createElement("img");

  img.className =
    "fish-photo";

  /*
    Obrázky jsou přímo ve stejné
    složce jako ryby-uceni.html.
  */

  img.src =
    item.image;

  img.alt =
    item.name;

  img.loading =
    "lazy";

  img.decoding =
    "async";

  /*
    Kdyby konkrétní obrázek
    na GitHubu chyběl, aplikace
    se nerozbije.
  */

  img.onerror =
    function() {

      showPlaceholder();

    };

  photoArea.appendChild(
    img
  );

}


/* ========================================
   ZOBRAZENÍ RYBY
======================================== */

function showFish() {

  const item =
    fish[currentFish];

  fishName.textContent =
    item.name;

  fishNumber.textContent =
    "Karta č. " +
    item.card;

  counter.textContent =
    (currentFish + 1) +
    " / " +
    fish.length;

  showPhoto(
    item
  );

  previousButton.disabled =
    currentFish === 0;

  nextButton.disabled =
    currentFish ===
    fish.length - 1;

  fishSelect.value =
    "";

}


/* ========================================
   HLAS
======================================== */

function playName() {

  if (
    !("speechSynthesis" in window)
  ) {

    return;

  }

  window.speechSynthesis.cancel();

  const item =
    fish[currentFish];

  const speech =
    new SpeechSynthesisUtterance(
      item.name
    );

  speech.lang =
    "cs-CZ";

  speech.rate =
    0.85;

  speech.pitch =
    1;

  const voices =
    window.speechSynthesis.getVoices();

  const czechVoice =
    voices.find(
      voice =>
        voice.lang &&
        voice.lang
          .toLowerCase()
          .startsWith("cs")
    );

  if (czechVoice) {

    speech.voice =
      czechVoice;

  }

  window.speechSynthesis.speak(
    speech
  );

}


/* ========================================
   DALŠÍ RYBA
======================================== */

function nextFish() {

  if (
    "speechSynthesis" in window
  ) {

    window.speechSynthesis.cancel();

  }

  if (
    currentFish <
    fish.length - 1
  ) {

    currentFish++;

    showFish();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }

}


/* ========================================
   PŘEDCHOZÍ RYBA
======================================== */

function previousFish() {

  if (
    "speechSynthesis" in window
  ) {

    window.speechSynthesis.cancel();

  }

  if (
    currentFish > 0
  ) {

    currentFish--;

    showFish();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }

}


/* ========================================
   SKOK NA VYBRANOU RYBU
======================================== */

function jumpToFish() {

  if (
    fishSelect.value === ""
  ) {

    return;

  }

  if (
    "speechSynthesis" in window
  ) {

    window.speechSynthesis.cancel();

  }

  currentFish =
    Number(
      fishSelect.value
    );

  showFish();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ========================================
   START
======================================== */

createFishSelect();

showFish();

</script>

</body>
</html>
