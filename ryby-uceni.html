<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">

  <title>Učení ryb | Zlatá udice</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef7fb;
      color: #17324d;
    }

    .app {
      max-width: 600px;
      margin: auto;
      min-height: 100vh;
      padding: 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .back {
      color: #567;
      text-decoration: none;
      font-weight: bold;
    }

    .counter {
      color: #678;
      font-weight: bold;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 5px 0;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      color: #678;
    }

    .fish-card {
      background: white;
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      text-align: center;
    }

    .photo {
      width: 100%;
      min-height: 280px;
      background: #f3f7f9;
      border-radius: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #789;
      margin-bottom: 22px;
      overflow: hidden;
    }

    .fish-photo {
      width: 100%;
      height: auto;
      max-height: 420px;
      object-fit: contain;
      display: block;
      border-radius: 18px;
    }

    .photo-placeholder {
      width: 100%;
      min-height: 280px;
      border: 2px dashed #c7d8e2;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .photo-icon {
      font-size: 60px;
      margin-bottom: 10px;
    }

    .fish-number {
      display: inline-block;
      background: #dfeef5;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .fish-name {
      font-size: 30px;
      margin: 5px 0 18px;
    }

    .sound-button {
      border: none;
      background: #e6f2f7;
      color: #17324d;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .sound-button:active {
      transform: scale(0.97);
    }

    .sound-note {
      color: #789;
      font-size: 13px;
      margin-top: 8px;
    }

    .navigation {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }

    .nav-button {
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .previous {
      background: white;
      color: #17324d;
    }

    .next {
      background: #17324d;
      color: white;
    }

    .nav-button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .jump {
      margin-top: 20px;
    }

    select {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid #c7d8e2;
      background: white;
      color: #17324d;
      font-size: 16px;
    }

    @media (max-width: 520px) {

      .app {
        padding: 15px;
      }

      .photo,
      .photo-placeholder {
        min-height: 220px;
      }

      .fish-photo {
        max-height: 340px;
      }

      .fish-name {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

<main class="app">

  <div class="topbar">

    <a class="back" href="ryby.html">
      ← Ryby
    </a>

    <span
      class="counter"
      id="counter">
    </span>

  </div>


  <div class="header">

    <div style="font-size:42px;">
      📖🐟
    </div>

    <h1>Učení</h1>

    <p>
      Procházej ryby jednu po druhé
    </p>

  </div>


  <div class="fish-card">

    <div
      class="photo"
      id="photoArea">
    </div>


    <div
      class="fish-number"
      id="fishNumber">
    </div>


    <h2
      class="fish-name"
      id="fishName">
    </h2>


    <button
      class="sound-button"
      onclick="playName()">
      🔊 Přehrát název
    </button>


    <div class="sound-note">
      Klepni a poslechni si název
    </div>

  </div>


  <div class="navigation">

    <button
      class="nav-button previous"
      id="previousButton"
      onclick="previousFish()">
      ← Předchozí
    </button>


    <button
      class="nav-button next"
      id="nextButton"
      onclick="nextFish()">
      Další →
    </button>

  </div>


  <div class="jump">

    <select
      id="fishSelect"
      onchange="jumpToFish()">

      <option
        value=""
        selected
        disabled>
        Vybrat rybu…
      </option>

    </select>

  </div>

</main>


<!-- ================================
     SPOLEČNÁ DATA RYB
================================ -->

<script src="ryby-data.js"></script>


<!-- ================================
     SPOLEČNÝ SYSTÉM ZVUKU
================================ -->

<script src="zvuk.js"></script>


<script>

/* =========================================
   PROMĚNNÉ
========================================= */

let currentFish = 0;


const fishName =
  document.getElementById(
    "fishName"
  );


const fishNumber =
  document.getElementById(
    "fishNumber"
  );


const counter =
  document.getElementById(
    "counter"
  );


const previousButton =
  document.getElementById(
    "previousButton"
  );


const nextButton =
  document.getElementById(
    "nextButton"
  );


const fishSelect =
  document.getElementById(
    "fishSelect"
  );


const photoArea =
  document.getElementById(
    "photoArea"
  );


/* =========================================
   NÁZEV RYBY -> NÁZEV SOUBORU
========================================= */

function createImageName(name) {

  return name

    .normalize("NFD")

    .replace(
      /[\u0300-\u036f]/g,
      ""
    )

    .toLowerCase()

    /* obě formy pstruha hledáme
       jako pstruh-obecny */

    .replace(
      /\s*-\s*f\.\s*.*$/,
      ""
    )

    .replace(
      /[^a-z0-9]+/g,
      "-"
    )

    .replace(
      /^-+|-+$/g,
      ""
    );

}


/* =========================================
   VÝBĚR RYBY
========================================= */

function createFishSelect() {

  fish.forEach(
    function (item, index) {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        index;


      option.textContent =
        item.card +
        ". " +
        item.name;


      fishSelect.appendChild(
        option
      );

    }
  );

}


/* =========================================
   ZÁSTUPNÝ OBRÁZEK
========================================= */

function showPlaceholder() {

  photoArea.innerHTML = `

    <div class="photo-placeholder">

      <div class="photo-icon">
        🖼️
      </div>

      <strong>
        Fotografii doplníme
      </strong>

      <span>
        Pro tuto rybu zatím fotografii nemáme.
      </span>

    </div>

  `;

}


/* =========================================
   FOTOGRAFIE
========================================= */

function showPhoto(item) {

  showPlaceholder();


  const baseName =
    createImageName(
      item.name
    );


  const possibleImages = [

    baseName + ".webp",
    baseName + "-2.webp",
    baseName + "-3.webp",

    baseName + ".jpg",
    baseName + "-2.jpg",
    baseName + "-3.jpg",

    baseName + ".jpeg",
    baseName + "-2.jpeg",

    baseName + ".png",
    baseName + "-2.png"

  ];


  let attempt = 0;


  function tryNextImage() {

    if (
      attempt >=
      possibleImages.length
    ) {

      return;

    }


    const img =
      new Image();


    img.onload =
      function () {

        if (
          fish[currentFish].name !==
          item.name
        ) {

          return;

        }


        img.className =
          "fish-photo";


        img.alt =
          item.name;


        photoArea.innerHTML =
          "";


        photoArea.appendChild(
          img
        );

      };


    img.onerror =
      function () {

        attempt++;

        tryNextImage();

      };


    img.src =
      possibleImages[
        attempt
      ];

  }


  tryNextImage();

}


/* =========================================
   ZOBRAZENÍ RYBY
========================================= */

function showFish() {

  const item =
    fish[currentFish];


  fishName.textContent =
    item.name;


  fishNumber.textContent =
    "Karta č. " +
    item.card;


  counter.textContent =
    (currentFish + 1) +
    " / " +
    fish.length;


  previousButton.disabled =
    currentFish === 0;


  nextButton.disabled =
    currentFish ===
    fish.length - 1;


  fishSelect.value =
    "";


  showPhoto(
    item
  );

}


/* =========================================
   ZVUK
========================================= */

function playName() {

  const item =
    fish[currentFish];


  playNamedSound(
    item.name,
    "audio/ryby"
  );

}


/* =========================================
   DALŠÍ RYBA
========================================= */

function nextFish() {

  stopSound();


  if (
    currentFish <
    fish.length - 1
  ) {

    currentFish++;

    showFish();


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }

}


/* =========================================
   PŘEDCHOZÍ RYBA
========================================= */

function previousFish() {

  stopSound();


  if (
    currentFish > 0
  ) {

    currentFish--;

    showFish();


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }

}


/* =========================================
   VÝBĚR ZE SEZNAMU
========================================= */

function jumpToFish() {

  if (
    fishSelect.value === ""
  ) {

    return;

  }


  stopSound();


  currentFish =
    Number(
      fishSelect.value
    );


  showFish();


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =========================================
   START
========================================= */

createFishSelect();

showFish();

</script>

</body>
</html>
