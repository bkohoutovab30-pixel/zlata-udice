<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">

  <title>Učení ryb | Zlatá udice</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef7fb;
      color: #17324d;
    }

    .app {
      max-width: 600px;
      margin: auto;
      min-height: 100vh;
      padding: 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .back {
      color: #567;
      text-decoration: none;
      font-weight: bold;
    }

    .counter {
      color: #678;
      font-weight: bold;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 5px 0;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      color: #678;
    }

    .fish-card {
      background: white;
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      text-align: center;
    }

    .photo {
      width: 100%;
      min-height: 280px;
      background: #f3f7f9;
      border: 2px dashed #c7d8e2;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #789;
      margin-bottom: 22px;
      padding: 20px;
    }

    .photo-icon {
      font-size: 60px;
      margin-bottom: 10px;
    }

    .fish-number {
      display: inline-block;
      background: #dfeef5;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .fish-name {
      font-size: 30px;
      margin: 5px 0 18px;
    }

    .sound-button {
      border: none;
      background: #e6f2f7;
      color: #17324d;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
    }

    .sound-button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .sound-note {
      color: #789;
      font-size: 13px;
      margin-top: 8px;
    }

    .navigation {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }

    .nav-button {
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .previous {
      background: white;
      color: #17324d;
    }

    .next {
      background: #17324d;
      color: white;
    }

    .nav-button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .jump {
      margin-top: 20px;
    }

    select {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid #c7d8e2;
      background: white;
      color: #17324d;
      font-size: 16px;
    }
  </style>
</head>

<body>

<main class="app">

  <div class="topbar">
    <a class="back" href="ryby.html">← Ryby</a>
    <span class="counter" id="counter"></span>
  </div>

  <div class="header">
    <div style="font-size:42px;">📖🐟</div>
    <h1>Učení</h1>
    <p>Procházej ryby jednu po druhé</p>
  </div>

  <div class="fish-card">

    <div class="photo">
      <div class="photo-icon">🖼️</div>
      <strong>Fotografii doplníme</strong>
      <span>Pro tuto rybu je připravené místo.</span>
    </div>

    <div class="fish-number" id="fishNumber"></div>

    <h2 class="fish-name" id="fishName"></h2>

    <button class="sound-button" disabled>
      🔊 Přehrát název
    </button>

    <div class="sound-note">
      Zvuk doplníme později
    </div>

  </div>

  <div class="navigation">

    <button
      class="nav-button previous"
      id="previousButton"
      onclick="previousFish()">
      ← Předchozí
    </button>

    <button
      class="nav-button next"
      id="nextButton"
      onclick="nextFish()">
      Další →
    </button>

  </div>

  <div class="jump">

    <select id="fishSelect" onchange="jumpToFish()">

      <option value="" selected disabled>
        Vybrat rybu…
      </option>

    </select>

  </div>

</main>

<script>

const fish = [
  {card:"1", name:"Amur bílý"},
  {card:"2", name:"Blatňák tmavý"},
  {card:"3", name:"Bolen dravý"},
  {card:"4", name:"Candát obecný"},
  {card:"5", name:"Candát východní"},
  {card:"8", name:"Cejn velký"},
  {card:"9", name:"Cejnek malý"},
  {card:"10", name:"Drsek menší"},
  {card:"11", name:"Hlavačka mramorovaná"},
  {card:"12", name:"Hlavatka obecná"},
  {card:"13", name:"Hořavka duhová"},
  {card:"17", name:"Hrouzek obecný"},
  {card:"18", name:"Jelec jesen"},
  {card:"19", name:"Jelec proudník"},
  {card:"20", name:"Jelec tloušť"},
  {card:"21", name:"Jeseter malý"},
  {card:"22", name:"Ježdík obecný"},
  {card:"23", name:"Ježdík žlutý"},
  {card:"24", name:"Kapr obecný"},
  {card:"25", name:"Karas obecný"},
  {card:"26", name:"Karas stříbřitý"},
  {card:"27", name:"Koljuška tříostná"},
  {card:"28", name:"Lipan podhorní"},
  {card:"29", name:"Lín obecný"},
  {card:"30", name:"Losos obecný"},
  {card:"31", name:"Mník jednovousý"},
  {card:"32", name:"Mřenka mramorovaná"},
  {card:"33", name:"Okoun říční"},
  {card:"34", name:"Okounek pstruhový"},
  {card:"35", name:"Ostroretka stěhovavá"},
  {card:"36", name:"Ostrucha křivočará"},
  {card:"37", name:"Ouklej obecná"},
  {card:"38", name:"Ouklejka pruhovaná"},
  {card:"39", name:"Parma obecná"},
  {card:"40", name:"Parma středomořská"},
  {card:"41", name:"Perlín ostrobřichý"},
  {card:"42", name:"Piskoř pruhovaný"},
  {card:"43", name:"Plotice obecná"},
  {card:"44", name:"Podoustev říční"},
  {card:"45", name:"Pstruh duhový"},
  {card:"46", name:"Pstruh obecný - f. mořská"},
  {card:"47", name:"Pstruh obecný - f. potoční"},
  {card:"50", name:"Siven americký"},
  {card:"51", name:"Síh severní - maréna"},
  {card:"52", name:"Síh peleď"},
  {card:"53", name:"Slunečnice pestrá"},
  {card:"54", name:"Slunka stříbřitá"},
  {card:"55", name:"Střevle potoční"},
  {card:"56", name:"Střevlička východní"},
  {card:"57", name:"Sumec velký"},
  {card:"58", name:"Sumeček americký"},
  {card:"59", name:"Štika obecná"},
  {card:"60", name:"Tolstolobik bílý"},
  {card:"62", name:"Úhoř říční"},
  {card:"63", name:"Vranka obecná"},
  {card:"64", name:"Vranka pruhoploutvá"}
];

let currentFish = 0;

const fishName =
  document.getElementById("fishName");

const fishNumber =
  document.getElementById("fishNumber");

const counter =
  document.getElementById("counter");

const previousButton =
  document.getElementById("previousButton");

const nextButton =
  document.getElementById("nextButton");

const fishSelect =
  document.getElementById("fishSelect");


function createFishSelect() {

  fish.forEach((item, index) => {

    const option =
      document.createElement("option");

    option.value = index;

    option.textContent =
      item.card + ". " + item.name;

    fishSelect.appendChild(option);

  });

}


function showFish() {

  const item = fish[currentFish];

  fishName.textContent =
    item.name;

  fishNumber.textContent =
    "Karta č. " + item.card;

  counter.textContent =
    (currentFish + 1) +
    " / " +
    fish.length;

  previousButton.disabled =
    currentFish === 0;

  nextButton.disabled =
    currentFish === fish.length - 1;

  /*
    V základním stavu zůstává
    rolovací pole neutrální.
  */
  fishSelect.value = "";

}


function nextFish() {

  if (currentFish < fish.length - 1) {

    currentFish++;

    showFish();

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }

}


function previousFish() {

  if (currentFish > 0) {

    currentFish--;

    showFish();

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }

}


function jumpToFish() {

  if (fishSelect.value === "") {
    return;
  }

  currentFish =
    Number(fishSelect.value);

  showFish();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


createFishSelect();
showFish();

</script>

</body>
</html>
