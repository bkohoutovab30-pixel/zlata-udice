<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">

  <title>Procvičování živočichů | Zlatá udice</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef7fb;
      color: #17324d;
    }

    .app {
      max-width: 600px;
      margin: auto;
      min-height: 100vh;
      padding: 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .back {
      color: #567;
      text-decoration: none;
      font-weight: bold;
    }

    .player {
      font-size: 14px;
      font-weight: bold;
      color: #567;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header-icon {
      font-size: 42px;
    }

    .header h1 {
      margin: 5px 0;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      color: #678;
    }

    .score {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 20px 0;
    }

    .score-box {
      background: white;
      border-radius: 14px;
      padding: 12px 5px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
    }

    .score-number {
      display: block;
      font-size: 22px;
      font-weight: bold;
    }

    .score-label {
      display: block;
      margin-top: 3px;
      font-size: 12px;
      color: #789;
    }

    .animal-card {
      background: white;
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      text-align: center;
    }

    .photo {
      width: 100%;
      min-height: 280px;
      background: #f3f7f9;
      border: 2px dashed #c7d8e2;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #789;
      padding: 20px;
      margin-bottom: 22px;
      overflow: hidden;
    }

    .photo img {
      display: block;
      width: 100%;
      max-height: 350px;
      object-fit: contain;
      border-radius: 14px;
    }

    .photo-icon {
      font-size: 60px;
      margin-bottom: 10px;
    }

    .question {
      font-size: 20px;
      font-weight: bold;
      margin: 5px 0 18px;
    }

    .show-name {
      border: none;
      background: #17324d;
      color: white;
      padding: 14px 22px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .answer {
      display: none;
    }

    .animal-name {
      font-size: 30px;
      margin: 5px 0 14px;
    }

    .sound-button {
      border: none;
      background: #e6f2f7;
      color: #17324d;
      padding: 11px 17px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 22px;
    }

    .answer-question {
      color: #678;
      margin-bottom: 12px;
    }

    .answer-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .answer-button {
      border: none;
      border-radius: 14px;
      padding: 15px 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .wrong {
      background: #fde8e8;
      color: #9b2929;
    }

    .correct {
      background: #e2f4e8;
      color: #27683a;
    }

    .info {
      margin-top: 20px;
      text-align: center;
      color: #789;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<main class="app">

  <div class="topbar">
    <a class="back" href="zivocichove.html">← Živočichové</a>
    <div class="player" id="playerInfo"></div>
  </div>

  <div class="header">
    <div class="header-icon">🎯🦆</div>
    <h1>Procvičování</h1>
    <p>Zkus živočicha poznat bez nápovědy</p>
  </div>

  <div class="score">

    <div class="score-box">
      <span class="score-number" id="totalScore">0</span>
      <span class="score-label">Procvičeno</span>
    </div>

    <div class="score-box">
      <span class="score-number" id="correctScore">0</span>
      <span class="score-label">✅ Vím</span>
    </div>

    <div class="score-box">
      <span class="score-number" id="wrongScore">0</span>
      <span class="score-label">❌ Nevím</span>
    </div>

  </div>

  <div class="animal-card">

    <div class="photo" id="photoArea"></div>

    <div id="questionArea">

      <div class="question">
        Poznáš tohoto živočicha?
      </div>

      <button
        class="show-name"
        onclick="showAnswer()">
        👁️ Zobrazit název
      </button>

    </div>

    <div class="answer" id="answerArea">

      <h2 class="animal-name" id="animalName"></h2>

      <button
        class="sound-button"
        onclick="playName()">
        🔊 Přehrát název
      </button>

      <div class="answer-question">
        Věděl/a jsi správnou odpověď?
      </div>

      <div class="answer-buttons">

        <button
          class="answer-button wrong"
          onclick="answer(false)">
          ❌ Nevěděl/a
        </button>

        <button
          class="answer-button correct"
          onclick="answer(true)">
          ✅ Věděl/a
        </button>

      </div>

    </div>

  </div>

  <div class="info">
    Živočichové označení jako „Nevěděl/a“
    se uloží do ❤️ Co mi nejde
    pouze tomuto hráči.
  </div>

</main>

<script src="zivocichove-data.js"></script>

<script>

/* =========================
   PROFIL
========================= */

const activeProfileId =
  localStorage.getItem(
    "zlataUdiceActiveProfile"
  );

if (!activeProfileId) {
  window.location.href =
    "profily.html";
}


function getProfiles() {

  const saved =
    localStorage.getItem(
      "zlataUdiceProfiles"
    );

  if (!saved) {
    return [];
  }

  try {
    return JSON.parse(saved);
  }
  catch {
    return [];
  }
}


const activePlayer =
  getProfiles().find(
    profile =>
      profile.id === activeProfileId
  );


if (!activePlayer) {

  localStorage.removeItem(
    "zlataUdiceActiveProfile"
  );

  window.location.href =
    "profily.html";

}
else {

  document.getElementById(
    "playerInfo"
  ).textContent =
    activePlayer.avatar +
    " " +
    activePlayer.name;
}


/* =========================
   DATA HRÁČE
========================= */

const mistakesKey =
  "zlataUdiceAnimalMistakes_" +
  activeProfileId;

const progressKey =
  "zlataUdiceAnimalProgress_" +
  activeProfileId;


/* =========================
   PROMĚNNÉ
========================= */

let currentAnimal = null;
let previousAnimal = null;

let sessionTotal = 0;
let sessionCorrect = 0;
let sessionWrong = 0;

const animalName =
  document.getElementById(
    "animalName"
  );

const photoArea =
  document.getElementById(
    "photoArea"
  );

const questionArea =
  document.getElementById(
    "questionArea"
  );

const answerArea =
  document.getElementById(
    "answerArea"
  );

const totalScore =
  document.getElementById(
    "totalScore"
  );

const correctScore =
  document.getElementById(
    "correctScore"
  );

const wrongScore =
  document.getElementById(
    "wrongScore"
  );


/* =========================
   ID ŽIVOČICHA
========================= */

function getAnimalId(item) {

  if (item.card) {
    return String(item.card);
  }

  return item.name;
}


/* =========================
   NÁZEV -> SOUBOR
========================= */

function createImageName(name) {

  return name
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    )
    .toLowerCase()
    .replace(
      /[^a-z0-9]+/g,
      "-"
    )
    .replace(
      /^-+|-+$/g,
      ""
    );
}


/* =========================
   PLACEHOLDER
========================= */

function showPlaceholder() {

  photoArea.innerHTML = `
    <div class="photo-icon">🖼️</div>
    <strong>Fotografii doplníme</strong>
    <span>Pro tohoto živočicha zatím fotografii nemáme.</span>
  `;
}


/* =========================
   FOTOGRAFIE
========================= */

function showPhoto(item) {

  showPlaceholder();

  const baseName =
    createImageName(item.name);

  const possibleImages = [];

  /*
    Pokud je cesta k fotografii
    uvedená přímo v zivocichove-data.js,
    vyzkoušíme ji jako první.
  */

  if (item.image) {
    possibleImages.push(
      item.image
    );
  }

  possibleImages.push(

    baseName + ".webp",
    baseName + "-2.webp",
    baseName + "-3.webp",

    baseName + ".jpg",
    baseName + "-2.jpg",
    baseName + "-3.jpg",

    baseName + ".jpeg",
    baseName + "-2.jpeg",

    baseName + ".png",
    baseName + "-2.png"

  );

  const uniqueImages =
    [...new Set(possibleImages)];

  let attempt = 0;


  function tryNextImage() {

    if (
      attempt >=
      uniqueImages.length
    ) {
      return;
    }


    const img =
      new Image();


    img.onload = function() {

      /*
        Obrázek mohl být načten až poté,
        co už aplikace přešla na jiného
        živočicha.
      */

      if (
        currentAnimal === null ||
        animals[currentAnimal].name
          !== item.name
      ) {
        return;
      }


      img.alt =
        item.name;


      photoArea.innerHTML =
        "";


      photoArea.appendChild(
        img
      );
    };


    img.onerror = function() {

      attempt++;

      tryNextImage();
    };


    img.src =
      uniqueImages[attempt];
  }


  tryNextImage();
}


/* =========================
   NÁHODNÝ ŽIVOČICH
========================= */

function chooseRandomAnimal() {

  if (
    "speechSynthesis" in window
  ) {
    window.speechSynthesis.cancel();
  }


  let newAnimal;


  do {

    newAnimal =
      Math.floor(
        Math.random() *
        animals.length
      );

  }
  while (
    animals.length > 1 &&
    newAnimal === previousAnimal
  );


  currentAnimal =
    newAnimal;

  previousAnimal =
    newAnimal;


  animalName.textContent =
    animals[currentAnimal].name;


  showPhoto(
    animals[currentAnimal]
  );


  questionArea.style.display =
    "block";

  answerArea.style.display =
    "none";
}


/* =========================
   ODHALENÍ
========================= */

function showAnswer() {

  questionArea.style.display =
    "none";

  answerArea.style.display =
    "block";
}


/* =========================
   ZVUK
========================= */

function playName() {

  if (
    !("speechSynthesis" in window) ||
    currentAnimal === null
  ) {
    return;
  }


  window.speechSynthesis.cancel();


  const speech =
    new SpeechSynthesisUtterance(
      animals[currentAnimal].name
    );


  speech.lang =
    "cs-CZ";

  speech.rate =
    0.85;

  speech.pitch =
    1;


  const voices =
    window.speechSynthesis.getVoices();


  const czechVoice =
    voices.find(
      voice =>
        voice.lang &&
        voice.lang
          .toLowerCase()
          .startsWith("cs")
    );


  if (czechVoice) {
    speech.voice =
      czechVoice;
  }


  window.speechSynthesis.speak(
    speech
  );
}


/* =========================
   ODPOVĚĎ
========================= */

function answer(knewIt) {

  if (
    "speechSynthesis" in window
  ) {
    window.speechSynthesis.cancel();
  }


  sessionTotal++;


  if (knewIt) {

    sessionCorrect++;

    removeFromMistakes(
      getAnimalId(
        animals[currentAnimal]
      )
    );

  }
  else {

    sessionWrong++;

    addToMistakes(
      animals[currentAnimal]
    );
  }


  saveProgress(
    knewIt
  );

  updateScore();

  chooseRandomAnimal();
}


/* =========================
   SKÓRE
========================= */

function updateScore() {

  totalScore.textContent =
    sessionTotal;

  correctScore.textContent =
    sessionCorrect;

  wrongScore.textContent =
    sessionWrong;
}


/* =========================
   CHYBY
========================= */

function getMistakes() {

  const saved =
    localStorage.getItem(
      mistakesKey
    );

  if (!saved) {
    return [];
  }

  try {
    return JSON.parse(saved);
  }
  catch {
    return [];
  }
}


function saveMistakes(mistakes) {

  localStorage.setItem(
    mistakesKey,
    JSON.stringify(mistakes)
  );
}


function addToMistakes(animalItem) {

  const mistakes =
    getMistakes();


  const animalId =
    getAnimalId(
      animalItem
    );


  const alreadyExists =
    mistakes.some(
      item =>
        getAnimalId(item)
          === animalId
    );


  if (!alreadyExists) {

    mistakes.push(
      animalItem
    );

    saveMistakes(
      mistakes
    );
  }
}


function removeFromMistakes(
  animalId
) {

  let mistakes =
    getMistakes();


  mistakes =
    mistakes.filter(
      item =>
        getAnimalId(item)
          !== animalId
    );


  saveMistakes(
    mistakes
  );
}


/* =========================
   DLOUHODOBÝ POKROK
========================= */

function getProgress() {

  const saved =
    localStorage.getItem(
      progressKey
    );


  if (!saved) {

    return {
      total: 0,
      correct: 0,
      wrong: 0
    };
  }


  try {

    const progress =
      JSON.parse(saved);


    return {

      total:
        Number(
          progress.total
        ) || 0,

      correct:
        Number(
          progress.correct
        ) || 0,

      wrong:
        Number(
          progress.wrong
        ) || 0
    };

  }
  catch {

    return {
      total: 0,
      correct: 0,
      wrong: 0
    };
  }
}


function saveProgress(
  knewIt
) {

  const progress =
    getProgress();


  progress.total++;


  if (knewIt) {
    progress.correct++;
  }
  else {
    progress.wrong++;
  }


  localStorage.setItem(
    progressKey,
    JSON.stringify(progress)
  );
}


/* =========================
   START
========================= */

chooseRandomAnimal();

</script>

</body>
</html>
