<!DOCTYPE html>
<html lang="cs">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <title>Procvičování živočichů | Zlatá udice</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef7fb;
      color: #17324d;
    }

    .app {
      max-width: 600px;
      margin: auto;
      min-height: 100vh;
      padding: 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .back {
      color: #567;
      text-decoration: none;
      font-weight: bold;
    }

    .player {
      font-size: 14px;
      font-weight: bold;
      color: #567;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header-icon {
      font-size: 42px;
    }

    .header h1 {
      margin: 5px 0;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      color: #678;
    }


    /* =========================
       SKÓRE
    ========================= */

    .score {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 20px 0;
    }

    .score-box {
      background: white;
      border-radius: 14px;
      padding: 12px 5px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
    }

    .score-number {
      display: block;
      font-size: 22px;
      font-weight: bold;
    }

    .score-label {
      display: block;
      margin-top: 3px;
      font-size: 12px;
      color: #789;
    }


    /* =========================
       KARTA
    ========================= */

    .animal-card {
      background: white;
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      text-align: center;
    }

    .photo {
      width: 100%;
      min-height: 280px;
      background: #f3f7f9;
      border: 2px dashed #c7d8e2;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #789;
      padding: 20px;
      margin-bottom: 22px;
      overflow: hidden;
    }

    .photo img {
      display: block;
      width: 100%;
      max-height: 350px;
      object-fit: contain;
      border-radius: 14px;
    }

    .photo-icon {
      font-size: 60px;
      margin-bottom: 10px;
    }

    .question {
      font-size: 20px;
      font-weight: bold;
      margin: 5px 0 18px;
    }


    /* =========================
       UKÁZAT NÁZEV
    ========================= */

    .show-name {
      border: none;
      background: #17324d;
      color: white;
      padding: 14px 22px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .show-name:active {
      transform: scale(0.98);
    }


    /* =========================
       ODPOVĚĎ
    ========================= */

    .answer {
      display: none;
    }

    .animal-name {
      font-size: 30px;
      margin: 5px 0 14px;
    }

    .sound-button {
      border: none;
      background: #e6f2f7;
      color: #17324d;
      padding: 11px 17px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 22px;
    }

    .sound-button:active {
      transform: scale(0.97);
    }

    .answer-question {
      color: #678;
      margin-bottom: 12px;
      font-weight: bold;
    }

    .answer-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .answer-button {
      border: none;
      border-radius: 14px;
      padding: 15px 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .know {
      background: #dff4e5;
      color: #276238;
    }

    .dont-know {
      background: #f9dfdf;
      color: #8c3f3f;
    }

    .answer-button:active {
      transform: scale(0.98);
    }


    /* =========================
       DALŠÍ
    ========================= */

    .next-button {
      display: none;
      width: 100%;
      margin-top: 18px;
      border: none;
      border-radius: 14px;
      background: #17324d;
      color: white;
      padding: 15px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .message {
      min-height: 24px;
      margin-top: 15px;
      font-weight: bold;
    }

    .message.correct {
      color: #387848;
    }

    .message.wrong {
      color: #a64f4f;
    }


    @media (max-width: 520px) {

      .app {
        padding: 15px;
      }

      .photo {
        min-height: 220px;
      }

      .photo img {
        max-height: 320px;
      }

      .animal-name {
        font-size: 26px;
      }

    }

  </style>

</head>


<body>

<main class="app">


  <!-- HORNÍ LIŠTA -->

  <div class="topbar">

    <a
      class="back"
      href="zivocichove.html"
    >
      ← Zpět
    </a>

    <div
      class="player"
      id="playerInfo"
    ></div>

  </div>


  <!-- HLAVIČKA -->

  <div class="header">

    <div class="header-icon">
      🎯
    </div>

    <h1>
      Procvičování
    </h1>

    <p>
      Poznávej živočichy podle obrázků
    </p>

  </div>


  <!-- SKÓRE -->

  <div class="score">

    <div class="score-box">

      <span
        class="score-number"
        id="totalScore"
      >
        0
      </span>

      <span class="score-label">
        🎯 Procvičeno
      </span>

    </div>


    <div class="score-box">

      <span
        class="score-number"
        id="correctScore"
      >
        0
      </span>

      <span class="score-label">
        ✅ Umím
      </span>

    </div>


    <div class="score-box">

      <span
        class="score-number"
        id="wrongScore"
      >
        0
      </span>

      <span class="score-label">
        ❌ Neumím
      </span>

    </div>

  </div>


  <!-- KARTA -->

  <div class="animal-card">


    <!-- OBRÁZEK -->

    <div
      class="photo"
      id="photoArea"
    ></div>


    <!-- OTÁZKA -->

    <div class="question">
      Poznáš tohoto živočicha?
    </div>


    <!-- UKÁZAT NÁZEV -->

    <div
      id="questionArea"
    >

      <button
        class="show-name"
        type="button"
        onclick="showAnswer()"
      >
        Ukázat název
      </button>

    </div>


    <!-- ODPOVĚĎ -->

    <div
      class="answer"
      id="answerArea"
    >

      <h2
        class="animal-name"
        id="animalName"
      ></h2>


      <button
        class="sound-button"
        type="button"
        onclick="playCurrentAnimal()"
      >
        🔊 Poslechnout název
      </button>


      <div class="answer-question">
        Věděl/a jsi to?
      </div>


      <div class="answer-buttons">

        <button
          class="answer-button know"
          type="button"
          onclick="saveAnswer(true)"
        >
          ✅ Ano, umím
        </button>


        <button
          class="answer-button dont-know"
          type="button"
          onclick="saveAnswer(false)"
        >
          ❌ Ještě neumím
        </button>

      </div>

    </div>


    <!-- ZPRÁVA -->

    <div
      class="message"
      id="message"
    ></div>


    <!-- DALŠÍ -->

    <button
      class="next-button"
      id="nextButton"
      type="button"
      onclick="nextAnimal()"
    >
      Další živočich →
    </button>


  </div>

</main>


<!-- DATA ŽIVOČICHŮ -->

<script src="zivocichove-data.js"></script>


<script>


/* =========================
   PROMĚNNÉ
========================= */

let currentAnimal = null;

let lastAnimalName = "";

let animalAudio = null;

let answered = false;


/* =========================
   PROFILY
========================= */

function getProfiles() {

  const saved =
    localStorage.getItem(
      "zlataUdiceProfiles"
    );

  if (!saved) {
    return [];
  }

  try {
    return JSON.parse(saved);
  }
  catch {
    return [];
  }

}


/* =========================
   AKTIVNÍ HRÁČ
========================= */

const activeProfileId =
  localStorage.getItem(
    "zlataUdiceActiveProfile"
  );


const activePlayer =
  getProfiles().find(
    function(profile) {

      return (
        profile.id ===
        activeProfileId
      );

    }
  );


if (activePlayer) {

  document.getElementById(
    "playerInfo"
  ).textContent =
    (activePlayer.avatar || "") +
    " " +
    (activePlayer.name || "");

}


/* =========================
   KLÍČE
========================= */

const progressKey =
  "zlataUdiceAnimalProgress_" +
  (activeProfileId || "default");


const mistakesKey =
  "zlataUdiceAnimalMistakes_" +
  (activeProfileId || "default");


/* =========================
   HTML PRVKY
========================= */

const photoArea =
  document.getElementById(
    "photoArea"
  );


const questionArea =
  document.getElementById(
    "questionArea"
  );


const answerArea =
  document.getElementById(
    "answerArea"
  );


const animalName =
  document.getElementById(
    "animalName"
  );


const message =
  document.getElementById(
    "message"
  );


const nextButton =
  document.getElementById(
    "nextButton"
  );


/* =========================
   NÁZEV SOUBORU
========================= */

function createFileName(name) {

  return String(name)
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "");

}


/* =========================
   POKROK
========================= */

function getProgress() {

  const saved =
    localStorage.getItem(
      progressKey
    );


  if (!saved) {

    return {
      total: 0,
      correct: 0,
      wrong: 0
    };

  }


  try {

    const progress =
      JSON.parse(saved);


    return {

      total:
        Number(progress.total) || 0,

      correct:
        Number(progress.correct) || 0,

      wrong:
        Number(progress.wrong) || 0

    };

  }
  catch {

    return {
      total: 0,
      correct: 0,
      wrong: 0
    };

  }

}


/* =========================
   ULOŽENÍ POKROKU
========================= */

function saveProgress(progress) {

  localStorage.setItem(
    progressKey,
    JSON.stringify(progress)
  );

}


/* =========================
   ZOBRAZENÍ POKROKU
========================= */

function showProgress() {

  const progress =
    getProgress();


  document.getElementById(
    "totalScore"
  ).textContent =
    progress.total;


  document.getElementById(
    "correctScore"
  ).textContent =
    progress.correct;


  document.getElementById(
    "wrongScore"
  ).textContent =
    progress.wrong;

}


/* =========================
   CHYBY
========================= */

function getMistakes() {

  const saved =
    localStorage.getItem(
      mistakesKey
    );


  if (!saved) {
    return [];
  }


  try {

    const mistakes =
      JSON.parse(saved);


    return Array.isArray(mistakes)
      ? mistakes
      : [];

  }
  catch {

    return [];

  }

}


/* =========================
   PŘIDÁNÍ DO CHYB
========================= */

function addMistake(item) {

  const mistakes =
    getMistakes();


  const exists =
    mistakes.some(
      function(savedItem) {

        if (
          typeof savedItem === "string"
        ) {

          return (
            savedItem === item.name
          );

        }


        return (
          savedItem &&
          savedItem.name ===
          item.name
        );

      }
    );


  if (!exists) {

    mistakes.push({

      card:
        item.card || "",

      name:
        item.name,

      image:
        item.image || ""

    });


    localStorage.setItem(
      mistakesKey,
      JSON.stringify(mistakes)
    );

  }

}


/* =========================
   ODSTRANĚNÍ Z CHYB
========================= */

function removeMistake(item) {

  const mistakes =
    getMistakes();


  const filtered =
    mistakes.filter(
      function(savedItem) {

        if (
          typeof savedItem === "string"
        ) {

          return (
            savedItem !==
            item.name
          );

        }


        return !(
          savedItem &&
          savedItem.name ===
          item.name
        );

      }
    );


  localStorage.setItem(
    mistakesKey,
    JSON.stringify(filtered)
  );

}


/* =========================
   PLACEHOLDER
========================= */

function showPlaceholder() {

  photoArea.innerHTML =
    '<div>' +
      '<div class="photo-icon">🖼️</div>' +
      '<strong>Fotografii doplníme</strong>' +
    '</div>';

}


/* =========================
   OBRÁZEK
========================= */

function showPhoto(item) {

  showPlaceholder();


  const baseName =
    createFileName(
      item.name
    );


  const possibleImages =
    [];


  if (item.image) {

    possibleImages.push(
      item.image
    );

  }


  possibleImages.push(

    baseName + ".webp",
    baseName + "-2.webp",
    baseName + "-3.webp",

    baseName + ".jpg",
    baseName + "-2.jpg",
    baseName + "-3.jpg",

    baseName + ".jpeg",
    baseName + "-2.jpeg",
    baseName + "-3.jpeg",

    baseName + ".png",
    baseName + "-2.png",
    baseName + "-3.png"

  );


  let attempt = 0;


  function tryNextImage() {

    if (
      attempt >=
      possibleImages.length
    ) {

      return;

    }


    const img =
      new Image();


    img.onload =
      function() {

        if (
          !currentAnimal ||
          currentAnimal.name !==
          item.name
        ) {

          return;

        }


        img.alt =
          item.name;


        photoArea.innerHTML =
          "";


        photoArea.appendChild(
          img
        );

      };


    img.onerror =
      function() {

        attempt++;

        tryNextImage();

      };


    img.src =
      possibleImages[attempt];

  }


  tryNextImage();

}


/* =========================
   ZASTAVENÍ ZVUKU
========================= */

function stopAnimalSound() {

  if (!animalAudio) {
    return;
  }


  try {

    animalAudio.pause();

    animalAudio.currentTime =
      0;

  }
  catch (error) {
  }


  animalAudio =
    null;

}


/* =========================
   PŘEHRÁNÍ NÁZVU
========================= */

function playCurrentAnimal() {

  if (!currentAnimal) {
    return;
  }


  stopAnimalSound();


  const fileName =
    createFileName(
      currentAnimal.name
    ) +
    ".mp3";


  const audioPath =
    "zivocichove/" +
    fileName;


  const audio =
    new Audio(
      audioPath
    );


  animalAudio =
    audio;


  audio.addEventListener(
    "ended",
    function() {

      if (
        animalAudio === audio
      ) {

        animalAudio =
          null;

      }

    },
    {
      once: true
    }
  );


  audio.addEventListener(
    "error",
    function() {

      if (
        animalAudio === audio
      ) {

        animalAudio =
          null;

      }

    },
    {
      once: true
    }
  );


  const playPromise =
    audio.play();


  if (
    playPromise &&
    typeof playPromise.catch ===
    "function"
  ) {

    playPromise.catch(
      function() {
      }
    );

  }

}


/* =========================
   NOVÝ ŽIVOČICH
========================= */

function chooseAnimal() {

  if (
    typeof animals === "undefined" ||
    !Array.isArray(animals) ||
    animals.length === 0
  ) {

    message.textContent =
      "Nepodařilo se načíst seznam živočichů.";

    return;

  }


  let available =
    animals;


  /*
    Pokud je možné, neopakujeme
    stejného živočicha hned po sobě.
  */

  if (
    animals.length > 1 &&
    lastAnimalName
  ) {

    available =
      animals.filter(
        function(item) {

          return (
            item.name !==
            lastAnimalName
          );

        }
      );

  }


  currentAnimal =
    available[
      Math.floor(
        Math.random() *
        available.length
      )
    ];


  lastAnimalName =
    currentAnimal.name;


  showPhoto(
    currentAnimal
  );


  animalName.textContent =
    currentAnimal.name;


  answered =
    false;


  questionArea.style.display =
    "block";


  answerArea.style.display =
    "none";


  nextButton.style.display =
    "none";


  message.textContent =
    "";


  message.className =
    "message";

}


/* =========================
   UKÁZAT ODPOVĚĎ
========================= */

function showAnswer() {

  questionArea.style.display =
    "none";


  answerArea.style.display =
    "block";


  /*
    Po odkrytí názvu ho rovnou
    přečteme.
  */

  playCurrentAnimal();

}


/* =========================
   VÝSLEDEK
========================= */

function saveAnswer(
  knewIt
) {

  if (
    answered ||
    !currentAnimal
  ) {

    return;

  }


  answered =
    true;


  const progress =
    getProgress();


  progress.total++;


  if (knewIt) {

    progress.correct++;


    removeMistake(
      currentAnimal
    );


    message.className =
      "message correct";


    message.textContent =
      "✅ Super, pokračujeme!";

  }
  else {

    progress.wrong++;


    addMistake(
      currentAnimal
    );


    message.className =
      "message wrong";


    message.textContent =
      "❤️ Uloženo do „Co mi nejde“.";

  }


  saveProgress(
    progress
  );


  showProgress();


  nextButton.style.display =
    "block";

}


/* =========================
   DALŠÍ
========================= */

function nextAnimal() {

  stopAnimalSound();


  chooseAnimal();


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =========================
   START
========================= */

showProgress();

chooseAnimal();


</script>

</body>

</html>
