<!DOCTYPE html>
<html lang="cs">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <title>Procvičování živočichů | Zlatá udice</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef7fb;
      color: #17324d;
    }


    .app {
      max-width: 600px;
      margin: auto;
      min-height: 100vh;
      padding: 20px;
    }


    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }


    .back {
      color: #567;
      text-decoration: none;
      font-weight: bold;
    }


    .player {
      color: #567;
      font-size: 14px;
      font-weight: bold;
    }


    .header {
      text-align: center;
      margin-bottom: 20px;
    }


    .header-icon {
      font-size: 42px;
    }


    .header h1 {
      margin: 5px 0;
      font-size: 28px;
    }


    .header p {
      margin: 0;
      color: #678;
    }


    /* =========================
       SKÓRE
    ========================= */


    .score {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 20px 0;
    }


    .score-box {
      background: white;
      border-radius: 14px;
      padding: 12px 5px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
    }


    .score-number {
      display: block;
      font-size: 22px;
      font-weight: bold;
    }


    .score-label {
      display: block;
      margin-top: 3px;
      font-size: 12px;
      color: #789;
    }


    /* =========================
       KARTA
    ========================= */


    .animal-card {
      background: white;
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      text-align: center;
    }


    .photo {
      width: 100%;
      min-height: 280px;
      background: #f3f7f9;
      border-radius: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #789;
      margin-bottom: 20px;
      overflow: hidden;
    }


    .animal-photo {
      display: block;
      width: 100%;
      height: auto;
      max-height: 420px;
      object-fit: contain;
      border-radius: 18px;
    }


    .photo-placeholder {
      width: 100%;
      min-height: 280px;
      border: 2px dashed #c7d8e2;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }


    .photo-icon {
      font-size: 60px;
      margin-bottom: 10px;
    }


    .question {
      font-size: 21px;
      font-weight: bold;
      margin: 5px 0 18px;
    }


    /* =========================
       ODPOVĚDI
    ========================= */


    .answers {
      display: grid;
      gap: 12px;
    }


    .answer-row {
      display: grid;
      grid-template-columns: 1fr 52px;
      gap: 8px;
    }


    .answer-button {
      width: 100%;
      border: 2px solid #d7e5ec;
      background: white;
      color: #17324d;
      border-radius: 14px;
      padding: 15px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      text-align: left;
    }


    .answer-button:active {
      transform: scale(0.99);
    }


    .answer-button.correct {
      background: #dff4e5;
      border-color: #65a876;
    }


    .answer-button.wrong {
      background: #f9dfdf;
      border-color: #c77;
    }


    .answer-button:disabled {
      cursor: default;
    }


    .answer-sound {
      border: none;
      border-radius: 14px;
      background: #e6f2f7;
      color: #17324d;
      font-size: 21px;
      cursor: pointer;
    }


    .answer-sound:active {
      transform: scale(0.96);
    }


    /* =========================
       VÝSLEDEK
    ========================= */


    .result {
      min-height: 28px;
      margin-top: 18px;
      font-size: 18px;
      font-weight: bold;
    }


    .result.correct {
      color: #387848;
    }


    .result.wrong {
      color: #a64f4f;
    }


    /* =========================
       DALŠÍ
    ========================= */


    .next-button {
      display: none;
      width: 100%;
      margin-top: 16px;
      border: none;
      border-radius: 14px;
      background: #17324d;
      color: white;
      padding: 16px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }


    .next-button:active {
      transform: scale(0.99);
    }


    .sound-message {
      min-height: 18px;
      margin-top: 12px;
      color: #789;
      font-size: 12px;
    }


    @media (max-width: 520px) {

      .app {
        padding: 15px;
      }


      .photo,
      .photo-placeholder {
        min-height: 220px;
      }


      .animal-photo {
        max-height: 340px;
      }


      .answer-button {
        font-size: 16px;
        padding: 14px 12px;
      }

    }

  </style>

</head>


<body>


<main class="app">


  <!-- HORNÍ LIŠTA -->

  <div class="topbar">

    <a
      class="back"
      href="zivocichove.html"
    >
      ← Živočichové
    </a>


    <div
      class="player"
      id="playerInfo"
    ></div>

  </div>


  <!-- HLAVIČKA -->

  <div class="header">

    <div class="header-icon">
      🎯 🦆
    </div>

    <h1>
      Procvičování
    </h1>

    <p>
      Poznej živočicha podle obrázku
    </p>

  </div>


  <!-- SKÓRE -->

  <div class="score">


    <div class="score-box">

      <span
        class="score-number"
        id="totalScore"
      >
        0
      </span>

      <span class="score-label">
        🎯 Procvičeno
      </span>

    </div>


    <div class="score-box">

      <span
        class="score-number"
        id="correctScore"
      >
        0
      </span>

      <span class="score-label">
        ✅ Správně
      </span>

    </div>


    <div class="score-box">

      <span
        class="score-number"
        id="wrongScore"
      >
        0
      </span>

      <span class="score-label">
        ❌ Chybně
      </span>

    </div>


  </div>


  <!-- KARTA -->

  <div class="animal-card">


    <!-- FOTOGRAFIE -->

    <div
      class="photo"
      id="photoArea"
    ></div>


    <!-- OTÁZKA -->

    <div class="question">
      Který živočich je na obrázku?
    </div>


    <!-- ODPOVĚDI -->

    <div
      class="answers"
      id="answers"
    ></div>


    <!-- VÝSLEDEK -->

    <div
      class="result"
      id="result"
    ></div>


    <!-- DALŠÍ -->

    <button
      class="next-button"
      id="nextButton"
      type="button"
      onclick="nextQuestion()"
    >
      Další otázka →
    </button>


    <div
      class="sound-message"
      id="soundMessage"
    ></div>


  </div>


</main>


<!-- ========================================
     DATA ŽIVOČICHŮ
======================================== -->

<script src="zivocichove-data.js"></script>


<script>


/* ========================================
   AKTUÁLNÍ OTÁZKA
======================================== */

let currentAnimal = null;

let currentAnswers = [];

let answered = false;

let lastAnimalName = "";

let animalAudio = null;


/* ========================================
   PROFILY
======================================== */

function getProfiles() {

  const saved =
    localStorage.getItem(
      "zlataUdiceProfiles"
    );


  if (!saved) {

    return [];

  }


  try {

    return JSON.parse(
      saved
    );

  }
  catch {

    return [];

  }

}


/* ========================================
   AKTIVNÍ HRÁČ
======================================== */

const activeProfileId =
  localStorage.getItem(
    "zlataUdiceActiveProfile"
  );


const activePlayer =
  getProfiles().find(
    function(profile) {

      return (
        profile.id ===
        activeProfileId
      );

    }
  );


if (activePlayer) {

  document.getElementById(
    "playerInfo"
  ).textContent =
    (activePlayer.avatar || "") +
    " " +
    (activePlayer.name || "");

}


/* ========================================
   KLÍČE PRO POKROK
======================================== */

const progressKey =
  "zlataUdiceAnimalProgress_" +
  (activeProfileId || "default");


const mistakesKey =
  "zlataUdiceAnimalMistakes_" +
  (activeProfileId || "default");


/* ========================================
   PRVKY STRÁNKY
======================================== */

const photoArea =
  document.getElementById(
    "photoArea"
  );


const answersArea =
  document.getElementById(
    "answers"
  );


const resultArea =
  document.getElementById(
    "result"
  );


const nextButton =
  document.getElementById(
    "nextButton"
  );


const soundMessage =
  document.getElementById(
    "soundMessage"
  );


const totalScore =
  document.getElementById(
    "totalScore"
  );


const correctScore =
  document.getElementById(
    "correctScore"
  );


const wrongScore =
  document.getElementById(
    "wrongScore"
  );


/* ========================================
   NÁZEV -> SOUBOR
======================================== */

function createFileName(name) {

  return String(name)
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "");

}


/* ========================================
   NÁHODNÉ POŘADÍ
======================================== */

function shuffle(array) {

  const copy =
    [...array];


  for (
    let i = copy.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      copy[i],
      copy[j]
    ] =
    [
      copy[j],
      copy[i]
    ];

  }


  return copy;

}


/* ========================================
   POKROK
======================================== */

function getProgress() {

  const saved =
    localStorage.getItem(
      progressKey
    );


  if (!saved) {

    return {
      total: 0,
      correct: 0,
      wrong: 0
    };

  }


  try {

    const data =
      JSON.parse(saved);


    return {

      total:
        Number(data.total) || 0,

      correct:
        Number(data.correct) || 0,

      wrong:
        Number(data.wrong) || 0

    };

  }
  catch {

    return {
      total: 0,
      correct: 0,
      wrong: 0
    };

  }

}


/* ========================================
   ULOŽENÍ POKROKU
======================================== */

function saveProgress(progress) {

  localStorage.setItem(
    progressKey,
    JSON.stringify(progress)
  );

}


/* ========================================
   ZOBRAZENÍ POKROKU
======================================== */

function showProgress() {

  const progress =
    getProgress();


  totalScore.textContent =
    progress.total;


  correctScore.textContent =
    progress.correct;


  wrongScore.textContent =
    progress.wrong;

}


/* ========================================
   CHYBY
======================================== */

function getMistakes() {

  const saved =
    localStorage.getItem(
      mistakesKey
    );


  if (!saved) {

    return [];

  }


  try {

    const data =
      JSON.parse(saved);


    return Array.isArray(data)
      ? data
      : [];

  }
  catch {

    return [];

  }

}


/* ========================================
   PŘIDÁNÍ DO CHYB
======================================== */

function addMistake(item) {

  const mistakes =
    getMistakes();


  const exists =
    mistakes.some(
      function(savedItem) {

        if (
          typeof savedItem === "string"
        ) {

          return (
            savedItem === item.name
          );

        }


        return (
          savedItem &&
          savedItem.name ===
          item.name
        );

      }
    );


  if (!exists) {

    /*
      Ukládáme celý objekt.
      Stránka Co mi nejde tak má
      k dispozici název, kartu i obrázek.
    */

    mistakes.push({

      card:
        item.card || "",

      name:
        item.name,

      image:
        item.image || ""

    });


    localStorage.setItem(
      mistakesKey,
      JSON.stringify(mistakes)
    );

  }

}


/* ========================================
   ODSTRANĚNÍ Z CHYB
======================================== */

function removeMistake(item) {

  const mistakes =
    getMistakes();


  const filtered =
    mistakes.filter(
      function(savedItem) {

        if (
          typeof savedItem === "string"
        ) {

          return (
            savedItem !== item.name
          );

        }


        return !(
          savedItem &&
          savedItem.name ===
          item.name
        );

      }
    );


  localStorage.setItem(
    mistakesKey,
    JSON.stringify(filtered)
  );

}


/* ========================================
   PLACEHOLDER
======================================== */

function showPlaceholder() {

  photoArea.innerHTML =
    '<div class="photo-placeholder">' +
      '<div class="photo-icon">🖼️</div>' +
      '<strong>Fotografii doplníme</strong>' +
      '<span>Pro tohoto živočicha zatím fotografii nemáme.</span>' +
    '</div>';

}


/* ========================================
   FOTOGRAFIE
======================================== */

function showPhoto(item) {

  showPlaceholder();


  const baseName =
    createFileName(
      item.name
    );


  const possibleImages =
    [];


  if (item.image) {

    possibleImages.push(
      item.image
    );

  }


  possibleImages.push(

    baseName + ".webp",
    baseName + "-2.webp",
    baseName + "-3.webp",

    baseName + ".jpg",
    baseName + "-2.jpg",
    baseName + "-3.jpg",

    baseName + ".jpeg",
    baseName + "-2.jpeg",
    baseName + "-3.jpeg",

    baseName + ".png",
    baseName + "-2.png",
    baseName + "-3.png"

  );


  let attempt = 0;


  function tryNextImage() {

    if (
      attempt >=
      possibleImages.length
    ) {

      return;

    }


    const img =
      new Image();


    img.onload =
      function() {

        if (
          !currentAnimal ||
          currentAnimal.name !==
          item.name
        ) {

          return;

        }


        img.className =
          "animal-photo";


        img.alt =
          item.name;


        photoArea.innerHTML =
          "";


        photoArea.appendChild(
          img
        );

      };


    img.onerror =
      function() {

        attempt++;

        tryNextImage();

      };


    img.src =
      possibleImages[attempt];

  }


  tryNextImage();

}


/* ========================================
   ZASTAVENÍ ZVUKU
======================================== */

function stopAnimalSound() {

  if (!animalAudio) {

    return;

  }


  try {

    animalAudio.pause();

    animalAudio.currentTime =
      0;

  }
  catch (error) {

  }


  animalAudio =
    null;

}


/* ========================================
   PŘEHRÁNÍ LIBOVOLNÉHO NÁZVU
======================================== */

function playAnimalName(name) {

  stopAnimalSound();


  const fileName =
    createFileName(
      name
    ) +
    ".mp3";


  /*
    MP3 živočichů jsou ve složce:

    zivocichove/
  */

  const audioPath =
    "zivocichove/" +
    fileName;


  soundMessage.textContent =
    "🔊 " +
    name;


  const audio =
    new Audio(
      audioPath
    );


  animalAudio =
    audio;


  audio.addEventListener(
    "ended",
    function() {

      if (
        animalAudio === audio
      ) {

        animalAudio =
          null;

      }


      soundMessage.textContent =
        "";

    },
    {
      once: true
    }
  );


  audio.addEventListener(
    "error",
    function() {

      if (
        animalAudio === audio
      ) {

        animalAudio =
          null;

      }


      soundMessage.textContent =
        "Zvuk nebyl nalezen.";

    },
    {
      once: true
    }
  );


  const promise =
    audio.play();


  if (
    promise &&
    typeof promise.catch ===
    "function"
  ) {

    promise.catch(
      function() {

        soundMessage.textContent =
          "Zvuk se nepodařilo přehrát.";

      }
    );

  }

}


/* ========================================
   VYTVOŘENÍ ODPOVĚDÍ
======================================== */

function createAnswers() {

  answersArea.innerHTML =
    "";


  currentAnswers.forEach(
    function(item) {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "answer-row";


      /*
        TLAČÍTKO ODPOVĚDI
      */

      const answerButton =
        document.createElement(
          "button"
        );


      answerButton.type =
        "button";


      answerButton.className =
        "answer-button";


      answerButton.textContent =
        item.name;


      answerButton.dataset.name =
        item.name;


      answerButton.onclick =
        function() {

          checkAnswer(
            item,
            answerButton
          );

        };


      /*
        TLAČÍTKO ZVUKU
      */

      const soundButton =
        document.createElement(
          "button"
        );


      soundButton.type =
        "button";


      soundButton.className =
        "answer-sound";


      soundButton.innerHTML =
        "🔊";


      soundButton.setAttribute(
        "aria-label",
        "Přehrát " +
        item.name
      );


      soundButton.onclick =
        function(event) {

          event.stopPropagation();


          playAnimalName(
            item.name
          );

        };


      row.appendChild(
        answerButton
      );


      row.appendChild(
        soundButton
      );


      answersArea.appendChild(
        row
      );

    }
  );

}


/* ========================================
   NOVÁ OTÁZKA
======================================== */

function newQuestion() {

  stopAnimalSound();


  answered =
    false;


  resultArea.textContent =
    "";


  resultArea.className =
    "result";


  nextButton.style.display =
    "none";


  soundMessage.textContent =
    "";


  if (
    typeof animals === "undefined" ||
    !Array.isArray(animals) ||
    animals.length < 4
  ) {

    resultArea.textContent =
      "Seznam živočichů se nepodařilo načíst.";

    return;

  }


  /*
    Aby se pokud možno neopakoval
    stejný živočich hned dvakrát.
  */

  let availableAnimals =
    animals;


  if (
    animals.length > 1 &&
    lastAnimalName
  ) {

    availableAnimals =
      animals.filter(
        function(item) {

          return (
            item.name !==
            lastAnimalName
          );

        }
      );

  }


  currentAnimal =
    availableAnimals[
      Math.floor(
        Math.random() *
        availableAnimals.length
      )
    ];


  lastAnimalName =
    currentAnimal.name;


  /*
    Tři špatné možnosti.
  */

  const wrongOptions =
    shuffle(
      animals.filter(
        function(item) {

          return (
            item.name !==
            currentAnimal.name
          );

        }
      )
    ).slice(
      0,
      3
    );


  /*
    Správná + tři špatné.
  */

  currentAnswers =
    shuffle(
      [
        currentAnimal,
        ...wrongOptions
      ]
    );


  showPhoto(
    currentAnimal
  );


  createAnswers();

}


/* ========================================
   KONTROLA ODPOVĚDI
======================================== */

function checkAnswer(
  selectedItem,
  selectedButton
) {

  if (answered) {

    return;

  }


  answered =
    true;


  const progress =
    getProgress();


  progress.total++;


  const buttons =
    document.querySelectorAll(
      ".answer-button"
    );


  buttons.forEach(
    function(button) {

      button.disabled =
        true;


      if (
        button.dataset.name ===
        currentAnimal.name
      ) {

        button.classList.add(
          "correct"
        );

      }

    }
  );


  /*
    SPRÁVNĚ
  */

  if (
    selectedItem.name ===
    currentAnimal.name
  ) {

    progress.correct++;


    selectedButton.classList.add(
      "correct"
    );


    resultArea.className =
      "result correct";


    resultArea.textContent =
      "✅ Správně! " +
      currentAnimal.name;


    /*
      Pokud už byl tento živočich
      v chybách, správná odpověď ho
      z chyb odstraní.
    */

    removeMistake(
      currentAnimal
    );

  }


  /*
    ŠPATNĚ
  */

  else {

    progress.wrong++;


    selectedButton.classList.add(
      "wrong"
    );


    resultArea.className =
      "result wrong";


    resultArea.textContent =
      "❌ Správná odpověď je: " +
      currentAnimal.name;


    /*
      Přidáme živočicha do
      Co mi nejde.
    */

    addMistake(
      currentAnimal
    );

  }


  saveProgress(
    progress
  );


  showProgress();


  nextButton.style.display =
    "block";

}


/* ========================================
   DALŠÍ OTÁZKA
======================================== */

function nextQuestion() {

  newQuestion();


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* ========================================
   START
======================================== */

showProgress();

newQuestion();


</script>


</body>

</html>
