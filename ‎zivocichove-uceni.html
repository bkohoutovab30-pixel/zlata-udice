<!DOCTYPE html>
<html lang="cs">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <title>
    Učení živočichů | Zlatá udice
  </title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef7fb;
      color: #17324d;
    }


    .app {
      max-width: 600px;
      margin: auto;
      min-height: 100vh;
      padding: 20px;
    }


    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }


    .back {
      color: #567;
      text-decoration: none;
      font-weight: bold;
    }


    .counter {
      color: #678;
      font-weight: bold;
    }


    .header {
      text-align: center;
      margin-bottom: 20px;
    }


    .header-icon {
      font-size: 42px;
    }


    .header h1 {
      margin: 5px 0;
      font-size: 28px;
    }


    
    .header p {
      margin: 0;
      color: #678;
    }


    /* ========================================
       KARTA ŽIVOČICHA
    ======================================== */

    .animal-card {
      background: white;
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      text-align: center;
    }


    /* ========================================
       FOTOGRAFIE
    ======================================== */

    .photo {
      width: 100%;
      min-height: 280px;
      background: #f3f7f9;
      border-radius: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #789;
      margin-bottom: 22px;
      overflow: hidden;
    }


    .animal-photo {
      width: 100%;
      height: auto;
      max-height: 420px;
      object-fit: contain;
      display: block;
      border-radius: 18px;
    }


    .photo-placeholder {
      width: 100%;
      min-height: 280px;
      border: 2px dashed #c7d8e2;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }


    .photo-icon {
      font-size: 60px;
      margin-bottom: 10px;
    }


    .animal-number {
      display: inline-block;
      background: #dfeef5;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 10px;
    }


    .animal-name {
      font-size: 30px;
      margin: 5px 0 18px;
    }


    /* ========================================
       ZVUK
    ======================================== */

    .sound-button {
      border: none;
      background: #e6f2f7;
      color: #17324d;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }


    .sound-button:active {
      transform: scale(0.97);
    }


    .sound-note {
      color: #789;
      font-size: 13px;
      margin-top: 8px;
    }


    /* ========================================
       NAVIGACE
    ======================================== */

    .navigation {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }


    .nav-button {
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }


    .previous {
      background: white;
      color: #17324d;
    }


    .next {
      background: #17324d;
      color: white;
    }


    .nav-button:disabled {
      opacity: 0.4;
      cursor: default;
    }


    .jump {
      margin-top: 20px;
    }


    select {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid #c7d8e2;
      background: white;
      color: #17324d;
      font-size: 16px;
    }


    /* ========================================
       MOBIL
    ======================================== */

    @media (max-width: 520px) {

      .app {
        padding: 15px;
      }


      .photo,
      .photo-placeholder {
        min-height: 220px;
      }


      .animal-photo {
        max-height: 340px;
      }


      .animal-name {
        font-size: 26px;
      }

    }

  </style>

</head>


<body>


<main class="app">


  <!-- ========================================
       HORNÍ LIŠTA
  ======================================== -->


  <div class="topbar">

    <a
      class="back"
      href="zivocichove.html"
    >
      ← Živočichové
    </a>


    <span
      class="counter"
      id="counter"
    >
    </span>

  </div>


  <!-- ========================================
       NADPIS
  ======================================== -->


  <div class="header">

    <div class="header-icon">
      📖 🦆
    </div>

    <h1>
      Učení
    </h1>

    <p>
      Procházej živočichy jednoho po druhém
    </p>

  </div>


  <!-- ========================================
       KARTA ŽIVOČICHA
  ======================================== -->


  <div class="animal-card">


    <div
      class="photo"
      id="photoArea"
    >
    </div>


    <div
      class="animal-number"
      id="animalNumber"
    >
    </div>


    <h2
      class="animal-name"
      id="animalName"
    >
    </h2>


    <button
      class="sound-button"
      onclick="playName()"
    >
      🔊 Přehrát název
    </button>


    <div class="sound-note">
      Klepni a poslechni si název
    </div>


  </div>


  <!-- ========================================
       NAVIGACE
  ======================================== -->


  <div class="navigation">


    <button
      class="nav-button previous"
      id="previousButton"
      onclick="previousAnimal()"
    >
      ← Předchozí
    </button>


    <button
      class="nav-button next"
      id="nextButton"
      onclick="nextAnimal()"
    >
      Další →
    </button>


  </div>


  <!-- ========================================
       VÝBĚR ŽIVOČICHA
  ======================================== -->


  <div class="jump">


    <select
      id="animalSelect"
      onchange="jumpToAnimal()"
    >

      <option
        value=""
        selected
        disabled
      >
        Vybrat živočicha…
      </option>

    </select>


  </div>


</main>


<!-- ========================================
     SPOLEČNÝ SEZNAM ŽIVOČICHŮ
======================================== -->


<script src="zivocichove-data.js"></script>


<!-- ========================================
     SPOLEČNÝ SYSTÉM ZVUKU
======================================== -->


<script src="zvuk.js"></script>


<script>


/* =========================================
   ZÁKLAD
========================================= */


let currentAnimal = 0;


const animalName =
  document.getElementById(
    "animalName"
  );


const animalNumber =
  document.getElementById(
    "animalNumber"
  );


const counter =
  document.getElementById(
    "counter"
  );


const previousButton =
  document.getElementById(
    "previousButton"
  );


const nextButton =
  document.getElementById(
    "nextButton"
  );


const animalSelect =
  document.getElementById(
    "animalSelect"
  );


const photoArea =
  document.getElementById(
    "photoArea"
  );


/* =========================================
   NAJÍT SEZNAM ŽIVOČICHŮ

   Podporujeme více možných názvů,
   kdyby byl seznam ve starším souboru
   pojmenovaný jinak.
========================================= */


function getAnimalList() {

  if (
    typeof animals !== "undefined" &&
    Array.isArray(animals)
  ) {
    return animals;
  }


  if (
    typeof zivocichove !== "undefined" &&
    Array.isArray(zivocichove)
  ) {
    return zivocichove;
  }


  if (
    typeof animalData !== "undefined" &&
    Array.isArray(animalData)
  ) {
    return animalData;
  }


  return [];

}


const animalList =
  getAnimalList();


/* =========================================
   NÁZEV -> NÁZEV SOUBORU
========================================= */


function createImageName(name) {

  return name

    .normalize("NFD")

    .replace(
      /[\u0300-\u036f]/g,
      ""
    )

    .toLowerCase()

    .replace(
      /[^a-z0-9]+/g,
      "-"
    )

    .replace(
      /^-+|-+$/g,
      ""
    );

}


/* =========================================
   ROZBALOVACÍ SEZNAM
========================================= */


function createAnimalSelect() {


  animalList.forEach(
    (item, index) => {


      const option =
        document.createElement(
          "option"
        );


      option.value =
        index;


      if (item.card) {

        option.textContent =
          item.card +
          ". " +
          item.name;

      }

      else {

        option.textContent =
          item.name;

      }


      animalSelect.appendChild(
        option
      );

    }
  );

}


/* =========================================
   PLACEHOLDER
========================================= */


function showPlaceholder() {


  photoArea.innerHTML = `

    <div class="photo-placeholder">

      <div class="photo-icon">
        🖼️
      </div>

      <strong>
        Fotografii doplníme
      </strong>

      <span>
        Pro tohoto živočicha zatím fotografii nemáme.
      </span>

    </div>

  `;

}


/* =========================================
   AUTOMATICKÉ HLEDÁNÍ FOTKY
========================================= */


function showPhoto(item) {


  showPlaceholder();


  const possibleImages = [];


  /*
    Pokud je obrázek přímo uvedený
    v zivocichove-data.js,
    zkusíme ho jako první.
  */


  if (item.image) {

    possibleImages.push(
      item.image
    );

  }


  const baseName =
    createImageName(
      item.name
    );


  /*
    Automaticky zkoušíme názvy
    podle názvu živočicha.
  */


  possibleImages.push(

    baseName + ".webp",
    baseName + "-2.webp",
    baseName + "-3.webp",

    baseName + ".jpg",
    baseName + "-2.jpg",
    baseName + "-3.jpg",

    baseName + ".jpeg",
    baseName + "-2.jpeg",

    baseName + ".png",
    baseName + "-2.png"

  );


  let attempt = 0;


  function tryNextImage() {


    if (
      attempt >=
      possibleImages.length
    ) {

      return;

    }


    const img =
      new Image();


    img.onload = function() {


      /*
        Pokud už uživatel přešel
        na jiného živočicha,
        starý obrázek nezobrazíme.
      */


      if (
        animalList[currentAnimal].name
        !== item.name
      ) {

        return;

      }


      img.className =
        "animal-photo";


      img.alt =
        item.name;


      photoArea.innerHTML =
        "";


      photoArea.appendChild(
        img
      );

    };


    img.onerror = function() {

      attempt++;

      tryNextImage();

    };


    img.src =
      possibleImages[attempt];

  }


  tryNextImage();

}


/* =========================================
   ZOBRAZENÍ ŽIVOČICHA
========================================= */


function showAnimal() {


  if (
    animalList.length === 0
  ) {

    animalName.textContent =
      "Seznam živočichů se nepodařilo načíst";


    animalNumber.style.display =
      "none";


    counter.textContent =
      "0 / 0";


    previousButton.disabled =
      true;


    nextButton.disabled =
      true;


    showPlaceholder();


    console.error(
      "V zivocichove-data.js nebyl nalezen seznam animals."
    );


    return;

  }


  const item =
    animalList[currentAnimal];


  animalName.textContent =
    item.name;


  /*
    Některé položky nemusí
    mít číslo karty.
  */


  if (item.card) {


    animalNumber.style.display =
      "inline-block";


    animalNumber.textContent =
      "Karta č. " +
      item.card;

  }

  else {


    animalNumber.style.display =
      "none";

  }


  counter.textContent =
    (currentAnimal + 1) +
    " / " +
    animalList.length;


  previousButton.disabled =
    currentAnimal === 0;


  nextButton.disabled =
    currentAnimal ===
    animalList.length - 1;


  animalSelect.value =
    "";


  showPhoto(
    item
  );

}


/* =========================================
   ZVUK
========================================= */


function playName() {


  if (
    animalList.length === 0
  ) {
    return;
  }


  const item =
    animalList[currentAnimal];


  /*
    Nejprve hledáme připravené MP3:

    audio/zivocichove/nazev-zivocicha.mp3

    Pokud MP3 neexistuje,
    zvuk.js použije hlas zařízení.
  */


  playNamedSound(
    item.name,
    "audio/zivocichove"
  );

}


/* =========================================
   DALŠÍ ŽIVOČICH
========================================= */


function nextAnimal() {


  stopSound();


  if (
    currentAnimal <
    animalList.length - 1
  ) {


    currentAnimal++;


    showAnimal();


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }

}


/* =========================================
   PŘEDCHOZÍ ŽIVOČICH
========================================= */


function previousAnimal() {


  stopSound();


  if (
    currentAnimal > 0
  ) {


    currentAnimal--;


    showAnimal();


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }

}


/* =========================================
   SKOK ZE SEZNAMU
========================================= */


function jumpToAnimal() {


  if (
    animalSelect.value === ""
  ) {

    return;

  }


  stopSound();


  currentAnimal =
    Number(
      animalSelect.value
    );


  showAnimal();


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =========================================
   START
========================================= */


createAnimalSelect();


showAnimal();


</script>


</body>

</html>
