<!-- =========================================
     SPOLEČNÝ SEZNAM ROSTLIN
========================================= -->

<script src="rostliny-data.js"></script>


<!-- =========================================
     SPOLEČNÝ ZVUK
========================================= -->

<script src="zvuk.js"></script>


<script>

/* =========================================
   PROFIL
========================================= */

const activeProfileId =
  localStorage.getItem(
    "zlataUdiceActiveProfile"
  );


if (!activeProfileId) {

  window.location.href =
    "profily.html";

}


function getProfiles() {

  const saved =
    localStorage.getItem(
      "zlataUdiceProfiles"
    );


  if (!saved) {

    return [];

  }


  try {

    return JSON.parse(
      saved
    );

  }

  catch {

    return [];

  }

}


const activePlayer =
  getProfiles().find(
    profile =>
      profile.id ===
      activeProfileId
  );


if (!activePlayer) {

  localStorage.removeItem(
    "zlataUdiceActiveProfile"
  );


  window.location.href =
    "profily.html";

}

else {

  document
    .getElementById(
      "playerInfo"
    )
    .textContent =
      activePlayer.avatar +
      " " +
      activePlayer.name;

}


/* =========================================
   ULOŽENÁ DATA HRÁČE
========================================= */

const mistakesKey =
  "zlataUdicePlantMistakes_" +
  activeProfileId;


const progressKey =
  "zlataUdicePlantProgress_" +
  activeProfileId;


/* =========================================
   PROMĚNNÉ
========================================= */

let currentPlant = 0;

let previousPlant = -1;

let sessionTotal = 0;

let sessionCorrect = 0;

let sessionWrong = 0;


const plantName =
  document.getElementById(
    "plantName"
  );


const photoArea =
  document.getElementById(
    "photoArea"
  );


const questionArea =
  document.getElementById(
    "questionArea"
  );


const answerArea =
  document.getElementById(
    "answerArea"
  );


const totalScore =
  document.getElementById(
    "totalScore"
  );


const correctScore =
  document.getElementById(
    "correctScore"
  );


const wrongScore =
  document.getElementById(
    "wrongScore"
  );


/* =========================================
   ID ROSTLINY

   Číslované rostliny používají číslo karty.
   Nečíslované rostliny používají název.
========================================= */

function getPlantId(item) {

  if (
    item.card !== undefined &&
    item.card !== null &&
    String(item.card).trim() !== ""
  ) {

    return String(
      item.card
    );

  }


  return item.name;

}


/* =========================================
   TEXT -> NÁZEV SOUBORU
========================================= */

function createFileName(text) {

  return text
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "");

}


/* =========================================
   PLACEHOLDER
========================================= */

function showPlaceholder() {

  photoArea.innerHTML = `

    <div class="photo-icon">
      🖼️
    </div>

    <strong>
      Fotografii doplníme
    </strong>

    <span>
      Pro tuto rostlinu zatím fotografii nemáme.
    </span>

  `;

}


/* =========================================
   FOTOGRAFIE
========================================= */

function showPhoto(item) {

  showPlaceholder();


  const baseName =
    createFileName(
      item.name
    );


  const possibleImages = [];


  if (item.image) {

    possibleImages.push(
      item.image
    );

  }


  possibleImages.push(

    baseName + ".webp",
    baseName + "-2.webp",
    baseName + "-3.webp",

    baseName + ".jpg",
    baseName + "-2.jpg",
    baseName + "-3.jpg",

    baseName + ".jpeg",
    baseName + "-2.jpeg",

    baseName + ".png",
    baseName + "-2.png"

  );


  const uniqueImages =
    [...new Set(
      possibleImages
    )];


  let attempt = 0;


  function tryNextImage() {

    if (
      attempt >=
      uniqueImages.length
    ) {

      return;

    }


    const img =
      new Image();


    img.onload =
      function() {

        if (
          plants[currentPlant] !==
          item
        ) {

          return;

        }


        img.alt =
          item.name;


        photoArea.innerHTML =
          "";


        photoArea.appendChild(
          img
        );

      };


    img.onerror =
      function() {

        attempt++;


        tryNextImage();

      };


    img.src =
      uniqueImages[
        attempt
      ];

  }


  tryNextImage();

}


/* =========================================
   NÁHODNÁ ROSTLINA
========================================= */

function chooseRandomPlant() {

  /*
    Zastaví předchozí MP3.
  */

  stopSound();


  let newPlant;


  do {

    newPlant =
      Math.floor(
        Math.random() *
        plants.length
      );

  }

  while (
    plants.length > 1 &&
    newPlant === previousPlant
  );


  currentPlant =
    newPlant;


  previousPlant =
    newPlant;


  const item =
    plants[
      currentPlant
    ];


  plantName.textContent =
    item.name;


  showPhoto(
    item
  );


  questionArea.style.display =
    "block";


  answerArea.style.display =
    "none";

}


/* =========================================
   ZOBRAZIT ODPOVĚĎ
========================================= */

function showAnswer() {

  questionArea.style.display =
    "none";


  answerArea.style.display =
    "block";

}


/* =========================================
   ZVUK
========================================= */

function playName() {

  const item =
    plants[
      currentPlant
    ];


  /*
    Například:

    Blatouch bahenní

    se pomocí zvuk.js převede na:

    audio/rostliny/blatouch-bahenni.mp3
  */


  playNamedSound(
    item.name,
    "audio/rostliny"
  );

}


/* =========================================
   NAČTENÍ CHYB
========================================= */

function getMistakes() {

  const saved =
    localStorage.getItem(
      mistakesKey
    );


  if (!saved) {

    return [];

  }


  try {

    const parsed =
      JSON.parse(
        saved
      );


    return Array.isArray(
      parsed
    )
      ? parsed
      : [];

  }

  catch {

    return [];

  }

}


/* =========================================
   ULOŽENÍ CHYB
========================================= */

function saveMistakes(
  mistakes
) {

  localStorage.setItem(
    mistakesKey,
    JSON.stringify(
      mistakes
    )
  );

}


/* =========================================
   PŘIDAT DO CO MI NEJDE
========================================= */

function addToMistakes(
  item
) {

  const mistakes =
    getMistakes();


  const plantId =
    getPlantId(
      item
    );


  const alreadyExists =
    mistakes.some(
      mistake =>
        getPlantId(
          mistake
        ) ===
        plantId
    );


  if (!alreadyExists) {

    mistakes.push(
      item
    );


    saveMistakes(
      mistakes
    );

  }

}


/* =========================================
   ODEBRAT Z CO MI NEJDE
========================================= */

function removeFromMistakes(
  plantId
) {

  let mistakes =
    getMistakes();


  mistakes =
    mistakes.filter(
      item =>
        getPlantId(
          item
        ) !==
        plantId
    );


  saveMistakes(
    mistakes
  );

}


/* =========================================
   DLOUHODOBÝ POKROK
========================================= */

function getProgress() {

  const saved =
    localStorage.getItem(
      progressKey
    );


  if (!saved) {

    return {

      total: 0,

      correct: 0,

      wrong: 0

    };

  }


  try {

    const progress =
      JSON.parse(
        saved
      );


    return {

      total:
        Number(
          progress.total
        ) || 0,

      correct:
        Number(
          progress.correct
        ) || 0,

      wrong:
        Number(
          progress.wrong
        ) || 0

    };

  }

  catch {

    return {

      total: 0,

      correct: 0,

      wrong: 0

    };

  }

}


/* =========================================
   ULOŽENÍ POKROKU
========================================= */

function saveProgress(
  knewIt
) {

  const progress =
    getProgress();


  progress.total++;


  if (knewIt) {

    progress.correct++;

  }

  else {

    progress.wrong++;

  }


  localStorage.setItem(
    progressKey,
    JSON.stringify(
      progress
    )
  );

}


/* =========================================
   ODPOVĚĎ
========================================= */

function answer(
  knewIt
) {

  stopSound();


  const item =
    plants[
      currentPlant
    ];


  sessionTotal++;


  if (knewIt) {

    sessionCorrect++;


    removeFromMistakes(
      getPlantId(
        item
      )
    );

  }

  else {

    sessionWrong++;


    addToMistakes(
      item
    );

  }


  saveProgress(
    knewIt
  );


  updateScore();


  chooseRandomPlant();

}


/* =========================================
   SKÓRE
========================================= */

function updateScore() {

  totalScore.textContent =
    sessionTotal;


  correctScore.textContent =
    sessionCorrect;


  wrongScore.textContent =
    sessionWrong;

}


/* =========================================
   START
========================================= */

chooseRandomPlant();

</script>

</body>

</html>
