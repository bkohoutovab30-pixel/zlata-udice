<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">

  <title>Učení rostlin | Zlatá udice</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef7fb;
      color: #17324d;
    }

    .app {
      max-width: 600px;
      margin: auto;
      min-height: 100vh;
      padding: 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .back {
      color: #567;
      text-decoration: none;
      font-weight: bold;
    }

    .counter {
      color: #678;
      font-weight: bold;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header-icon {
      font-size: 42px;
    }

    .header h1 {
      margin: 5px 0;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      color: #678;
    }

    .plant-card {
      background: white;
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      text-align: center;
    }

    /* FOTOGRAFIE */

    .photo {
      width: 100%;
      min-height: 280px;
      background: #f3f7f9;
      border-radius: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #789;
      margin-bottom: 22px;
      overflow: hidden;
    }

    .plant-photo {
      width: 100%;
      height: auto;
      max-height: 420px;
      object-fit: contain;
      display: block;
      border-radius: 18px;
    }

    .photo-placeholder {
      width: 100%;
      min-height: 280px;
      border: 2px dashed #c7d8e2;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .photo-icon {
      font-size: 60px;
      margin-bottom: 10px;
    }

    .plant-number {
      display: inline-block;
      background: #dfeef5;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .plant-name {
      font-size: 30px;
      margin: 5px 0 18px;
    }

    .sound-button {
      border: none;
      background: #e6f2f7;
      color: #17324d;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .sound-button:active {
      transform: scale(0.97);
    }

    .sound-note {
      color: #789;
      font-size: 13px;
      margin-top: 8px;
    }

    /* NAVIGACE */

    .navigation {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }

    .nav-button {
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .previous {
      background: white;
      color: #17324d;
    }

    .next {
      background: #17324d;
      color: white;
    }

    .nav-button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .jump {
      margin-top: 20px;
    }

    select {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid #c7d8e2;
      background: white;
      color: #17324d;
      font-size: 16px;
    }

    @media (max-width: 520px) {

      .app {
        padding: 15px;
      }

      .photo,
      .photo-placeholder {
        min-height: 220px;
      }

      .plant-photo {
        max-height: 340px;
      }

      .plant-name {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

<main class="app">

  <div class="topbar">

    <a class="back" href="rostliny.html">
      ← Rostliny
    </a>

    <span
      class="counter"
      id="counter">
    </span>

  </div>


  <div class="header">

    <div class="header-icon">
      📖 🌿
    </div>

    <h1>Učení</h1>

    <p>
      Procházej rostliny jednu po druhé
    </p>

  </div>


  <div class="plant-card">

    <div
      class="photo"
      id="photoArea">
    </div>


    <div
      class="plant-number"
      id="plantNumber">
    </div>


    <h2
      class="plant-name"
      id="plantName">
    </h2>


    <button
      class="sound-button"
      onclick="playName()">
      🔊 Přehrát název
    </button>


    <div class="sound-note">
      Klepni a poslechni si název
    </div>

  </div>


  <div class="navigation">

    <button
      class="nav-button previous"
      id="previousButton"
      onclick="previousPlant()">
      ← Předchozí
    </button>


    <button
      class="nav-button next"
      id="nextButton"
      onclick="nextPlant()">
      Další →
    </button>

  </div>


  <div class="jump">

    <select
      id="plantSelect"
      onchange="jumpToPlant()">

      <option
        value=""
        selected
        disabled>
        Vybrat rostlinu…
      </option>

    </select>

  </div>

</main>


<!-- SPOLEČNÝ SEZNAM ROSTLIN -->

<script src="rostliny-data.js"></script>


<script>

/* =========================================
   ZÁKLAD
========================================= */

let currentPlant = 0;


const plantName =
  document.getElementById("plantName");

const plantNumber =
  document.getElementById("plantNumber");

const counter =
  document.getElementById("counter");

const previousButton =
  document.getElementById("previousButton");

const nextButton =
  document.getElementById("nextButton");

const plantSelect =
  document.getElementById("plantSelect");

const photoArea =
  document.getElementById("photoArea");


/* =========================================
   NÁZEV -> NÁZEV SOUBORU
========================================= */

function createImageName(name) {

  return name

    .normalize("NFD")

    .replace(
      /[\u0300-\u036f]/g,
      ""
    )

    .toLowerCase()

    .replace(
      /[^a-z0-9]+/g,
      "-"
    )

    .replace(
      /^-+|-+$/g,
      ""
    );

}


/* =========================================
   ROZBALOVACÍ SEZNAM
========================================= */

function createPlantSelect() {

  plants.forEach(
    (item, index) => {

      const option =
        document.createElement("option");


      option.value =
        index;


      if (item.card) {

        option.textContent =
          item.card +
          ". " +
          item.name;

      }
      else {

        option.textContent =
          item.name;

      }


      plantSelect.appendChild(
        option
      );

    }
  );

}


/* =========================================
   PLACEHOLDER
========================================= */

function showPlaceholder() {

  photoArea.innerHTML = `

    <div class="photo-placeholder">

      <div class="photo-icon">
        🖼️
      </div>

      <strong>
        Fotografii doplníme
      </strong>

      <span>
        Pro tuto rostlinu zatím fotografii nemáme.
      </span>

    </div>

  `;

}


/* =========================================
   AUTOMATICKÉ HLEDÁNÍ FOTKY
========================================= */

function showPhoto(item) {

  showPlaceholder();


  /*
    Pokud by někdy byla fotografie
    zadaná přímo v rostliny-data.js,
    zkusíme ji jako první.
  */

  const possibleImages = [];


  if (item.image) {

    possibleImages.push(
      item.image
    );

  }


  const baseName =
    createImageName(
      item.name
    );


  /*
    Potom automaticky zkoušíme
    názvy souborů podle názvu rostliny.
  */

  possibleImages.push(

    baseName + ".webp",
    baseName + "-2.webp",
    baseName + "-3.webp",

    baseName + ".jpg",
    baseName + "-2.jpg",
    baseName + "-3.jpg",

    baseName + ".jpeg",
    baseName + "-2.jpeg",

    baseName + ".png",
    baseName + "-2.png"

  );


  let attempt = 0;


  function tryNextImage() {

    if (
      attempt >=
      possibleImages.length
    ) {

      return;

    }


    const img =
      new Image();


    img.onload = function() {

      /*
        Pokud už uživatel přešel
        na jinou rostlinu,
        starý obrázek nezobrazíme.
      */

      if (
        plants[currentPlant].name
        !== item.name
      ) {

        return;

      }


      img.className =
        "plant-photo";


      img.alt =
        item.name;


      photoArea.innerHTML =
        "";


      photoArea.appendChild(
        img
      );

    };


    img.onerror = function() {

      attempt++;

      tryNextImage();

    };


    img.src =
      possibleImages[attempt];

  }


  tryNextImage();

}


/* =========================================
   ZOBRAZENÍ ROSTLINY
========================================= */

function showPlant() {

  const item =
    plants[currentPlant];


  plantName.textContent =
    item.name;


  if (item.card) {

    plantNumber.style.display =
      "inline-block";


    plantNumber.textContent =
      "Karta č. " +
      item.card;

  }
  else {

    plantNumber.style.display =
      "none";

  }


  counter.textContent =
    (currentPlant + 1) +
    " / " +
    plants.length;


  previousButton.disabled =
    currentPlant === 0;


  nextButton.disabled =
    currentPlant ===
    plants.length - 1;


  plantSelect.value =
    "";


  showPhoto(
    item
  );

}


/* =========================================
   ZVUK
========================================= */

function playName() {

  if (
    !(
      "speechSynthesis"
      in window
    )
  ) {

    return;

  }


  window.speechSynthesis.cancel();


  const item =
    plants[currentPlant];


  const speech =
    new SpeechSynthesisUtterance(
      item.name
    );


  speech.lang =
    "cs-CZ";


  speech.rate =
    0.85;


  speech.pitch =
    1;


  const voices =
    window.speechSynthesis.getVoices();


  const czechVoice =
    voices.find(
      voice =>
        voice.lang &&
        voice.lang
          .toLowerCase()
          .startsWith("cs")
    );


  if (czechVoice) {

    speech.voice =
      czechVoice;

  }


  window.speechSynthesis.speak(
    speech
  );

}


/* =========================================
   DALŠÍ
========================================= */

function nextPlant() {

  if (
    "speechSynthesis"
    in window
  ) {

    window.speechSynthesis.cancel();

  }


  if (
    currentPlant <
    plants.length - 1
  ) {

    currentPlant++;


    showPlant();


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }

}


/* =========================================
   PŘEDCHOZÍ
========================================= */

function previousPlant() {

  if (
    "speechSynthesis"
    in window
  ) {

    window.speechSynthesis.cancel();

  }


  if (
    currentPlant > 0
  ) {

    currentPlant--;


    showPlant();


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }

}


/* =========================================
   SKOK ZE SEZNAMU
========================================= */

function jumpToPlant() {

  if (
    plantSelect.value === ""
  ) {

    return;

  }


  if (
    "speechSynthesis"
    in window
  ) {

    window.speechSynthesis.cancel();

  }


  currentPlant =
    Number(
      plantSelect.value
    );


  showPlant();


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =========================================
   START
========================================= */

createPlantSelect();

showPlant();

</script>

</body>
</html>
