<!DOCTYPE html>
<html lang="cs">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Procvičování otázek | Zlatá udice</title>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef7fb;
      color: #17324d;
    }

    .app {
      max-width: 700px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 20px;
    }


    /* ==============================
       HORNÍ LIŠTA
    ============================== */

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .back {
      color: #567;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
    }

    .counter {
      color: #678;
      font-weight: bold;
      font-size: 16px;
      text-align: right;
    }


    /* ==============================
       HLAVIČKA
    ============================== */

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header-icon {
      font-size: 46px;
      margin-bottom: 4px;
    }

    .header h1 {
      margin: 5px 0;
      font-size: 30px;
    }

    .header p {
      margin: 5px 0 0 0;
      color: #678;
      font-size: 17px;
    }


    /* ==============================
       VÝBĚR OBLASTI
    ============================== */

    .category-box {
      background: white;
      padding: 18px;
      border-radius: 20px;
      margin-bottom: 22px;

      box-shadow:
        0 4px 15px rgba(0,0,0,0.06);
    }

    .category-box label {
      display: block;
      font-weight: bold;
      margin-bottom: 10px;
      color: #567;
    }

    .category-select {
      width: 100%;
      padding: 14px 16px;

      border: 2px solid #d7e4ea;
      border-radius: 13px;

      background: white;
      color: #17324d;

      font-size: 16px;
      font-weight: bold;

      outline: none;
    }


    /* ==============================
       KARTA OTÁZKY
    ============================== */

    .question-card {
      background: white;

      border-radius: 22px;

      padding: 26px;

      box-shadow:
        0 4px 15px rgba(0,0,0,0.07);
    }

    .question-category {
      color: #789;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .question-number {
      color: #789;
      font-size: 14px;
      margin-bottom: 20px;
    }


    /* ==============================
       OTÁZKA
    ============================== */

    .question-row {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 26px;
    }

    .question-text {
      flex: 1;

      font-size: 21px;
      line-height: 1.45;
      font-weight: bold;
    }


    /* ==============================
       ZVUK OTÁZKY
    ============================== */

    .sound-button {
      flex-shrink: 0;

      width: 54px;
      height: 54px;

      border: none;
      border-radius: 50%;

      background: #e8f4f9;

      font-size: 22px;

      cursor: pointer;
    }

    .sound-button:active {
      transform: scale(0.95);
    }


    /* ==============================
       ODPOVĚDI
    ============================== */

    .answers {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .answer-row {
      display: flex;
      align-items: stretch;
      gap: 9px;
    }

    .answer-button {
      flex: 1;

      min-height: 70px;

      border: 2px solid #dbe7ec;
      border-radius: 16px;

      background: #f8fbfc;
      color: #17324d;

      padding: 15px 18px;

      font-size: 16px;
      line-height: 1.4;
      font-weight: bold;

      text-align: left;

      cursor: pointer;

      transition:
        background 0.15s,
        border-color 0.15s,
        transform 0.1s;
    }

    .answer-button:hover {
      background: #f0f8fb;
    }

    .answer-button:active {
      transform: scale(0.99);
    }

    .answer-button:disabled {
      cursor: default;
      opacity: 1;
    }


    /* ==============================
       ZVUK ODPOVĚDI
    ============================== */

    .answer-sound {
      width: 58px;
      min-width: 58px;

      border: none;
      border-radius: 16px;

      background: #e8f4f9;

      font-size: 21px;

      cursor: pointer;
    }

    .answer-sound:active {
      transform: scale(0.96);
    }


    /* ==============================
       SPRÁVNĚ / CHYBNĚ
    ============================== */

    .answer-button.correct {
      background: #e5f7e9;
      border-color: #62b574;
      color: #225d2e;
    }

    .answer-button.wrong {
      background: #fde8e8;
      border-color: #dc6f6f;
      color: #8a2929;
    }


    /* ==============================
       VÝSLEDEK
    ============================== */

    .result {
      display: none;

      margin-top: 20px;
      padding: 16px;

      border-radius: 15px;

      font-size: 17px;
      line-height: 1.45;
      font-weight: bold;

      text-align: center;
    }

    .result.correct {
      display: block;
      background: #e5f7e9;
      color: #225d2e;
    }

    .result.wrong {
      display: block;
      background: #fde8e8;
      color: #8a2929;
    }


    /* ==============================
       DALŠÍ OTÁZKA
    ============================== */

    .next-button {
      display: none;

      width: 100%;

      margin-top: 16px;
      padding: 16px;

      border: none;
      border-radius: 15px;

      background: #17324d;
      color: white;

      font-size: 17px;
      font-weight: bold;

      cursor: pointer;
    }

    .next-button.show {
      display: block;
    }

    .next-button:active {
      transform: scale(0.99);
    }


    /* ==============================
       STATISTIKA
    ============================== */

    .stats {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;

      gap: 22px;

      margin-top: 20px;

      color: #678;

      font-size: 14px;
      font-weight: bold;
    }

    .stat-good {
      color: #37834a;
    }

    .stat-bad {
      color: #b84d4d;
    }


    /* ==============================
       DOKONČENÍ BALÍKU
    ============================== */

    .finished {
      display: none;

      background: white;
      border-radius: 22px;

      padding: 30px 25px;

      text-align: center;

      box-shadow:
        0 4px 15px rgba(0,0,0,0.07);
    }

    .finished.show {
      display: block;
    }

    .finished-icon {
      font-size: 50px;
      margin-bottom: 10px;
    }

    .finished h2 {
      margin: 5px 0 10px 0;
    }

    .finished p {
      color: #678;
      line-height: 1.5;
    }

    .restart-button {
      width: 100%;

      margin-top: 15px;
      padding: 15px;

      border: none;
      border-radius: 14px;

      background: #17324d;
      color: white;

      font-size: 17px;
      font-weight: bold;

      cursor: pointer;
    }


    /* ==============================
       MOBIL
    ============================== */

    @media (max-width: 480px) {

      .app {
        padding: 15px;
      }

      .header h1 {
        font-size: 26px;
      }

      .question-card {
        padding: 20px;
      }

      .question-text {
        font-size: 19px;
      }

      .answer-button {
        font-size: 15px;
        padding: 14px;
      }

      .answer-sound {
        width: 54px;
        min-width: 54px;
      }

    }

  </style>

</head>


<body>


<div class="app">


  <!-- ==============================
       HORNÍ LIŠTA
  ============================== -->

  <div class="topbar">

    <a
      href="otazky.html"
      class="back"
    >
      ← Zpět
    </a>


    <div
      class="counter"
      id="counter"
    >
      Otázka
    </div>

  </div>



  <!-- ==============================
       HLAVIČKA
  ============================== -->

  <div class="header">

    <div class="header-icon">
      ❓
    </div>

    <h1>
      Procvičování otázek
    </h1>

    <p>
      Vyber správnou odpověď.
    </p>

  </div>



  <!-- ==============================
       VÝBĚR OBLASTI
  ============================== -->

  <div class="category-box">

    <label for="categorySelect">
      Co chceš procvičovat?
    </label>


    <select
      id="categorySelect"
      class="category-select"
    >

      <option value="all">
        Všechny otázky
      </option>

    </select>

  </div>



  <!-- ==============================
       KARTA OTÁZKY
  ============================== -->

  <div
    class="question-card"
    id="questionCard"
  >


    <div
      class="question-category"
      id="questionCategory"
    ></div>


    <div
      class="question-number"
      id="questionNumber"
    ></div>



    <div class="question-row">

      <div
        class="question-text"
        id="questionText"
      >
        Načítám otázku...
      </div>


      <button
        class="sound-button"
        id="questionSound"
        type="button"
        title="Přehrát otázku"
        aria-label="Přehrát otázku"
      >
        🔊
      </button>

    </div>



    <div
      class="answers"
      id="answers"
    ></div>



    <div
      class="result"
      id="result"
    ></div>



    <button
      class="next-button"
      id="nextButton"
      type="button"
    >
      Další otázka →
    </button>

  </div>



  <!-- ==============================
       HOTOVO
  ============================== -->

  <div
    class="finished"
    id="finished"
  >

    <div class="finished-icon">
      🎉
    </div>

    <h2>
      Hotovo!
    </h2>

    <p id="finishedText">
      Prošel jsi všechny otázky.
    </p>

    <button
      class="restart-button"
      id="restartButton"
      type="button"
    >
      Procvičit znovu
    </button>

  </div>



  <!-- ==============================
       STATISTIKA
  ============================== -->

  <div class="stats">

    <span>
      Celkem:
      <strong id="totalCount">
        0
      </strong>
    </span>

    <span class="stat-good">
      ✓
      <strong id="correctCount">
        0
      </strong>
    </span>

    <span class="stat-bad">
      ✕
      <strong id="wrongCount">
        0
      </strong>
    </span>

  </div>


</div>



<!-- ======================================
     DATABÁZE OTÁZEK
====================================== -->

<script src="otazky-data.js"></script>



<script>

  /* ======================================
     NASTAVENÍ
  ====================================== */

  const AUDIO_FOLDER =
    "OTÁZKY 1";


  /* ======================================
     PROMĚNNÉ
  ====================================== */

  let questionPool = [];

  let currentQuestion = null;

  let displayedAnswers = [];

  let currentPosition = 0;

  let answered = false;

  let currentAudio = null;


  let totalAnswered = 0;

  let correctAnswered = 0;

  let wrongAnswered = 0;



  /* ======================================
     HTML PRVKY
  ====================================== */

  const categorySelect =
    document.getElementById(
      "categorySelect"
    );


  const questionCard =
    document.getElementById(
      "questionCard"
    );


  const questionCategory =
    document.getElementById(
      "questionCategory"
    );


  const questionNumber =
    document.getElementById(
      "questionNumber"
    );


  const questionText =
    document.getElementById(
      "questionText"
    );


  const questionSound =
    document.getElementById(
      "questionSound"
    );


  const answersContainer =
    document.getElementById(
      "answers"
    );


  const result =
    document.getElementById(
      "result"
    );


  const nextButton =
    document.getElementById(
      "nextButton"
    );


  const counter =
    document.getElementById(
      "counter"
    );


  const totalCount =
    document.getElementById(
      "totalCount"
    );


  const correctCount =
    document.getElementById(
      "correctCount"
    );


  const wrongCount =
    document.getElementById(
      "wrongCount"
    );


  const finished =
    document.getElementById(
      "finished"
    );


  const finishedText =
    document.getElementById(
      "finishedText"
    );


  const restartButton =
    document.getElementById(
      "restartButton"
    );



  /* ======================================
     PŘEVOD KATEGORIE NA ČÍSLO
  ====================================== */

  function getSectionNumber(category) {

    if (!category) {
      return 0;
    }


    const text =
      String(category)
        .trim()
        .toUpperCase();


    /*
      Podporujeme římské číslice
      na začátku názvu kategorie.
    */

    if (
      text.startsWith("VI.")
      ||
      text.startsWith("VI ")
    ) {
      return 6;
    }


    if (
      text.startsWith("V.")
      ||
      text.startsWith("V ")
    ) {
      return 5;
    }


    if (
      text.startsWith("IV.")
      ||
      text.startsWith("IV ")
    ) {
      return 4;
    }


    if (
      text.startsWith("III.")
      ||
      text.startsWith("III ")
    ) {
      return 3;
    }


    if (
      text.startsWith("II.")
      ||
      text.startsWith("II ")
    ) {
      return 2;
    }


    if (
      text.startsWith("I.")
      ||
      text.startsWith("I ")
    ) {
      return 1;
    }


    /*
      Pro jistotu podporujeme
      i číslo na začátku.
    */

    const numberMatch =
      text.match(/^([1-6])[\.\s]/);


    if (numberMatch) {

      return Number(
        numberMatch[1]
      );

    }


    return 0;
  }



  /* ======================================
     ČÍSLO OTÁZKY PRO NÁZEV MP3
  ====================================== */

  function padQuestionNumber(number) {

    return String(number)
      .padStart(3, "0");

  }



  /* ======================================
     PROMÍCHÁNÍ POLE
  ====================================== */

  function shuffleArray(array) {

    const copy =
      [...array];


    for (
      let i = copy.length - 1;
      i > 0;
      i--
    ) {

      const j =
        Math.floor(
          Math.random() *
          (i + 1)
        );


      const temporary =
        copy[i];


      copy[i] =
        copy[j];


      copy[j] =
        temporary;

    }


    return copy;
  }



  /* ======================================
     ZASTAVENÍ ZVUKU
  ====================================== */

  function stopAudio() {

    if (currentAudio) {

      currentAudio.pause();

      currentAudio.currentTime =
        0;

      currentAudio =
        null;

    }

  }



  /* ======================================
     PŘEHRÁNÍ MP3
  ====================================== */

  function playAudio(file) {

    stopAudio();


    if (!file) {
      return;
    }


    console.log(
      "Přehrávám:",
      file
    );


    const audio =
      new Audio(file);


    currentAudio =
      audio;


    audio.onended =
      function() {

        currentAudio =
          null;

      };


    audio.onerror =
      function() {

        console.error(
          "MP3 nenalezeno:",
          file
        );

        currentAudio =
          null;

      };


    audio.play().catch(
      function(error) {

        console.error(
          "Zvuk se nepodařilo přehrát:",
          file,
          error
        );

        currentAudio =
          null;

      }
    );

  }



  /* ======================================
     CESTA KE ZVUKU OTÁZKY
  ====================================== */

  function getQuestionAudio(
    question
  ) {

    const section =
      getSectionNumber(
        question.category
      );


    const number =
      padQuestionNumber(
        question.number
      );


    return (
      AUDIO_FOLDER +
      "/otazka-" +
      section +
      "-" +
      number +
      ".mp3"
    );

  }



  /* ======================================
     ČÍSLO ODPOVĚDI
  ====================================== */

  function getAnswerNumber(
    question,
    answer
  ) {

    /*
      MP3 odpovědí jsme vytvářeli
      podle původního pořadí:

      1 = první odpověď
      2 = druhá odpověď
      3 = třetí odpověď

      Proto číslo hledáme v původním
      poli question.answers.
    */

    const index =
      question.answers.findIndex(
        function(originalAnswer) {

          /*
            Nejdříve porovnáme ID.
          */

          if (
            originalAnswer.id !== undefined
            &&
            answer.id !== undefined
          ) {

            return (
              originalAnswer.id ===
              answer.id
            );

          }


          /*
            Kdyby některá otázka ID neměla,
            použijeme text.
          */

          return (
            originalAnswer.text ===
            answer.text
          );

        }
      );


    return index + 1;
  }



  /* ======================================
     CESTA KE ZVUKU ODPOVĚDI
  ====================================== */

  function getAnswerAudio(
    question,
    answer
  ) {

    const section =
      getSectionNumber(
        question.category
      );


    const number =
      padQuestionNumber(
        question.number
      );


    const answerNumber =
      getAnswerNumber(
        question,
        answer
      );


    return (
      AUDIO_FOLDER +
      "/odpoved-" +
      section +
      "-" +
      number +
      "-" +
      answerNumber +
      ".mp3"
    );

  }



  /* ======================================
     JE ODPOVĚĎ SPRÁVNÁ?
  ====================================== */

  function isCorrectAnswer(
    question,
    answer
  ) {

    if (
      !question.correct
      ||
      !Array.isArray(
        question.correct
      )
    ) {

      return false;

    }


    /*
      Ve staré databázi máme například:

      correct: ["c"]

      a odpověď:

      { id:"c", text:"..." }
    */

    return question.correct.includes(
      answer.id
    );

  }



  /* ======================================
     NAČTENÍ KATEGORIÍ
  ====================================== */

  function buildCategorySelect() {

    const categories = [];


    questions.forEach(
      function(question) {

        if (
          question.category
          &&
          !categories.includes(
            question.category
          )
        ) {

          categories.push(
            question.category
          );

        }

      }
    );


    categories.sort(
      function(a, b) {

        return (
          getSectionNumber(a) -
          getSectionNumber(b)
        );

      }
    );


    categories.forEach(
      function(category) {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          category;


        option.textContent =
          category;


        categorySelect.appendChild(
          option
        );

      }
    );

  }



  /* ======================================
     NOVÝ BALÍK OTÁZEK
  ====================================== */

  function prepareQuestionPool() {

    stopAudio();


    const selected =
      categorySelect.value;


    let selectedQuestions =
      [];


    if (
      selected === "all"
    ) {

      selectedQuestions =
        [...questions];

    }

    else {

      selectedQuestions =
        questions.filter(
          function(question) {

            return (
              question.category ===
              selected
            );

          }
        );

    }


    questionPool =
      shuffleArray(
        selectedQuestions
      );


    currentPosition =
      0;


    /*
      Při změně oblasti vynulujeme
      statistiku tohoto procvičování.
    */

    totalAnswered =
      0;

    correctAnswered =
      0;

    wrongAnswered =
      0;


    updateStats();


    finished.classList.remove(
      "show"
    );


    questionCard.style.display =
      "block";


    showQuestion();

  }



  /* ======================================
     ZOBRAZENÍ OTÁZKY
  ====================================== */

  function showQuestion() {

    stopAudio();


    answered =
      false;


    result.className =
      "result";


    result.textContent =
      "";


    nextButton.classList.remove(
      "show"
    );


    /*
      Pokud jsme prošli celý balík,
      ukážeme výsledek.
    */

    if (
      currentPosition >=
      questionPool.length
    ) {

      showFinished();

      return;

    }


    currentQuestion =
      questionPool[
        currentPosition
      ];


    currentPosition++;


    /*
      Odpovědi promícháme pouze
      pro zobrazení.

      Původní pořadí v databázi
      zůstává zachováno kvůli MP3.
    */

    displayedAnswers =
      shuffleArray(
        currentQuestion.answers
      );


    renderQuestion();

  }



  /* ======================================
     VYKRESLENÍ OTÁZKY
  ====================================== */

  function renderQuestion() {

    const section =
      getSectionNumber(
        currentQuestion.category
      );


    questionCategory.textContent =
      currentQuestion.category;


    questionNumber.textContent =
      "Otázka " +
      section +
      "/" +
      currentQuestion.number;


    questionText.textContent =
      currentQuestion.question;


    counter.textContent =
      currentPosition +
      " / " +
      questionPool.length;



    /* ====================================
       ZVUK OTÁZKY
    ==================================== */

    questionSound.onclick =
      function() {

        const file =
          getQuestionAudio(
            currentQuestion
          );


        playAudio(
          file
        );

      };



    /* ====================================
       ODPOVĚDI
    ==================================== */

    answersContainer.innerHTML =
      "";


    displayedAnswers.forEach(
      function(answer) {


        const row =
          document.createElement(
            "div"
          );


        row.className =
          "answer-row";



        /* ================================
           TLAČÍTKO ODPOVĚDI
        ================================ */

        const answerButton =
          document.createElement(
            "button"
          );


        answerButton.type =
          "button";


        answerButton.className =
          "answer-button";


        /*
          Zobrazujeme pouze text.

          ŽÁDNÉ A / B / C.
        */

        answerButton.textContent =
          answer.text;


        answerButton.addEventListener(
          "click",
          function() {

            checkAnswer(
              answer,
              answerButton
            );

          }
        );



        /* ================================
           ZVUK ODPOVĚDI
        ================================ */

        const soundButton =
          document.createElement(
            "button"
          );


        soundButton.type =
          "button";


        soundButton.className =
          "answer-sound";


        soundButton.textContent =
          "🔊";


        soundButton.title =
          "Přehrát odpověď";


        soundButton.setAttribute(
          "aria-label",
          "Přehrát odpověď"
        );


        soundButton.addEventListener(
          "click",
          function(event) {

            event.preventDefault();

            event.stopPropagation();


            const file =
              getAnswerAudio(
                currentQuestion,
                answer
              );


            playAudio(
              file
            );

          }
        );


        row.appendChild(
          answerButton
        );


        row.appendChild(
          soundButton
        );


        answersContainer.appendChild(
          row
        );

      }
    );

  }



  /* ======================================
     KONTROLA ODPOVĚDI
  ====================================== */

  function checkAnswer(
    selectedAnswer,
    selectedButton
  ) {

    if (answered) {
      return;
    }


    answered =
      true;


    stopAudio();


    totalAnswered++;


    const rows =
      answersContainer.querySelectorAll(
        ".answer-row"
      );


    /*
      Vypneme všechny odpovědi
      a označíme správnou.
    */

    rows.forEach(
      function(row, index) {

        const button =
          row.querySelector(
            ".answer-button"
          );


        button.disabled =
          true;


        const answer =
          displayedAnswers[index];


        if (
          isCorrectAnswer(
            currentQuestion,
            answer
          )
        ) {

          button.classList.add(
            "correct"
          );

        }

      }
    );



    /* ====================================
       SPRÁVNÁ ODPOVĚĎ
    ==================================== */

    if (
      isCorrectAnswer(
        currentQuestion,
        selectedAnswer
      )
    ) {

      correctAnswered++;


      result.textContent =
        "✓ Správně!";


      result.className =
        "result correct";


      removeMistake(
        currentQuestion
      );

    }



    /* ====================================
       CHYBNÁ ODPOVĚĎ
    ==================================== */

    else {

      wrongAnswered++;


      selectedButton.classList.add(
        "wrong"
      );


      const correctAnswer =
        currentQuestion.answers.find(
          function(answer) {

            return isCorrectAnswer(
              currentQuestion,
              answer
            );

          }
        );


      if (correctAnswer) {

        result.textContent =
          "✕ Správná odpověď je: " +
          correctAnswer.text;

      }

      else {

        result.textContent =
          "✕ Nesprávná odpověď.";

      }


      result.className =
        "result wrong";


      saveMistake(
        currentQuestion
      );

    }


    updateStats();


    nextButton.classList.add(
      "show"
    );

  }



  /* ======================================
     STATISTIKA
  ====================================== */

  function updateStats() {

    totalCount.textContent =
      totalAnswered;


    correctCount.textContent =
      correctAnswered;


    wrongCount.textContent =
      wrongAnswered;

  }



  /* ======================================
     IDENTIFIKACE OTÁZKY
  ====================================== */

  function getQuestionId(
    question
  ) {

    const section =
      getSectionNumber(
        question.category
      );


    return (
      section +
      "-" +
      padQuestionNumber(
        question.number
      )
    );

  }



  /* ======================================
     PROFIL
  ====================================== */

  function getProfileId() {

    return (

      localStorage.getItem(
        "activeProfile"
      )

      ||

      localStorage.getItem(
        "currentProfile"
      )

      ||

      localStorage.getItem(
        "selectedProfile"
      )

      ||

      "default"

    );

  }



  /* ======================================
     KLÍČ CHYB
  ====================================== */

  function getMistakeKey() {

    return (
      "zlataUdice_questionMistakes_" +
      getProfileId()
    );

  }



  /* ======================================
     ULOŽENÍ CHYBY
  ====================================== */

  function saveMistake(
    question
  ) {

    const id =
      getQuestionId(
        question
      );


    const key =
      getMistakeKey();


    let mistakes =
      [];


    try {

      mistakes =
        JSON.parse(
          localStorage.getItem(
            key
          )
        ) || [];

    }

    catch (error) {

      mistakes =
        [];

    }


    if (
      !mistakes.includes(id)
    ) {

      mistakes.push(
        id
      );

    }


    localStorage.setItem(
      key,
      JSON.stringify(
        mistakes
      )
    );

  }



  /* ======================================
     ODSTRANĚNÍ CHYBY
  ====================================== */

  function removeMistake(
    question
  ) {

    const id =
      getQuestionId(
        question
      );


    const key =
      getMistakeKey();


    let mistakes =
      [];


    try {

      mistakes =
        JSON.parse(
          localStorage.getItem(
            key
          )
        ) || [];

    }

    catch (error) {

      mistakes =
        [];

    }


    mistakes =
      mistakes.filter(
        function(item) {

          return (
            item !== id
          );

        }
      );


    localStorage.setItem(
      key,
      JSON.stringify(
        mistakes
      )
    );

  }



  /* ======================================
     DOKONČENÍ BALÍKU
  ====================================== */

  function showFinished() {

    stopAudio();


    questionCard.style.display =
      "none";


    finished.classList.add(
      "show"
    );


    counter.textContent =
      questionPool.length +
      " / " +
      questionPool.length;


    finishedText.innerHTML =
      "Prošel jsi celý vybraný balík.<br><br>" +
      "Správně: <strong>" +
      correctAnswered +
      "</strong><br>" +
      "Chybně: <strong>" +
      wrongAnswered +
      "</strong>";

  }



  /* ======================================
     DALŠÍ OTÁZKA
  ====================================== */

  nextButton.addEventListener(
    "click",
    function() {

      showQuestion();

    }
  );



  /* ======================================
     ZMĚNA KATEGORIE
  ====================================== */

  categorySelect.addEventListener(
    "change",
    function() {

      prepareQuestionPool();

    }
  );



  /* ======================================
     PROCVIČIT ZNOVU
  ====================================== */

  restartButton.addEventListener(
    "click",
    function() {

      prepareQuestionPool();

    }
  );



  /* ======================================
     START APLIKACE
  ====================================== */

  function startApp() {

    /*
      Kontrola, zda se otazky-data.js
      skutečně načetl.
    */

    if (
      typeof questions ===
      "undefined"
    ) {

      questionText.textContent =
        "Nepodařilo se načíst databázi otázek.";


      answersContainer.innerHTML =
        "";


      console.error(
        "Proměnná questions nebyla nalezena."
      );


      return;
    }



    if (
      !Array.isArray(
        questions
      )
    ) {

      questionText.textContent =
        "Databáze otázek má nesprávný formát.";


      answersContainer.innerHTML =
        "";


      return;
    }



    if (
      questions.length === 0
    ) {

      questionText.textContent =
        "Databáze neobsahuje žádné otázky.";


      return;
    }



    console.log(
      "Načteno:",
      questions.length,
      "otázek"
    );



    /*
      Vytvoříme nabídku oblastí přímo
      podle skutečných kategorií
      z otazky-data.js.

      Nemusíme tedy jejich názvy
      znovu ručně opisovat.
    */

    buildCategorySelect();



    /*
      Spustíme procvičování.
    */

    prepareQuestionPool();

  }



  startApp();

</script>

  <!-- ==============================
       DATABÁZE OTÁZEK
  ============================== -->

  <script src="otazky-data.js"></script>


  <script>

    /* ======================================
       PROMĚNNÉ
    ====================================== */

    let questionPool = [];

    let currentQuestion = null;

    let currentAnswers = [];

    let answered = false;

    let questionPosition = 0;

    let totalAnswered = 0;

    let correctAnswered = 0;

    let wrongAnswered = 0;

    let currentAudio = null;


    /* ======================================
       HTML PRVKY
    ====================================== */

    const categorySelect =
      document.getElementById("categorySelect");

    const questionCategory =
      document.getElementById("questionCategory");

    const questionNumber =
      document.getElementById("questionNumber");

    const questionText =
      document.getElementById("questionText");

    const questionSound =
      document.getElementById("questionSound");

    const answersContainer =
      document.getElementById("answers");

    const result =
      document.getElementById("result");

    const nextButton =
      document.getElementById("nextButton");

    const counter =
      document.getElementById("counter");

    const totalCount =
      document.getElementById("totalCount");

    const correctCount =
      document.getElementById("correctCount");

    const wrongCount =
      document.getElementById("wrongCount");


    /* ======================================
       PROMÍCHÁNÍ
    ====================================== */

    function shuffleArray(array) {

      const copy = [...array];

      for (
        let i = copy.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() * (i + 1)
          );

        const temporary =
          copy[i];

        copy[i] =
          copy[j];

        copy[j] =
          temporary;
      }

      return copy;
    }


    /* ======================================
       ZASTAVENÍ ZVUKU
    ====================================== */

    function stopAudio() {

      if (currentAudio) {

        currentAudio.pause();

        currentAudio.currentTime = 0;

        currentAudio = null;
      }

    }


    /* ======================================
       PŘEHRÁNÍ MP3
    ====================================== */

    function playAudio(file) {

      stopAudio();

      if (!file) {
        return;
      }

      console.log(
        "Přehrávám:",
        file
      );

      const audio =
        new Audio(file);

      currentAudio =
        audio;

      audio.onended =
        function() {

          currentAudio = null;

        };

      audio.onerror =
        function() {

          console.error(
            "Zvuk se nepodařilo načíst:",
            file
          );

          currentAudio = null;

        };

      audio.play().catch(
        function(error) {

          console.error(
            "Zvuk se nepodařilo přehrát:",
            error
          );

          currentAudio = null;

        }
      );
    }


    /* ======================================
       PŘÍPRAVA BALÍKU OTÁZEK
    ====================================== */

    function prepareQuestionPool() {

      stopAudio();

      const selected =
        categorySelect.value;

      let selectedQuestions;


      if (selected === "all") {

        selectedQuestions =
          [...questions];

      }

      else {

        selectedQuestions =
          questions.filter(
            function(question) {

              return (
                question.section ===
                Number(selected)
              );

            }
          );

      }


      questionPool =
        shuffleArray(
          selectedQuestions
        );


      questionPosition = 0;


      showQuestion();
    }


    /* ======================================
       ZOBRAZENÍ OTÁZKY
    ====================================== */

    function showQuestion() {

      stopAudio();

      answered = false;


      result.className =
        "result";

      result.textContent =
        "";


      nextButton.classList.remove(
        "show"
      );


      /* Pokud jsme projeli celý balík */

      if (
        questionPosition >=
        questionPool.length
      ) {

        questionPool =
          shuffleArray(
            questionPool
          );

        questionPosition = 0;

      }


      if (
        questionPool.length === 0
      ) {

        questionText.textContent =
          "V této oblasti nejsou žádné otázky.";

        answersContainer.innerHTML =
          "";

        return;
      }


      currentQuestion =
        questionPool[
          questionPosition
        ];


      questionPosition++;


      currentAnswers =
        shuffleArray(
          currentQuestion.answers
        );


      renderQuestion();
    }


    /* ======================================
       VYKRESLENÍ OTÁZKY
    ====================================== */

    function renderQuestion() {

      questionCategory.textContent =
        currentQuestion.sectionName;


      questionNumber.textContent =
        "Otázka " +
        currentQuestion.section +
        "/" +
        currentQuestion.number;


      questionText.textContent =
        currentQuestion.question;


      counter.textContent =
        questionPosition +
        " / " +
        questionPool.length;


      /* ZVUK OTÁZKY */

      questionSound.onclick =
        function() {

          playAudio(
            currentQuestion.questionAudio
          );

        };


      /* ODPOVĚDI */

      answersContainer.innerHTML =
        "";


      currentAnswers.forEach(
        function(answer) {

          const row =
            document.createElement(
              "div"
            );

          row.className =
            "answer-row";


          /* TEXT ODPOVĚDI */

          const answerButton =
            document.createElement(
              "button"
            );

          answerButton.type =
            "button";

          answerButton.className =
            "answer-button";

          answerButton.textContent =
            answer.text;


          answerButton.addEventListener(
            "click",
            function() {

              checkAnswer(
                answer,
                answerButton
              );

            }
          );


          /* ZVUK ODPOVĚDI */

          const soundButton =
            document.createElement(
              "button"
            );

          soundButton.type =
            "button";

          soundButton.className =
            "answer-sound";

          soundButton.textContent =
            "🔊";

          soundButton.setAttribute(
            "aria-label",
            "Přehrát odpověď"
          );


          soundButton.addEventListener(
            "click",
            function(event) {

              event.preventDefault();

              event.stopPropagation();

              playAudio(
                answer.audio
              );

            }
          );


          row.appendChild(
            answerButton
          );

          row.appendChild(
            soundButton
          );

          answersContainer.appendChild(
            row
          );

        }
      );
    }


    /* ======================================
       VYHODNOCENÍ ODPOVĚDI
    ====================================== */

    function checkAnswer(
      selectedAnswer,
      selectedButton
    ) {

      if (answered) {
        return;
      }


      answered = true;

      stopAudio();

      totalAnswered++;


      const rows =
        answersContainer.querySelectorAll(
          ".answer-row"
        );


      rows.forEach(
        function(row, index) {

          const button =
            row.querySelector(
              ".answer-button"
            );

          button.disabled =
            true;


          if (
            currentAnswers[index].correct
          ) {

            button.classList.add(
              "correct"
            );

          }

        }
      );


      /* SPRÁVNĚ */

      if (
        selectedAnswer.correct
      ) {

        correctAnswered++;

        result.textContent =
          "✓ Správně!";

        result.className =
          "result correct";

        removeMistake(
          currentQuestion.id
        );

      }


      /* CHYBNĚ */

      else {

        wrongAnswered++;

        selectedButton.classList.add(
          "wrong"
        );


        const correctAnswer =
          currentQuestion.answers.find(
            function(answer) {

              return answer.correct;

            }
          );


        result.textContent =
          "✕ Správná odpověď je: " +
          correctAnswer.text;

        result.className =
          "result wrong";


        saveMistake(
          currentQuestion.id
        );

      }


      updateStats();


      nextButton.classList.add(
        "show"
      );
    }


    /* ======================================
       STATISTIKA
    ====================================== */

    function updateStats() {

      totalCount.textContent =
        totalAnswered;

      correctCount.textContent =
        correctAnswered;

      wrongCount.textContent =
        wrongAnswered;
    }


    /* ======================================
       PROFIL
    ====================================== */

    function getProfileId() {

      return (

        localStorage.getItem(
          "activeProfile"
        )

        ||

        localStorage.getItem(
          "currentProfile"
        )

        ||

        localStorage.getItem(
          "selectedProfile"
        )

        ||

        "default"

      );
    }


    /* ======================================
       KLÍČ CHYB
    ====================================== */

    function getMistakeKey() {

      return (
        "zlataUdice_questionMistakes_" +
        getProfileId()
      );
    }


    /* ======================================
       ULOŽENÍ CHYBY
    ====================================== */

    function saveMistake(id) {

      const key =
        getMistakeKey();

      let mistakes = [];


      try {

        mistakes =
          JSON.parse(
            localStorage.getItem(key)
          ) || [];

      }

      catch (error) {

        mistakes = [];

      }


      if (
        !mistakes.includes(id)
      ) {

        mistakes.push(id);

      }


      localStorage.setItem(
        key,
        JSON.stringify(mistakes)
      );
    }


    /* ======================================
       ODSTRANĚNÍ CHYBY
    ====================================== */

    function removeMistake(id) {

      const key =
        getMistakeKey();

      let mistakes = [];


      try {

        mistakes =
          JSON.parse(
            localStorage.getItem(key)
          ) || [];

      }

      catch (error) {

        mistakes = [];

      }


      mistakes =
        mistakes.filter(
          function(item) {

            return item !== id;

          }
        );


      localStorage.setItem(
        key,
        JSON.stringify(mistakes)
      );
    }


    /* ======================================
       DALŠÍ OTÁZKA
    ====================================== */

    nextButton.addEventListener(
      "click",
      function() {

        showQuestion();

      }
    );


    /* ======================================
       ZMĚNA KATEGORIE
    ====================================== */

    categorySelect.addEventListener(
      "change",
      function() {

        prepareQuestionPool();

      }
    );


    /* ======================================
       START APLIKACE
    ====================================== */

    function startApp() {

      if (
        typeof questions ===
        "undefined"
      ) {

        questionText.textContent =
          "Chyba: databáze otázek se nenačetla.";

        answersContainer.innerHTML =
          "";

        console.error(
          "Proměnná questions neexistuje."
        );

        return;
      }


      if (
        !Array.isArray(questions)
      ) {

        questionText.textContent =
          "Chyba databáze otázek.";

        answersContainer.innerHTML =
          "";

        console.error(
          "questions není pole."
        );

        return;
      }


      console.log(
        "Databáze načtena:",
        questions.length,
        "otázek"
      );


      prepareQuestionPool();
    }


    startApp();

  </script>

</body>

</html>
