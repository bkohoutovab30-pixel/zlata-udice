<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="robots" content="noindex, nofollow">

  <title>Procvičování otázek | Zlatá udice</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #eef8fc;
      color: #062d59;
    }

    .page {
      max-width: 760px;
      margin: 0 auto;
      padding: 20px 18px 50px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-weight: 700;
      color: #56718c;
    }

    .back {
      color: #56718c;
      text-decoration: none;
      font-size: 18px;
    }

    .back:hover {
      text-decoration: underline;
    }

    .counter-top {
      font-size: 18px;
    }

    .hero {
      text-align: center;
      margin-bottom: 28px;
    }

    .question-mark {
      font-size: 55px;
      line-height: 1;
      margin-bottom: 6px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      color: #062d59;
    }

    .subtitle {
      margin-top: 8px;
      font-size: 20px;
      color: #607890;
    }

    .filter-card,
    .question-card {
      background: white;
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 10px 28px rgba(6, 45, 89, 0.08);
    }

    .filter-card {
      margin-bottom: 24px;
    }

    .filter-card label {
      display: block;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #506b86;
    }

    select {
      width: 100%;
      border: 2px solid #d5e5ed;
      border-radius: 15px;
      padding: 16px;
      font-size: 20px;
      font-weight: 700;
      color: #062d59;
      background: white;
      outline: none;
    }

    select:focus {
      border-color: #8bbfd8;
    }

    .question-card {
      padding: 28px;
    }

    .category {
      font-size: 16px;
      color: #758ba0;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .question-number {
      font-size: 16px;
      color: #7890a7;
      margin-bottom: 20px;
    }

    .question-row {
      display: grid;
      grid-template-columns: 1fr 58px;
      gap: 12px;
      align-items: center;
      margin-bottom: 26px;
    }

    .question-text {
      font-size: 25px;
      line-height: 1.3;
      font-weight: 700;
      color: #062d59;
    }

    .sound-btn {
      width: 58px;
      height: 58px;
      border: 0;
      border-radius: 50%;
      background: #e9f6fc;
      cursor: pointer;
      font-size: 23px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .sound-btn:hover {
      background: #d8eff9;
      transform: scale(1.04);
    }

    .sound-btn:active {
      transform: scale(0.96);
    }

    .answers {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .answer-row {
      display: grid;
      grid-template-columns: 1fr 58px;
      gap: 10px;
      align-items: stretch;
    }

    .answer-btn {
      width: 100%;
      min-height: 78px;
      border: 2px solid #d5e5ed;
      border-radius: 17px;
      background: #f9fcfd;
      color: #062d59;
      padding: 16px 20px;
      text-align: left;
      font-size: 20px;
      line-height: 1.3;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .answer-btn:hover:not(:disabled) {
      border-color: #9dc9dd;
      background: #f1f9fc;
    }

    .answer-btn.correct {
      background: #e7f8eb;
      border-color: #35a853;
      color: #176b2d;
    }

    .answer-btn.wrong {
      background: #fff0f0;
      border-color: #df4d4d;
      color: #a42222;
    }

    .answer-btn:disabled {
      cursor: default;
    }

    .answer-sound {
      width: 58px;
      min-height: 78px;
      border-radius: 17px;
    }

    .feedback {
      margin-top: 22px;
      min-height: 30px;
      font-size: 19px;
      font-weight: 700;
      text-align: center;
    }

    .feedback.good {
      color: #19863c;
    }

    .feedback.bad {
      color: #c52f2f;
    }

    .bottom {
      margin-top: 22px;
      display: flex;
      justify-content: center;
      gap: 20px;
      color: #5f7489;
      font-weight: 700;
      font-size: 17px;
    }

    .correct-score {
      color: #16853a;
    }

    .wrong-score {
      color: #d43d3d;
    }

    .loading {
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      padding: 25px 5px;
    }

    @media (max-width: 600px) {
      .page {
        padding: 14px 12px 35px;
      }

      h1 {
        font-size: 29px;
      }

      .subtitle {
        font-size: 18px;
      }

      .question-card {
        padding: 22px 18px;
      }

      .question-text {
        font-size: 21px;
      }

      .answer-btn {
        font-size: 18px;
        padding: 14px 16px;
      }

      .question-row,
      .answer-row {
        grid-template-columns: 1fr 52px;
      }

      .sound-btn {
        width: 52px;
        height: 52px;
      }

      .answer-sound {
        min-height: 72px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <div class="topbar">
    <a href="otazky.html" class="back">← Zpět</a>
    <div class="counter-top" id="topCounter">Otázka</div>
  </div>

  <div class="hero">
    <div class="question-mark">❓</div>
    <h1>Procvičování otázek</h1>
    <div class="subtitle">Vyber správnou odpověď.</div>
  </div>

  <div class="filter-card">
    <label for="categorySelect">Co chceš procvičovat?</label>

    <select id="categorySelect">
      <option value="all">Všechny otázky</option>
      <option value="1">1. Přírodovědné znalosti</option>
      <option value="2">2. Chov ryb</option>
      <option value="3">3. Zákon o rybářství</option>
      <option value="4">4. Stanovy ČRS</option>
      <option value="5">5. Znalosti z rybolovné techniky</option>
      <option value="6">6. Závodní lov ryb udicí</option>
    </select>
  </div>

  <div class="question-card" id="questionCard">
    <div class="loading">Načítám otázky…</div>
  </div>

  <div class="bottom">
    <span>Celkem: <span id="totalAnswered">0</span></span>
    <span class="correct-score">✓ <span id="correctCount">0</span></span>
    <span class="wrong-score">✕ <span id="wrongCount">0</span></span>
  </div>

</div>


<!-- Databáze otázek -->
<script src="otazky-data.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

  const categorySelect = document.getElementById("categorySelect");
  const questionCard = document.getElementById("questionCard");
  const topCounter = document.getElementById("topCounter");

  const totalAnsweredEl = document.getElementById("totalAnswered");
  const correctCountEl = document.getElementById("correctCount");
  const wrongCountEl = document.getElementById("wrongCount");

  let currentQuestions = [];
  let currentIndex = 0;

  let correctCount = 0;
  let wrongCount = 0;

  let locked = false;
  let currentAudio = null;


  /* ========================================
     PŘEVOD DATABÁZE
     ======================================== */

  function prepareQuestions() {

    if (
      typeof questionsRaw === "undefined" ||
      !Array.isArray(questionsRaw)
    ) {
      console.error("questionsRaw nebylo nalezeno.");
      return [];
    }

    return questionsRaw.map(function (q) {

      return {
        section: Number(q[0]),
        number: Number(q[1]),
        question: q[2],

        answers: [
          q[3],
          q[4],
          q[5]
        ],

        correct: Number(q[6])
      };

    });

  }


  const allQuestions = prepareQuestions();


  /* ========================================
     NÁZVY SEKCÍ
     ======================================== */

  function getSectionName(section) {

    if (
      typeof questionSections !== "undefined" &&
      questionSections[section]
    ) {
      return questionSections[section];
    }

    const fallback = {
      1: "Přírodovědné znalosti",
      2: "Chov ryb",
      3: "Zákon o rybářství",
      4: "Stanovy ČRS",
      5: "Znalosti z rybolovné techniky",
      6: "Závodní lov ryb udicí"
    };

    return fallback[section] || "";
  }


  /* ========================================
     NÁHODNÉ POŘADÍ
     ======================================== */

  function shuffle(array) {

    const copy = [...array];

    for (let i = copy.length - 1; i > 0; i--) {

      const j = Math.floor(Math.random() * (i + 1));

      [copy[i], copy[j]] = [copy[j], copy[i]];

    }

    return copy;
  }


  /* ========================================
     VÝBĚR KATEGORIE
     ======================================== */

  function startPractice() {

    stopAudio();

    const selected = categorySelect.value;

    if (selected === "all") {

      currentQuestions = shuffle(allQuestions);

    } else {

      const sectionNumber = Number(selected);

      currentQuestions = shuffle(
        allQuestions.filter(function (q) {
          return q.section === sectionNumber;
        })
      );

    }

    currentIndex = 0;

    correctCount = 0;
    wrongCount = 0;

    updateScore();

    showQuestion();
  }


  /* ========================================
     ZOBRAZENÍ OTÁZKY
     ======================================== */

  function showQuestion() {

    stopAudio();

    locked = false;

    if (currentQuestions.length === 0) {

      questionCard.innerHTML = `
        <div class="loading">
          Pro tuto kategorii nebyly nalezeny žádné otázky.
        </div>
      `;

      topCounter.textContent = "Otázka";

      return;
    }


    if (currentIndex >= currentQuestions.length) {

      showFinished();

      return;
    }


    const q = currentQuestions[currentIndex];

    topCounter.textContent =
      "Otázka " +
      (currentIndex + 1) +
      "/" +
      currentQuestions.length;


    let answersHTML = "";


    q.answers.forEach(function (answer, index) {

      const answerNumber = index + 1;

      answersHTML += `
        <div class="answer-row">

          <button
            class="answer-btn"
            data-answer="${answerNumber}"
          >
            ${escapeHTML(answer)}
          </button>

          <button
            class="sound-btn answer-sound"
            data-audio-answer="${answerNumber}"
            aria-label="Přehrát odpověď"
          >
            🔊
          </button>

        </div>
      `;

    });


    questionCard.innerHTML = `

      <div class="category">
        ${escapeHTML(getSectionName(q.section))}
      </div>

      <div class="question-number">
        Otázka ${currentIndex + 1}/${currentQuestions.length}
      </div>

      <div class="question-row">

        <div class="question-text">
          ${escapeHTML(q.question)}
        </div>

        <button
          class="sound-btn"
          id="questionSound"
          aria-label="Přehrát otázku"
        >
          🔊
        </button>

      </div>

      <div class="answers">
        ${answersHTML}
      </div>

      <div
        class="feedback"
        id="feedback"
      ></div>

    `;


    /* kliknutí na odpověď */

    document
      .querySelectorAll(".answer-btn")
      .forEach(function (button) {

        button.addEventListener("click", function () {

          const answer =
            Number(button.dataset.answer);

          checkAnswer(answer);

        });

      });


    /* zvuk otázky */

    const questionSound =
      document.getElementById("questionSound");

    questionSound.addEventListener("click", function () {

      playQuestionAudio(q);

    });


    /* zvuky odpovědí */

    document
      .querySelectorAll("[data-audio-answer]")
      .forEach(function (button) {

        button.addEventListener("click", function () {

          const answerNumber =
            Number(button.dataset.audioAnswer);

          playAnswerAudio(
            q,
            answerNumber
          );

        });

      });

  }


  /* ========================================
     CESTY KE ZVUKŮM
     ======================================== */

  function padQuestionNumber(number) {

    return String(number).padStart(3, "0");

  }


  function questionAudioPath(q) {

    /*
      Například:

      sekce 1
      otázka 1

      OTÁZKY 1/otazka-1-001.mp3
    */

    return (
      "OTÁZKY 1/" +
      "otazka-" +
      q.section +
      "-" +
      padQuestionNumber(q.number) +
      ".mp3"
    );

  }


  function answerAudioPath(q, answerNumber) {

    /*
      Například:

      OTÁZKY 1/odpoved-1-001-1.mp3
    */

    return (
      "OTÁZKY 1/" +
      "odpoved-" +
      q.section +
      "-" +
      padQuestionNumber(q.number) +
      "-" +
      answerNumber +
      ".mp3"
    );

  }


  /* ========================================
     PŘEHRÁVÁNÍ ZVUKU
     ======================================== */

  function stopAudio() {

    if (currentAudio) {

      currentAudio.pause();

      currentAudio.currentTime = 0;

      currentAudio = null;

    }

  }


  function playAudio(path) {

    stopAudio();

    console.log(
      "Přehrávám:",
      path
    );

    currentAudio =
      new Audio(
        encodeURI(path)
      );


    currentAudio.play().catch(function (error) {

      console.error(
        "Zvuk se nepodařilo přehrát:",
        path,
        error
      );

      currentAudio = null;

    });

  }


  function playQuestionAudio(q) {

    playAudio(
      questionAudioPath(q)
    );

  }


  function playAnswerAudio(
    q,
    answerNumber
  ) {

    playAudio(
      answerAudioPath(
        q,
        answerNumber
      )
    );

  }


  /* ========================================
     KONTROLA ODPOVĚDI
     ======================================== */

  function checkAnswer(selectedAnswer) {

    if (locked) {
      return;
    }

    locked = true;

    stopAudio();

    const q =
      currentQuestions[currentIndex];

    const buttons =
      document.querySelectorAll(
        ".answer-btn"
      );

    const feedback =
      document.getElementById(
        "feedback"
      );


    buttons.forEach(function (button) {

      button.disabled = true;

      const answerNumber =
        Number(
          button.dataset.answer
        );


      if (
        answerNumber === q.correct
      ) {

        button.classList.add(
          "correct"
        );

      }


      if (
        answerNumber === selectedAnswer &&
        selectedAnswer !== q.correct
      ) {

        button.classList.add(
          "wrong"
        );

      }

    });


    if (
      selectedAnswer === q.correct
    ) {

      correctCount++;

      feedback.textContent =
        "✓ Správně";

      feedback.className =
        "feedback good";

    } else {

      wrongCount++;

      feedback.textContent =
        "✕ Nesprávně";

      feedback.className =
        "feedback bad";

    }


    updateScore();


    /* automatický přechod */

    setTimeout(function () {

      currentIndex++;

      showQuestion();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }, 1300);

  }


  /* ========================================
     SKÓRE
     ======================================== */

  function updateScore() {

    totalAnsweredEl.textContent =
      correctCount + wrongCount;

    correctCountEl.textContent =
      correctCount;

    wrongCountEl.textContent =
      wrongCount;

  }


  /* ========================================
     KONEC PROCVIČOVÁNÍ
     ======================================== */

  function showFinished() {

    stopAudio();

    topCounter.textContent =
      "Hotovo";

    const total =
      correctCount + wrongCount;

    const percent =
      total > 0
        ? Math.round(
            (correctCount / total) * 100
          )
        : 0;


    questionCard.innerHTML = `

      <div style="
        text-align:center;
        padding:20px 5px;
      ">

        <div style="
          font-size:50px;
          margin-bottom:12px;
        ">
          🎣
        </div>

        <div style="
          font-size:28px;
          font-weight:700;
          margin-bottom:15px;
        ">
          Procvičování dokončeno
        </div>

        <div style="
          font-size:20px;
          line-height:1.7;
        ">

          Správně:
          <strong>
            ${correctCount}
          </strong>

          <br>

          Chybně:
          <strong>
            ${wrongCount}
          </strong>

          <br>

          Úspěšnost:
          <strong>
            ${percent} %
          </strong>

        </div>

        <button
          id="restartButton"
          style="
            margin-top:25px;
            border:0;
            border-radius:15px;
            background:#062d59;
            color:white;
            padding:15px 25px;
            font-size:18px;
            font-weight:700;
            cursor:pointer;
          "
        >
          Procvičit znovu
        </button>

      </div>
    `;


    document
      .getElementById(
        "restartButton"
      )
      .addEventListener(
        "click",
        startPractice
      );

  }


  /* ========================================
     BEZPEČNÉ VLOŽENÍ TEXTU
     ======================================== */

  function escapeHTML(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  /* ========================================
     ZMĚNA KATEGORIE
     ======================================== */

  categorySelect.addEventListener(
    "change",
    startPractice
  );


  /* ========================================
     START
     ======================================== */

  if (allQuestions.length === 0) {

    questionCard.innerHTML = `
      <div class="loading">
        Nepodařilo se načíst databázi otázek.
      </div>
    `;

    console.error(
      "Databáze otázek je prázdná."
    );

    return;
  }


  console.log(
    "Načteno otázek:",
    allQuestions.length
  );


  startPractice();

});
</script>

</body>
</html>
