<!DOCTYPE html>
<html lang="cs">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <title>Procvičování otázek | Zlatá udice</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef7fb;
      color: #17324d;
    }


    .app {
      max-width: 650px;
      margin: auto;
      min-height: 100vh;
      padding: 20px;
    }


    /* ========================================
       HORNÍ LIŠTA
    ======================================== */

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }


    .back {
      color: #567;
      text-decoration: none;
      font-weight: bold;
    }


    .counter {
      color: #678;
      font-weight: bold;
      white-space: nowrap;
    }


    /* ========================================
       HLAVIČKA
    ======================================== */

    .header {
      text-align: center;
      margin-bottom: 20px;
    }


    .header-icon {
      font-size: 42px;
    }


    .header h1 {
      margin: 5px 0;
      font-size: 28px;
    }


    .header p {
      margin: 0;
      color: #678;
      line-height: 1.4;
    }


    /* ========================================
       VÝBĚR OBLASTI
    ======================================== */

    .category-box {
      background: white;
      padding: 16px;
      border-radius: 18px;
      margin-bottom: 18px;

      box-shadow:
        0 4px 15px rgba(0,0,0,0.07);
    }


    .category-box label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #567;
    }


    .category-select {
      width: 100%;
      padding: 13px 14px;

      border:
        2px solid #d7e4ea;

      border-radius: 12px;

      background: white;
      color: #17324d;

      font-size: 16px;
      font-weight: bold;

      outline: none;
    }


    .category-select:focus {
      border-color: #79b7d2;
    }


    /* ========================================
       KARTA OTÁZKY
    ======================================== */

    .question-card {
      background: white;

      border-radius: 22px;

      padding: 22px;

      box-shadow:
        0 4px 15px rgba(0,0,0,0.08);
    }


    .question-category {
      color: #789;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 12px;
    }


    .question-number {
      color: #789;
      font-size: 13px;
      margin-bottom: 15px;
    }


    .question-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;

      margin-bottom: 24px;
    }


    .question-text {
      flex: 1;

      font-size: 21px;
      line-height: 1.4;

      font-weight: bold;

      text-align: left;
    }


    /* ========================================
       TLAČÍTKO ZVUKU
    ======================================== */

    .sound-button {
      flex-shrink: 0;

      width: 46px;
      height: 46px;

      border: none;
      border-radius: 50%;

      background: #e8f4f9;

      font-size: 22px;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;
    }


    .sound-button:hover {
      background: #d8edf5;
    }


    .sound-button:active {
      transform: scale(0.96);
    }


    /* ========================================
       ODPOVĚDI
    ======================================== */

    .answers {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }


    .answer-row {
      display: flex;
      align-items: stretch;
      gap: 8px;
    }


    .answer-button {
      flex: 1;

      min-height: 64px;

      border:
        2px solid #dbe7ec;

      border-radius: 15px;

      background: #f8fbfc;

      color: #17324d;

      padding: 13px 15px;

      font-size: 16px;
      line-height: 1.35;

      font-weight: bold;

      text-align: left;

      cursor: pointer;
    }


    .answer-button:hover {
      background: #eef7fb;
    }


    .answer-button:disabled {
      cursor: default;
      opacity: 1;
    }


    .answer-sound {
      width: 52px;
      min-width: 52px;

      border: none;
      border-radius: 15px;

      background: #e8f4f9;

      font-size: 21px;

      cursor: pointer;
    }


    .answer-sound:hover {
      background: #d8edf5;
    }


    /* ========================================
       SPRÁVNĚ / CHYBNĚ
    ======================================== */

    .answer-button.correct {
      background: #e6f7e9;
      border-color: #6ab879;
      color: #235d2e;
    }


    .answer-button.wrong {
      background: #fdeaea;
      border-color: #dd7777;
      color: #8b2d2d;
    }


    /* ========================================
       VÝSLEDEK
    ======================================== */

    .result {
      display: none;

      margin-top: 20px;

      padding: 15px;

      border-radius: 14px;

      text-align: center;

      font-size: 17px;
      font-weight: bold;
    }


    .result.correct {
      display: block;

      background: #e6f7e9;
      color: #235d2e;
    }


    .result.wrong {
      display: block;

      background: #fdeaea;
      color: #8b2d2d;
    }


    /* ========================================
       DALŠÍ OTÁZKA
    ======================================== */

    .next-button {
      display: none;

      width: 100%;

      margin-top: 15px;

      padding: 15px;

      border: none;
      border-radius: 14px;

      background: #17324d;
      color: white;

      font-size: 17px;
      font-weight: bold;

      cursor: pointer;
    }


    .next-button.show {
      display: block;
    }


    .next-button:hover {
      opacity: 0.92;
    }


    /* ========================================
       STATISTIKA
    ======================================== */

    .stats {
      display: flex;
      justify-content: center;
      gap: 18px;

      margin-top: 20px;

      color: #678;

      font-size: 14px;
      font-weight: bold;
    }


    .stat-good {
      color: #37834a;
    }


    .stat-bad {
      color: #b84d4d;
    }


    /* ========================================
       MOBIL
    ======================================== */

    @media (max-width: 480px) {

      .app {
        padding: 15px;
      }


      .header h1 {
        font-size: 25px;
      }


      .question-card {
        padding: 18px;
      }


      .question-text {
        font-size: 19px;
      }


      .answer-button {
        font-size: 15px;
      }

    }

  </style>
</head>


<body>

  <div class="app">


    <!-- =====================================
         HORNÍ LIŠTA
    ====================================== -->

    <div class="topbar">

      <a
        href="otazky.html"
        class="back"
      >
        ← Zpět
      </a>


      <div
        class="counter"
        id="counter"
      >
        Otázka
      </div>

    </div>



    <!-- =====================================
         HLAVIČKA
    ====================================== -->

    <div class="header">

      <div class="header-icon">
        ❓
      </div>

      <h1>
        Procvičování otázek
      </h1>

      <p>
        Vyber správnou odpověď.
      </p>

    </div>



    <!-- =====================================
         VÝBĚR OBLASTI
    ====================================== -->

    <div class="category-box">

      <label for="categorySelect">
        Co chceš procvičovat?
      </label>


      <select
        id="categorySelect"
        class="category-select"
      >

        <option value="all">
          Všechny otázky
        </option>

        <option value="1">
          Přírodovědné znalosti
        </option>

        <option value="2">
          Chov ryb
        </option>

        <option value="3">
          Zákon o rybářství
        </option>

        <option value="4">
          Stanovy ČRS
        </option>

        <option value="5">
          Znalosti z rybolovné techniky
        </option>

        <option value="6">
          Závodní lov ryb udicí
        </option>

      </select>

    </div>



    <!-- =====================================
         KARTA OTÁZKY
    ====================================== -->

    <div class="question-card">


      <div
        class="question-category"
        id="questionCategory"
      >
      </div>


      <div
        class="question-number"
        id="questionNumber"
      >
      </div>


      <div class="question-row">

        <div
          class="question-text"
          id="questionText"
        >
          Načítám otázku...
        </div>


        <button
          class="sound-button"
          id="questionSound"
          type="button"
          aria-label="Přehrát otázku"
          title="Přehrát otázku"
        >
          🔊
        </button>

      </div>



      <!-- ODPOVĚDI -->

      <div
        class="answers"
        id="answers"
      >
      </div>



      <!-- VÝSLEDEK -->

      <div
        class="result"
        id="result"
      >
      </div>



      <!-- DALŠÍ -->

      <button
        class="next-button"
        id="nextButton"
        type="button"
      >
        Další otázka →
      </button>

    </div>



    <!-- =====================================
         STATISTIKA
    ====================================== -->

    <div class="stats">

      <span>
        Celkem:
        <strong id="totalCount">
          0
        </strong>
      </span>


      <span class="stat-good">
        ✓
        <strong id="correctCount">
          0
        </strong>
      </span>


      <span class="stat-bad">
        ✕
        <strong id="wrongCount">
          0
        </strong>
      </span>

    </div>

  </div>



  <!-- =====================================
       DATA + SPOLEČNÝ ZVUK
  ====================================== -->

  <script src="otazky-data.js"></script>

  <script src="sound.js"></script>



  <script>

    /* ========================================
       PROMĚNNÉ
    ======================================== */

    let filteredQuestions = [];

    let currentQuestion = null;

    let currentAnswers = [];

    let answered = false;


    let totalAnswered = 0;

    let correctAnswered = 0;

    let wrongAnswered = 0;



    /* ========================================
       HTML PRVKY
    ======================================== */

    const categorySelect =
      document.getElementById(
        "categorySelect"
      );


    const questionCategory =
      document.getElementById(
        "questionCategory"
      );


    const questionNumber =
      document.getElementById(
        "questionNumber"
      );


    const questionText =
      document.getElementById(
        "questionText"
      );


    const questionSound =
      document.getElementById(
        "questionSound"
      );


    const answersContainer =
      document.getElementById(
        "answers"
      );


    const result =
      document.getElementById(
        "result"
      );


    const nextButton =
      document.getElementById(
        "nextButton"
      );


    const counter =
      document.getElementById(
        "counter"
      );


    const totalCount =
      document.getElementById(
        "totalCount"
      );


    const correctCount =
      document.getElementById(
        "correctCount"
      );


    const wrongCount =
      document.getElementById(
        "wrongCount"
      );



    /* ========================================
       PROMÍCHÁNÍ POLE
    ======================================== */

    function shuffleArray(array) {

      const copy =
        [...array];


      for (
        let i = copy.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() *
            (i + 1)
          );


        [
          copy[i],
          copy[j]
        ] =
        [
          copy[j],
          copy[i]
        ];

      }


      return copy;
    }



    /* ========================================
       VÝBĚR OTÁZEK PODLE OBLASTI
    ======================================== */

    function prepareQuestions() {

      const selected =
        categorySelect.value;


      if (selected === "all") {

        filteredQuestions =
          shuffleArray(
            questions
          );

      }

      else {

        filteredQuestions =
          shuffleArray(

            questions.filter(
              function(question) {

                return (
                  question.section ===
                  Number(selected)
                );

              }
            )

          );

      }


      showNewQuestion();
    }



    /* ========================================
       NOVÁ OTÁZKA
    ======================================== */

    function showNewQuestion() {

      answered = false;


      result.className =
        "result";

      result.textContent =
        "";


      nextButton.classList.remove(
        "show"
      );


      /*
        Pokud by náhodou nebyly
        načtené žádné otázky.
      */

      if (
        !filteredQuestions ||
        filteredQuestions.length === 0
      ) {

        questionText.textContent =
          "V této oblasti nejsou žádné otázky.";

        questionCategory.textContent =
          "";

        questionNumber.textContent =
          "";

        answersContainer.innerHTML =
          "";

        return;
      }


      /*
        Vybereme náhodnou otázku.
      */

      const randomIndex =
        Math.floor(
          Math.random() *
          filteredQuestions.length
        );


      currentQuestion =
        filteredQuestions[
          randomIndex
        ];


      /*
        Promícháme odpovědi.
      */

      currentAnswers =
        shuffleArray(
          currentQuestion.answers
        );


      renderQuestion();
    }



    /* ========================================
       VYKRESLENÍ OTÁZKY
    ======================================== */

    function renderQuestion() {

      questionCategory.textContent =
        currentQuestion.sectionName;


      questionNumber.textContent =
        "Otázka " +
        currentQuestion.section +
        "/" +
        currentQuestion.number;


      questionText.textContent =
        currentQuestion.question;


      counter.textContent =
        "Otázka " +
        currentQuestion.section +
        "/" +
        currentQuestion.number;


      /*
        Zvuk otázky.
      */

      questionSound.onclick =
        function() {

          playText(
            currentQuestion.question,
            currentQuestion.questionAudio
          );

        };


      /*
        Odpovědi.
      */

      answersContainer.innerHTML =
        "";


      currentAnswers.forEach(
        function(answer) {


          const row =
            document.createElement(
              "div"
            );


          row.className =
            "answer-row";



          /* ================================
             TEXT ODPOVĚDI
          ================================ */

          const answerButton =
            document.createElement(
              "button"
            );


          answerButton.type =
            "button";


          answerButton.className =
            "answer-button";


          answerButton.textContent =
            answer.text;


          answerButton.onclick =
            function() {

              checkAnswer(
                answer,
                answerButton
              );

            };



          /* ================================
             ZVUK ODPOVĚDI
          ================================ */

          const soundButton =
            document.createElement(
              "button"
            );


          soundButton.type =
            "button";


          soundButton.className =
            "answer-sound";


          soundButton.textContent =
            "🔊";


          soundButton.setAttribute(
            "aria-label",
            "Přehrát odpověď"
          );


          soundButton.title =
            "Přehrát odpověď";


          soundButton.onclick =
            function(event) {

              /*
                Zabráníme tomu,
                aby kliknutí na reproduktor
                zároveň vybralo odpověď.
              */

              event.stopPropagation();


              playText(
                answer.text,
                answer.audio
              );

            };


          row.appendChild(
            answerButton
          );


          row.appendChild(
            soundButton
          );


          answersContainer.appendChild(
            row
          );

        }
      );

    }



    /* ========================================
       KONTROLA ODPOVĚDI
    ======================================== */

    function checkAnswer(
      selectedAnswer,
      selectedButton
    ) {

      /*
        Na jednu otázku lze odpovědět
        pouze jednou.
      */

      if (answered) {
        return;
      }


      answered = true;


      totalAnswered++;


      const answerButtons =
        answersContainer.querySelectorAll(
          ".answer-button"
        );


      /*
        Vypneme všechny odpovědi
        a označíme správnou.
      */

      answerButtons.forEach(
        function(button, index) {

          button.disabled =
            true;


          if (
            currentAnswers[index].correct
          ) {

            button.classList.add(
              "correct"
            );

          }

        }
      );



      /* =====================================
         SPRÁVNÁ ODPOVĚĎ
      ====================================== */

      if (selectedAnswer.correct) {

        correctAnswered++;


        result.textContent =
          "✓ Správně!";


        result.className =
          "result correct";


        removeQuestionFromMistakes(
          currentQuestion.id
        );

      }


      /* =====================================
         CHYBNÁ ODPOVĚĎ
      ====================================== */

      else {

        wrongAnswered++;


        selectedButton.classList.add(
          "wrong"
        );


        const correct =
          currentQuestion.answers.find(
            function(answer) {

              return answer.correct;

            }
          );


        result.textContent =
          "✕ To není správně. Správná odpověď je: " +
          correct.text;


        result.className =
          "result wrong";


        saveQuestionToMistakes(
          currentQuestion.id
        );

      }



      updateStats();


      nextButton.classList.add(
        "show"
      );

    }



    /* ========================================
       STATISTIKA
    ======================================== */

    function updateStats() {

      totalCount.textContent =
        totalAnswered;


      correctCount.textContent =
        correctAnswered;


      wrongCount.textContent =
        wrongAnswered;

    }



    /* ========================================
       AKTUÁLNÍ PROFIL
    ======================================== */

    function getCurrentProfileId() {

      /*
        Pokud už v aplikaci používáš
        konkrétní název pro aktivní profil,
        později ho můžeme napojit přesně
        na současný systém profilů.

        Prozatím zkoušíme několik
        běžných variant.
      */


      return (

        localStorage.getItem(
          "activeProfile"
        )

        ||

        localStorage.getItem(
          "currentProfile"
        )

        ||

        localStorage.getItem(
          "selectedProfile"
        )

        ||

        "default"

      );

    }



    /* ========================================
       KLÍČ PRO "CO MI NEJDE"
    ======================================== */

    function getMistakesKey() {

      const profileId =
        getCurrentProfileId();


      return (
        "zlataUdice_questionMistakes_" +
        profileId
      );

    }



    /* ========================================
       ULOŽENÍ CHYBY
    ======================================== */

    function saveQuestionToMistakes(
      questionId
    ) {

      const key =
        getMistakesKey();


      let mistakes = [];


      try {

        mistakes =
          JSON.parse(
            localStorage.getItem(key)
          ) || [];

      }

      catch (error) {

        mistakes = [];

      }


      if (
        !mistakes.includes(
          questionId
        )
      ) {

        mistakes.push(
          questionId
        );

      }


      localStorage.setItem(
        key,
        JSON.stringify(mistakes)
      );

    }



    /* ========================================
       ODSTRANĚNÍ Z "CO MI NEJDE"
    ======================================== */

    function removeQuestionFromMistakes(
      questionId
    ) {

      const key =
        getMistakesKey();


      let mistakes = [];


      try {

        mistakes =
          JSON.parse(
            localStorage.getItem(key)
          ) || [];

      }

      catch (error) {

        mistakes = [];

      }


      mistakes =
        mistakes.filter(
          function(id) {

            return (
              id !== questionId
            );

          }
        );


      localStorage.setItem(
        key,
        JSON.stringify(mistakes)
      );

    }



    /* ========================================
       DALŠÍ OTÁZKA
    ======================================== */

    nextButton.addEventListener(
      "click",
      function() {

        stopSound();

        showNewQuestion();

      }
    );



    /* ========================================
       ZMĚNA OBLASTI
    ======================================== */

    categorySelect.addEventListener(
      "change",
      function() {

        stopSound();

        prepareQuestions();

      }
    );



    /* ========================================
       START
    ======================================== */

    window.addEventListener(
      "load",
      function() {

        /*
          Kontrola, zda se databáze
          opravdu načetla.
        */

        if (
          typeof questions ===
          "undefined"
        ) {

          questionText.textContent =
            "Nepodařilo se načíst databázi otázek.";

          answersContainer.innerHTML =
            "";

          return;
        }


        console.log(
          "Počet otázek:",
          questions.length
        );


        prepareQuestions();

      }
    );

  </script>

</body>

</html>
