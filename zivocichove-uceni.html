<!DOCTYPE html>
<html lang="cs">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">

  <title>Učení živočichů | Zlatá udice</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef7fb;
      color: #17324d;
    }

    .app {
      max-width: 600px;
      margin: auto;
      min-height: 100vh;
      padding: 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .back {
      color: #567;
      text-decoration: none;
      font-weight: bold;
    }

    .counter {
      color: #678;
      font-weight: bold;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header-icon {
      font-size: 42px;
    }

    .header h1 {
      margin: 5px 0;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      color: #678;
    }

    .animal-card {
      background: white;
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      text-align: center;
    }

    .photo {
      width: 100%;
      min-height: 280px;
      background: #f3f7f9;
      border-radius: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #789;
      margin-bottom: 22px;
      overflow: hidden;
    }

    .animal-photo {
      width: 100%;
      height: auto;
      max-height: 420px;
      object-fit: contain;
      display: block;
      border-radius: 18px;
    }

    .photo-placeholder {
      width: 100%;
      min-height: 280px;
      border: 2px dashed #c7d8e2;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .photo-icon {
      font-size: 60px;
      margin-bottom: 10px;
    }

    .animal-number {
      display: inline-block;
      background: #dfeef5;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .animal-name {
      font-size: 30px;
      margin: 5px 0 18px;
    }

    .sound-button {
      border: none;
      background: #e6f2f7;
      color: #17324d;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .sound-button:active {
      transform: scale(0.97);
    }

    .sound-message {
      min-height: 20px;
      color: #789;
      font-size: 13px;
      margin-top: 9px;
    }

    .sound-error {
      color: #a65b5b;
    }

    .navigation {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }

    .nav-button {
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .previous {
      background: white;
      color: #17324d;
    }

    .next {
      background: #17324d;
      color: white;
    }

    .nav-button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .jump {
      margin-top: 20px;
    }

    select {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid #c7d8e2;
      background: white;
      color: #17324d;
      font-size: 16px;
    }

    @media (max-width: 520px) {

      .app {
        padding: 15px;
      }

      .photo,
      .photo-placeholder {
        min-height: 220px;
      }

      .animal-photo {
        max-height: 340px;
      }

      .animal-name {
        font-size: 26px;
      }

    }

  </style>
</head>


<body>

<main class="app">


  <!-- HORNÍ LIŠTA -->

  <div class="topbar">

    <a
      class="back"
      href="zivocichove.html">
      ← Živočichové
    </a>

    <span
      class="counter"
      id="counter">
    </span>

  </div>


  <!-- HLAVIČKA -->

  <div class="header">

    <div class="header-icon">
      📖 🦆
    </div>

    <h1>Učení</h1>

    <p>
      Procházej živočichy jednoho po druhém
    </p>

  </div>


  <!-- KARTA ŽIVOČICHA -->

  <div class="animal-card">


    <!-- FOTOGRAFIE -->

    <div
      class="photo"
      id="photoArea">
    </div>


    <!-- ČÍSLO KARTY -->

    <div
      class="animal-number"
      id="animalNumber">
    </div>


    <!-- NÁZEV -->

    <h2
      class="animal-name"
      id="animalName">
    </h2>


    <!-- ZVUK -->

    <button
      class="sound-button"
      type="button"
      onclick="playName()">
      🔊 Přehrát název
    </button>


    <div
      class="sound-message"
      id="soundMessage">
      Klepni a poslechni si název
    </div>


  </div>


  <!-- NAVIGACE -->

  <div class="navigation">

    <button
      class="nav-button previous"
      id="previousButton"
      type="button"
      onclick="previousAnimal()">
      ← Předchozí
    </button>


    <button
      class="nav-button next"
      id="nextButton"
      type="button"
      onclick="nextAnimal()">
      Další →
    </button>

  </div>


  <!-- VÝBĚR ŽIVOČICHA -->

  <div class="jump">

    <select
      id="animalSelect"
      onchange="jumpToAnimal()">

      <option
        value=""
        selected
        disabled>
        Vybrat živočicha…
      </option>

    </select>

  </div>


</main>


<!-- ========================================
     NAČTENÍ DAT ŽIVOČICHŮ
======================================== -->

<script src="zivocichove-data.js"></script>


<script>

/* ========================================
   AKTUÁLNÍ ŽIVOČICH
======================================== */

let currentAnimal = 0;


/* ========================================
   AKTUÁLNÍ ZVUK
======================================== */

let animalAudio = null;


/* ========================================
   PRVKY STRÁNKY
======================================== */

const animalName =
  document.getElementById(
    "animalName"
  );


const animalNumber =
  document.getElementById(
    "animalNumber"
  );


const counter =
  document.getElementById(
    "counter"
  );


const previousButton =
  document.getElementById(
    "previousButton"
  );


const nextButton =
  document.getElementById(
    "nextButton"
  );


const animalSelect =
  document.getElementById(
    "animalSelect"
  );


const photoArea =
  document.getElementById(
    "photoArea"
  );


const soundMessage =
  document.getElementById(
    "soundMessage"
  );


/* ========================================
   PŘEVOD NÁZVU NA JMÉNO SOUBORU
======================================== */

function createFileName(name) {

  return String(name)
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "");

}


/* ========================================
   VYTVOŘENÍ VÝBĚRU
======================================== */

function createAnimalSelect() {

  if (
    typeof animals === "undefined" ||
    !Array.isArray(animals)
  ) {

    return;

  }


  animals.forEach(
    function(item, index) {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        index;


      if (item.card) {

        option.textContent =
          item.card +
          ". " +
          item.name;

      }
      else {

        option.textContent =
          item.name;

      }


      animalSelect.appendChild(
        option
      );

    }
  );

}


/* ========================================
   PLACEHOLDER FOTOGRAFIE
======================================== */

function showPlaceholder() {

  photoArea.innerHTML =
    '<div class="photo-placeholder">' +
      '<div class="photo-icon">🖼️</div>' +
      '<strong>Fotografii doplníme</strong>' +
      '<span>Pro tohoto živočicha zatím fotografii nemáme.</span>' +
    '</div>';

}


/* ========================================
   FOTOGRAFIE
======================================== */

function showPhoto(item) {

  showPlaceholder();


  const baseName =
    createFileName(
      item.name
    );


  const possibleImages =
    [];


  if (item.image) {

    possibleImages.push(
      item.image
    );

  }


  possibleImages.push(

    baseName + ".webp",
    baseName + "-2.webp",
    baseName + "-3.webp",

    baseName + ".jpg",
    baseName + "-2.jpg",
    baseName + "-3.jpg",

    baseName + ".jpeg",
    baseName + "-2.jpeg",
    baseName + "-3.jpeg",

    baseName + ".png",
    baseName + "-2.png",
    baseName + "-3.png"

  );


  let attempt = 0;


  function tryNextImage() {

    if (
      attempt >=
      possibleImages.length
    ) {

      return;

    }


    const img =
      new Image();


    img.onload =
      function() {

        if (
          !animals[currentAnimal] ||
          animals[currentAnimal].name !==
          item.name
        ) {

          return;

        }


        img.className =
          "animal-photo";


        img.alt =
          item.name;


        photoArea.innerHTML =
          "";


        photoArea.appendChild(
          img
        );

      };


    img.onerror =
      function() {

        attempt++;

        tryNextImage();

      };


    img.src =
      possibleImages[attempt];

  }


  tryNextImage();

}


/* ========================================
   ZASTAVENÍ ZVUKU
======================================== */

function stopAnimalSound() {

  if (animalAudio) {

    try {

      animalAudio.pause();

      animalAudio.currentTime =
        0;

    }
    catch (error) {

      console.log(error);

    }


    animalAudio =
      null;

  }

}


/* ========================================
   PŘEHRÁNÍ NÁZVU
======================================== */

function playName() {

  if (
    typeof animals === "undefined" ||
    !animals[currentAnimal]
  ) {

    return;

  }


  stopAnimalSound();


  const item =
    animals[currentAnimal];


  const fileName =
    createFileName(
      item.name
    ) + ".mp3";


  /*
    Vyzkoušíme několik možných cest.

    Jakmile najdeme správný MP3,
    přehraje se.

    Díky tomu nemusíme používat
    automatické čtení telefonu.
  */

  const possibleAudioFiles = [

    "audio/zivocichove/" + fileName,

    "audio/" + fileName,

    "zvuky/zivocichove/" + fileName,

    "zvuky/" + fileName,

    fileName

  ];


  let attempt =
    0;


  soundMessage.classList.remove(
    "sound-error"
  );


  soundMessage.textContent =
    "🔊 Načítám zvuk…";


  function tryNextAudio() {

    if (
      attempt >=
      possibleAudioFiles.length
    ) {

      soundMessage.classList.add(
        "sound-error"
      );


      soundMessage.textContent =
        "Zvuk pro tohoto živočicha zatím nebyl nalezen.";


      animalAudio =
        null;


      return;

    }


    const audio =
      new Audio();


    const source =
      possibleAudioFiles[attempt];


    let finished =
      false;


    function failed() {

      if (finished) {
        return;
      }


      finished =
        true;


      try {

        audio.pause();

      }
      catch (error) {

      }


      attempt++;

      tryNextAudio();

    }


    audio.addEventListener(
      "canplaythrough",
      function() {

        if (finished) {
          return;
        }


        finished =
          true;


        animalAudio =
          audio;


        soundMessage.textContent =
          "🔊 Přehrávám: " +
          item.name;


        const playPromise =
          audio.play();


        if (
          playPromise &&
          typeof playPromise.catch ===
          "function"
        ) {

          playPromise.catch(
            function() {

              soundMessage.classList.add(
                "sound-error"
              );


              soundMessage.textContent =
                "Zvuk se nepodařilo přehrát.";

            }
          );

        }

      },
      {
        once: true
      }
    );


    audio.addEventListener(
      "error",
      failed,
      {
        once: true
      }
    );


    audio.addEventListener(
      "ended",
      function() {

        if (
          animalAudio === audio
        ) {

          animalAudio =
            null;

        }


        soundMessage.textContent =
          "Klepni a poslechni si název";

      },
      {
        once: true
      }
    );


    audio.preload =
      "auto";


    audio.src =
      source;


    audio.load();

  }


  tryNextAudio();

}


/* ========================================
   ZOBRAZENÍ ŽIVOČICHA
======================================== */

function showAnimal() {

  stopAnimalSound();


  soundMessage.classList.remove(
    "sound-error"
  );


  soundMessage.textContent =
    "Klepni a poslechni si název";


  if (
    typeof animals === "undefined" ||
    !Array.isArray(animals) ||
    animals.length === 0
  ) {

    animalName.textContent =
      "Seznam živočichů se nepodařilo načíst.";


    animalNumber.style.display =
      "none";


    counter.textContent =
      "";


    showPlaceholder();


    return;

  }


  const item =
    animals[currentAnimal];


  animalName.textContent =
    item.name;


  if (item.card) {

    animalNumber.style.display =
      "inline-block";


    animalNumber.textContent =
      "Karta č. " +
      item.card;

  }
  else {

    animalNumber.style.display =
      "none";

  }


  counter.textContent =
    (currentAnimal + 1) +
    " / " +
    animals.length;


  previousButton.disabled =
    currentAnimal === 0;


  nextButton.disabled =
    currentAnimal ===
    animals.length - 1;


  animalSelect.value =
    currentAnimal;


  showPhoto(
    item
  );

}


/* ========================================
   DALŠÍ
======================================== */

function nextAnimal() {

  if (
    currentAnimal <
    animals.length - 1
  ) {

    currentAnimal++;


    showAnimal();


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }

}


/* ========================================
   PŘEDCHOZÍ
======================================== */

function previousAnimal() {

  if (
    currentAnimal > 0
  ) {

    currentAnimal--;


    showAnimal();


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }

}


/* ========================================
   VÝBĚR ZE SEZNAMU
======================================== */

function jumpToAnimal() {

  if (
    animalSelect.value === ""
  ) {

    return;

  }


  currentAnimal =
    Number(
      animalSelect.value
    );


  showAnimal();


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* ========================================
   START
======================================== */

createAnimalSelect();

showAnimal();

</script>


</body>

</html>
