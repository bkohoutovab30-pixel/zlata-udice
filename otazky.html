<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">

<title>Testové otázky | Zlatá udice</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #eef8fc;
  color: #062d59;
}

.page {
  max-width: 820px;
  margin: 0 auto;
  padding: 20px 18px 50px;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 22px;
  font-weight: 700;
  color: #56718c;
}

.back {
  color: #56718c;
  text-decoration: none;
  font-size: 18px;
}

.user {
  font-size: 16px;
}

.hero {
  text-align: center;
  margin-bottom: 28px;
}

.hero-icon {
  font-size: 50px;
  line-height: 1;
  margin-bottom: 8px;
}

h1 {
  margin: 0;
  font-size: 34px;
  color: #062d59;
}

.subtitle {
  margin-top: 8px;
  font-size: 20px;
  color: #607890;
}

/* VÝBĚR OBLASTI */

.filter-card {
  background: white;
  border-radius: 24px;
  padding: 22px;
  box-shadow: 0 10px 28px rgba(6,45,89,.08);
  margin-bottom: 22px;
}

.filter-card label {
  display: block;
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 10px;
  color: #506b86;
}

select {
  width: 100%;
  border: 2px solid #d5e5ed;
  border-radius: 15px;
  padding: 16px;
  font-size: 20px;
  font-weight: 700;
  color: #062d59;
  background: white;
  outline: none;
}

select:focus {
  border-color: #8bbfd8;
}

.mode-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 14px;
}

.mode-btn {
  border: 0;
  border-radius: 15px;
  min-height: 50px;
  padding: 12px 16px;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  background: #e5f3f9;
  color: #062d59;
}

.mode-btn.active {
  background: #173e63;
  color: white;
}

/* STATISTIKY */

.stats {
  background: white;
  border-radius: 22px;
  padding: 17px 10px;
  margin-bottom: 22px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  text-align: center;
  box-shadow: 0 10px 28px rgba(6,45,89,.06);
}

.stat-number {
  font-size: 24px;
  font-weight: 700;
}

.stat-label {
  margin-top: 5px;
  font-size: 13px;
  color: #6a8095;
}

/* OTÁZKA */

.question-card {
  background: white;
  border-radius: 24px;
  padding: 28px;
  box-shadow: 0 10px 28px rgba(6,45,89,.08);
}

.category {
  font-size: 17px;
  color: #758ba0;
  font-weight: 700;
  margin-bottom: 10px;
}

.question-number {
  font-size: 16px;
  color: #7890a7;
  margin-bottom: 20px;
}

.question-row {
  display: grid;
  grid-template-columns: 1fr 58px;
  gap: 12px;
  align-items: center;
  margin-bottom: 26px;
}

.question-text {
  font-size: 25px;
  line-height: 1.35;
  font-weight: 700;
  color: #062d59;
}

.sound-btn {
  width: 58px;
  height: 58px;
  border: 0;
  border-radius: 50%;
  background: #e9f6fc;
  cursor: pointer;
  font-size: 23px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.sound-btn:hover {
  background: #d8eff9;
}

/* ODPOVĚDI */

.answers {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.answer-row {
  display: grid;
  grid-template-columns: 1fr 58px;
  gap: 10px;
  align-items: stretch;
}

.answer-btn {
  width: 100%;
  min-height: 78px;
  border: 2px solid #d5e5ed;
  border-radius: 17px;
  background: #f9fcfd;
  color: #062d59;
  padding: 16px 20px;
  text-align: left;
  font-size: 20px;
  line-height: 1.3;
  font-weight: 700;
  cursor: pointer;
}

.answer-btn:hover:not(:disabled) {
  border-color: #9dc9dd;
  background: #f1f9fc;
}

.answer-btn.correct {
  background: #e7f8eb;
  border-color: #35a853;
  color: #176b2d;
}

.answer-btn.wrong {
  background: #fff0f0;
  border-color: #df4d4d;
  color: #a42222;
}

.answer-btn:disabled {
  cursor: default;
}

.answer-sound {
  width: 58px;
  min-height: 78px;
  border-radius: 17px;
}

.feedback {
  margin-top: 22px;
  min-height: 30px;
  font-size: 19px;
  font-weight: 700;
  text-align: center;
}

.feedback.good {
  color: #19863c;
}

.feedback.bad {
  color: #c52f2f;
}

.loading {
  text-align: center;
  font-size: 20px;
  font-weight: 700;
  padding: 25px 5px;
}

.restart-btn {
  margin-top: 25px;
  border: 0;
  border-radius: 15px;
  background: #062d59;
  color: white;
  padding: 15px 25px;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
}

.note {
  margin-top: 17px;
  text-align: center;
  color: #71879b;
  font-size: 14px;
}

@media (max-width:600px) {

  .page {
    padding: 14px 12px 35px;
  }

  h1 {
    font-size: 29px;
  }

  .question-card {
    padding: 22px 18px;
  }

  .question-text {
    font-size: 21px;
  }

  .answer-btn {
    font-size: 18px;
    padding: 14px 16px;
  }

  .question-row,
  .answer-row {
    grid-template-columns: 1fr 52px;
  }

  .sound-btn {
    width: 52px;
    height: 52px;
  }

  .answer-sound {
    min-height: 72px;
  }

  .stats {
    grid-template-columns: repeat(2,1fr);
    gap: 18px 5px;
  }

  .mode-buttons {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="page">

  <div class="topbar">
    <a href="index.html" class="back">← Zpět</a>
    <div class="user">🎣 Zlatá udice</div>
  </div>

  <div class="hero">
    <div class="hero-icon">📝</div>
    <h1>Testové otázky</h1>
    <div class="subtitle">Zlatá udice 2026</div>
  </div>

  <div class="filter-card">

    <label for="categorySelect">
      Co chceš procvičovat?
    </label>

    <select id="categorySelect">
      <option value="all">Všechny otázky</option>
      <option value="1">1. Přírodovědné znalosti</option>
      <option value="2">2. Chov ryb</option>
      <option value="3">3. Zákon o rybářství</option>
      <option value="4">4. Stanovy ČRS</option>
      <option value="5">5. Znalosti z rybolovné techniky</option>
      <option value="6">6. Závodní lov ryb udicí</option>
    </select>

    <div class="mode-buttons">

      <button
        id="allMode"
        class="mode-btn active"
        type="button"
      >
        🎯 Všechny otázky
      </button>

      <button
        id="wrongMode"
        class="mode-btn"
        type="button"
      >
        💗 Co mi nejde
      </button>

    </div>

  </div>

  <div class="stats">

    <div>
      <div class="stat-number" id="answeredCount">0</div>
      <div class="stat-label">Odpovězeno</div>
    </div>

    <div>
      <div class="stat-number" id="correctCount">0</div>
      <div class="stat-label">Správně</div>
    </div>

    <div>
      <div class="stat-number" id="wrongCount">0</div>
      <div class="stat-label">Chybně</div>
    </div>

    <div>
      <div class="stat-number" id="problemCount">0</div>
      <div class="stat-label">Co mi nejde</div>
    </div>

  </div>

  <div class="question-card" id="questionCard">
    <div class="loading">Načítám otázky…</div>
  </div>

  <div class="note">
    🔊 Otázku i každou odpověď můžeš poslouchat zvlášť.
  </div>

</div>

<script src="otazky-data.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

  const categorySelect =
    document.getElementById("categorySelect");

  const questionCard =
    document.getElementById("questionCard");

  const answeredCountEl =
    document.getElementById("answeredCount");

  const correctCountEl =
    document.getElementById("correctCount");

  const wrongCountEl =
    document.getElementById("wrongCount");

  const problemCountEl =
    document.getElementById("problemCount");

  const allMode =
    document.getElementById("allMode");

  const wrongMode =
    document.getElementById("wrongMode");


  let currentQuestions = [];
  let currentIndex = 0;

  let correctCount = 0;
  let wrongCount = 0;

  let locked = false;
  let currentAudio = null;

  let mode = "all";


  /* ===============================
     CO MI NEJDE
     =============================== */

  let problemQuestions = [];

  try {

    problemQuestions =
      JSON.parse(
        localStorage.getItem(
          "zlataUdiceProblemQuestions"
        )
      ) || [];

  } catch (e) {

    problemQuestions = [];

  }


  /* ===============================
     NAČTENÍ DATABÁZE
     =============================== */

  function prepareQuestions() {

    if (
      typeof questionsRaw === "undefined" ||
      !Array.isArray(questionsRaw)
    ) {

      console.error(
        "Databáze questionsRaw nebyla nalezena."
      );

      return [];

    }


    return questionsRaw.map(function(q) {

      return {

        section: Number(q[0]),

        number: Number(q[1]),

        question: q[2],

        answers: [
          q[3],
          q[4],
          q[5]
        ],

        correct: Number(q[6])

      };

    });

  }


  const allQuestions =
    prepareQuestions();


  /* ===============================
     NÁZVY OBLASTÍ
     =============================== */

  function getSectionName(section) {

    const names = {

      1: "Přírodovědné znalosti",

      2: "Chov ryb",

      3: "Zákon o rybářství",

      4: "Stanovy ČRS",

      5: "Znalosti z rybolovné techniky",

      6: "Závodní lov ryb udicí"

    };

    return names[section] || "";

  }


  /* ===============================
     ID OTÁZKY
     =============================== */

  function questionID(q) {

    return (
      q.section +
      "-" +
      q.number
    );

  }


  /* ===============================
     NÁHODNÉ PROMÍCHÁNÍ
     =============================== */

  function shuffle(array) {

    const copy = [...array];

    for (
      let i = copy.length - 1;
      i > 0;
      i--
    ) {

      const j =
        Math.floor(
          Math.random() * (i + 1)
        );

      [
        copy[i],
        copy[j]
      ] = [
        copy[j],
        copy[i]
      ];

    }

    return copy;

  }


  /* ===============================
     START
     =============================== */

  function startPractice() {

    stopAudio();

    const selected =
      categorySelect.value;


    let source;


    if (mode === "wrong") {

      source =
        allQuestions.filter(function(q) {

          return problemQuestions.includes(
            questionID(q)
          );

        });

    } else {

      source = [...allQuestions];

    }


    if (selected !== "all") {

      const section =
        Number(selected);

      source =
        source.filter(function(q) {

          return q.section === section;

        });

    }


    /*
      PROMÍCHÁME POŘADÍ OTÁZEK
    */

    currentQuestions =
      shuffle(source);


    currentIndex = 0;

    correctCount = 0;

    wrongCount = 0;

    updateStats();

    showQuestion();

  }


  /* ===============================
     ZOBRAZENÍ OTÁZKY
     =============================== */

  function showQuestion() {

    stopAudio();

    locked = false;


    if (
      currentQuestions.length === 0
    ) {

      if (mode === "wrong") {

        questionCard.innerHTML = `

          <div style="
            text-align:center;
            padding:25px 5px;
          ">

            <div style="
              font-size:45px;
              margin-bottom:15px;
            ">
              🎉
            </div>

            <div style="
              font-size:23px;
              font-weight:700;
            ">
              Zatím tu nemáš žádné problematické otázky.
            </div>

            <div style="
              margin-top:10px;
              color:#71879b;
            ">
              Otázky, které zodpovíš špatně,
              se sem automaticky uloží.
            </div>

          </div>
        `;

      } else {

        questionCard.innerHTML = `

          <div class="loading">
            Pro tuto oblast nebyly nalezeny žádné otázky.
          </div>
        `;

      }

      return;

    }


    if (
      currentIndex >=
      currentQuestions.length
    ) {

      showFinished();

      return;

    }


    const q =
      currentQuestions[currentIndex];


    /*
      =====================================
      PROMÍCHÁNÍ ODPOVĚDÍ

      Každá odpověď si zachová svoje
      původní číslo.

      Díky tomu aplikace stále ví:
      - která odpověď je správná
      - který MP3 soubor k ní patří
      =====================================
    */

    const shuffledAnswers =
      shuffle(

        q.answers.map(
          function(answer,index) {

            return {

              text: answer,

              originalNumber:
                index + 1

            };

          }
        )

      );


    let answersHTML = "";


    shuffledAnswers.forEach(
      function(answer) {

        answersHTML += `

          <div class="answer-row">

            <button
              class="answer-btn"
              data-answer="${answer.originalNumber}"
            >
              ${escapeHTML(answer.text)}
            </button>

            <button
              class="sound-btn answer-sound"
              data-audio-answer="${answer.originalNumber}"
              type="button"
              aria-label="Přehrát odpověď"
            >
              🔊
            </button>

          </div>
        `;

      }
    );


    questionCard.innerHTML = `

      <div class="category">
        ${escapeHTML(
          getSectionName(q.section)
        )}
      </div>

      <div class="question-number">
        Otázka
        ${currentIndex + 1}/${currentQuestions.length}
      </div>

      <div class="question-row">

        <div class="question-text">
          ${escapeHTML(q.question)}
        </div>

        <button
          class="sound-btn"
          id="questionSound"
          type="button"
          aria-label="Přehrát otázku"
        >
          🔊
        </button>

      </div>

      <div class="answers">
        ${answersHTML}
      </div>

      <div
        class="feedback"
        id="feedback"
      ></div>

    `;


    /* KLIKNUTÍ NA ODPOVĚĎ */

    document
      .querySelectorAll(
        ".answer-btn"
      )
      .forEach(
        function(button) {

          button.addEventListener(
            "click",
            function() {

              checkAnswer(
                Number(
                  button.dataset.answer
                )
              );

            }
          );

        }
      );


    /* ZVUK OTÁZKY */

    document
      .getElementById(
        "questionSound"
      )
      .addEventListener(
        "click",
        function() {

          playQuestionAudio(q);

        }
      );


    /* ZVUK ODPOVĚDÍ */

    document
      .querySelectorAll(
        "[data-audio-answer]"
      )
      .forEach(
        function(button) {

          button.addEventListener(
            "click",
            function() {

              playAnswerAudio(
                q,
                Number(
                  button.dataset.audioAnswer
                )
              );

            }
          );

        }
      );

  }


  /* ===============================
     ZVUKY
     =============================== */

  function padQuestionNumber(number) {

    return String(number)
      .padStart(3,"0");

  }


  function questionAudioPath(q) {

    return (
      "OTÁZKY 1/" +
      "otazka-" +
      q.section +
      "-" +
      padQuestionNumber(
        q.number
      ) +
      ".mp3"
    );

  }


  function answerAudioPath(
    q,
    answerNumber
  ) {

    return (
      "OTÁZKY 1/" +
      "odpoved-" +
      q.section +
      "-" +
      padQuestionNumber(
        q.number
      ) +
      "-" +
      answerNumber +
      ".mp3"
    );

  }


  function stopAudio() {

    if (currentAudio) {

      currentAudio.pause();

      currentAudio.currentTime = 0;

      currentAudio = null;

    }

  }


  function playAudio(path) {

    stopAudio();

    console.log(
      "Přehrávám:",
      path
    );

    currentAudio =
      new Audio(
        encodeURI(path)
      );


    currentAudio
      .play()
      .catch(
        function(error) {

          console.error(
            "Zvuk se nepodařilo přehrát:",
            path,
            error
          );

          currentAudio = null;

        }
      );

  }


  function playQuestionAudio(q) {

    playAudio(
      questionAudioPath(q)
    );

  }


  function playAnswerAudio(
    q,
    answerNumber
  ) {

    playAudio(
      answerAudioPath(
        q,
        answerNumber
      )
    );

  }


  /* ===============================
     VYHODNOCENÍ ODPOVĚDI
     =============================== */

  function checkAnswer(
    selectedAnswer
  ) {

    if (locked) {
      return;
    }


    locked = true;

    stopAudio();


    const q =
      currentQuestions[currentIndex];


    const buttons =
      document.querySelectorAll(
        ".answer-btn"
      );


    const feedback =
      document.getElementById(
        "feedback"
      );


    buttons.forEach(
      function(button) {

        button.disabled = true;


        const answerNumber =
          Number(
            button.dataset.answer
          );


        /*
          SPRÁVNÁ ODPOVĚĎ

          Nezáleží na tom,
          na jaké pozici se zobrazila.
        */

        if (
          answerNumber ===
          q.correct
        ) {

          button.classList.add(
            "correct"
          );

        }


        /*
          ŠPATNĚ ZVOLENÁ ODPOVĚĎ
        */

        if (
          answerNumber ===
          selectedAnswer &&
          selectedAnswer !==
          q.correct
        ) {

          button.classList.add(
            "wrong"
          );

        }

      }
    );


    if (
      selectedAnswer ===
      q.correct
    ) {

      correctCount++;

      feedback.textContent =
        "✓ Správně";

      feedback.className =
        "feedback good";


      /*
        Pokud procvičuje
        "Co mi nejde"
        a odpoví správně,
        otázku odstraníme
        z problematických.
      */

      if (mode === "wrong") {

        problemQuestions =
          problemQuestions.filter(
            function(id) {

              return id !==
                questionID(q);

            }
          );

        saveProblemQuestions();

      }

    } else {

      wrongCount++;

      feedback.textContent =
        "✕ Nesprávně";

      feedback.className =
        "feedback bad";


      /*
        Přidáme otázku
        do "Co mi nejde".
      */

      const id =
        questionID(q);


      if (
        !problemQuestions.includes(id)
      ) {

        problemQuestions.push(id);

        saveProblemQuestions();

      }

    }


    updateStats();


    /*
      AUTOMATICKY DALŠÍ OTÁZKA
    */

    setTimeout(
      function() {

        currentIndex++;

        showQuestion();

      },
      1400
    );

  }


  /* ===============================
     ULOŽENÍ "CO MI NEJDE"
     =============================== */

  function saveProblemQuestions() {

    localStorage.setItem(
      "zlataUdiceProblemQuestions",
      JSON.stringify(
        problemQuestions
      )
    );

    updateStats();

  }


  /* ===============================
     STATISTIKY
     =============================== */

  function updateStats() {

    answeredCountEl.textContent =
      correctCount +
      wrongCount;

    correctCountEl.textContent =
      correctCount;

    wrongCountEl.textContent =
      wrongCount;

    problemCountEl.textContent =
      problemQuestions.length;

  }


  /* ===============================
     KONEC PROCVIČOVÁNÍ
     =============================== */

  function showFinished() {

    stopAudio();


    const total =
      correctCount +
      wrongCount;


    const percent =
      total > 0
        ? Math.round(
            correctCount /
            total *
            100
          )
        : 0;


    questionCard.innerHTML = `

      <div style="
        text-align:center;
        padding:20px 5px;
      ">

        <div style="
          font-size:50px;
          margin-bottom:12px;
        ">
          🎣
        </div>

        <div style="
          font-size:28px;
          font-weight:700;
          margin-bottom:15px;
        ">
          Hotovo!
        </div>

        <div style="
          font-size:20px;
          line-height:1.7;
        ">

          Správně:
          <strong>
            ${correctCount}
          </strong>

          <br>

          Chybně:
          <strong>
            ${wrongCount}
          </strong>

          <br>

          Úspěšnost:
          <strong>
            ${percent} %
          </strong>

        </div>

        <button
          class="restart-btn"
          id="restartButton"
          type="button"
        >
          Procvičit znovu
        </button>

      </div>
    `;


    document
      .getElementById(
        "restartButton"
      )
      .addEventListener(
        "click",
        startPractice
      );

  }


  /* ===============================
     BEZPEČNÉ ZOBRAZENÍ TEXTU
     =============================== */

  function escapeHTML(value) {

    return String(value)
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );

  }


  /* ===============================
     VŠECHNY OTÁZKY
     =============================== */

  allMode.addEventListener(
    "click",
    function() {

      mode = "all";

      allMode.classList.add(
        "active"
      );

      wrongMode.classList.remove(
        "active"
      );

      startPractice();

    }
  );


  /* ===============================
     CO MI NEJDE
     =============================== */

  wrongMode.addEventListener(
    "click",
    function() {

      mode = "wrong";

      wrongMode.classList.add(
        "active"
      );

      allMode.classList.remove(
        "active"
      );

      startPractice();

    }
  );


  /* ===============================
     ZMĚNA OBLASTI
     =============================== */

  categorySelect.addEventListener(
    "change",
    startPractice
  );


  /* ===============================
     SPUŠTĚNÍ
     =============================== */

  if (
    allQuestions.length === 0
  ) {

    questionCard.innerHTML = `

      <div class="loading">
        Nepodařilo se načíst databázi otázek.
      </div>
    `;

    return;

  }


  console.log(
    "Načteno otázek:",
    allQuestions.length
  );


  updateStats();

  startPractice();

});

</script>

</body>
</html>
