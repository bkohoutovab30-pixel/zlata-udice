<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">

<title>Testové otázky | Zlatá udice 2026</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #eef7fb;
  color: #17324d;
}

.app {
  max-width: 720px;
  margin: auto;
  min-height: 100vh;
  padding: 16px;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
}

.back {
  color: #567;
  text-decoration: none;
  font-weight: bold;
}

.player {
  color: #567;
  font-size: 14px;
  font-weight: bold;
  text-align: right;
}

.header {
  text-align: center;
  margin-bottom: 18px;
}

.header-icon {
  font-size: 46px;
}

.header h1 {
  margin: 5px 0;
  font-size: 29px;
}

.header p {
  margin: 5px 0;
  color: #678;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
  margin-bottom: 16px;
}

.stat {
  background: white;
  border-radius: 15px;
  padding: 12px 6px;
  text-align: center;
  box-shadow: 0 3px 10px rgba(0,0,0,.06);
}

.stat strong {
  display: block;
  font-size: 22px;
  margin-bottom: 3px;
}

.stat span {
  color: #789;
  font-size: 12px;
}

.controls {
  background: white;
  border-radius: 18px;
  padding: 14px;
  margin-bottom: 16px;
  box-shadow: 0 3px 12px rgba(0,0,0,.06);
}

.mode-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-bottom: 12px;
}

.mode-button {
  border: 2px solid #d7e5ec;
  background: white;
  color: #17324d;
  border-radius: 13px;
  padding: 12px 8px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.mode-button.active {
  background: #17324d;
  border-color: #17324d;
  color: white;
}

select {
  width: 100%;
  padding: 13px;
  border: 2px solid #d7e5ec;
  border-radius: 13px;
  background: white;
  color: #17324d;
  font-size: 15px;
  font-weight: bold;
  outline: none;
}

.card {
  background: white;
  border-radius: 22px;
  padding: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

.question-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
  color: #789;
  font-size: 13px;
  font-weight: bold;
}

.section-name {
  display: inline-block;
  background: #e6f2f7;
  color: #456;
  border-radius: 20px;
  padding: 7px 11px;
  margin-bottom: 14px;
  font-size: 13px;
  font-weight: bold;
}

.question-text {
  font-size: 21px;
  line-height: 1.45;
  font-weight: bold;
  margin-bottom: 15px;
}

.sound-row {
  margin-bottom: 18px;
}

.sound-button {
  border: none;
  border-radius: 13px;
  background: #e6f2f7;
  color: #17324d;
  padding: 10px 15px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.answers {
  display: grid;
  gap: 11px;
}

.answer-row {
  display: grid;
  grid-template-columns: 1fr 52px;
  gap: 8px;
}

.answer-button {
  width: 100%;
  border: 2px solid #d7e5ec;
  background: white;
  color: #17324d;
  border-radius: 14px;
  padding: 14px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  text-align: left;
}

.answer-button:hover {
  background: #f5f9fb;
}

.answer-button.correct {
  background: #e8f7ec;
  border-color: #66aa78;
  color: #28703c;
}

.answer-button.wrong {
  background: #fff0f0;
  border-color: #d98787;
  color: #9a4040;
}

.answer-button:disabled {
  cursor: default;
}

.answer-sound {
  border: none;
  border-radius: 14px;
  background: #e6f2f7;
  color: #17324d;
  font-size: 20px;
  cursor: pointer;
}

.answer-sound:disabled {
  opacity: .7;
}

.feedback {
  display: none;
  margin-top: 18px;
  padding: 14px;
  border-radius: 14px;
  font-weight: bold;
  line-height: 1.5;
}

.feedback.correct {
  display: block;
  background: #edf8f0;
  color: #387848;
}

.feedback.wrong {
  display: block;
  background: #fff1f1;
  color: #a64f4f;
}

.next-button {
  width: 100%;
  margin-top: 16px;
  border: none;
  border-radius: 14px;
  padding: 15px;
  background: #17324d;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  display: none;
}

.empty {
  background: white;
  border-radius: 22px;
  padding: 30px 20px;
  text-align: center;
  box-shadow: 0 4px 15px rgba(0,0,0,.08);
  display: none;
}

.empty-icon {
  font-size: 52px;
  margin-bottom: 12px;
}

.empty h2 {
  margin: 5px 0 10px;
}

.empty p {
  color: #678;
  line-height: 1.5;
}

.all-button {
  margin-top: 12px;
  border: none;
  border-radius: 13px;
  background: #17324d;
  color: white;
  padding: 13px 18px;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
}

@media (max-width: 520px) {
  .app {
    padding: 13px;
  }

  .card {
    padding: 17px;
  }

  .question-text {
    font-size: 19px;
  }

  .mode-button {
    font-size: 14px;
  }
}
</style>
</head>

<body>

<main class="app">

  <div class="topbar">
    <a class="back" href="index.html">← Zpět</a>
    <div class="player" id="playerInfo">🎣 Zlatá udice</div>
  </div>

  <div class="header">
    <div class="header-icon">🧠</div>
    <h1>Testové otázky</h1>
    <p>Procvičuj otázky na Zlatou udici.</p>
  </div>


  <div class="stats">

    <div class="stat">
      <strong id="totalCount">0</strong>
      <span>otázek</span>
    </div>

    <div class="stat">
      <strong id="problemCount">0</strong>
      <span>💗 Co mi nejde</span>
    </div>

    <div class="stat">
      <strong id="sessionScore">0 / 0</strong>
      <span>dnes správně</span>
    </div>

  </div>


  <div class="controls">

    <div class="mode-buttons">

      <button
        class="mode-button active"
        id="allModeButton"
        type="button"
        onclick="setMode('all')"
      >
        🎯 Všechny otázky
      </button>

      <button
        class="mode-button"
        id="wrongModeButton"
        type="button"
        onclick="setMode('wrong')"
      >
        💗 Co mi nejde
      </button>

    </div>

    <select
      id="sectionFilter"
      onchange="changeSection()"
    >
      <option value="all">
        Všechny okruhy
      </option>

      <option value="1">
        1 – Přírodovědné znalosti
      </option>

      <option value="2">
        2 – Chov ryb
      </option>

      <option value="3">
        3 – Zákon o rybářství
      </option>

      <option value="4">
        4 – Stanovy ČRS
      </option>

      <option value="5">
        5 – Rybolovná technika
      </option>

      <option value="6">
        6 – Závodní lov ryb udicí
      </option>
    </select>

  </div>


  <div class="card" id="questionCard">

    <div class="question-info">
      <span id="questionCounter"></span>
      <span id="questionNumber"></span>
    </div>

    <div
      class="section-name"
      id="sectionName"
    ></div>

    <div
      class="question-text"
      id="questionText"
    ></div>

    <div class="sound-row">

      <button
        class="sound-button"
        id="questionSoundButton"
        type="button"
      >
        🔊 Přečíst otázku
      </button>

    </div>

    <div
      class="answers"
      id="answersArea"
    ></div>

    <div
      class="feedback"
      id="feedback"
    ></div>

    <button
      class="next-button"
      id="nextButton"
      type="button"
      onclick="nextQuestion()"
    >
      Další otázka →
    </button>

  </div>


  <div class="empty" id="emptyBox">

    <div class="empty-icon">🎉</div>

    <h2 id="emptyTitle">
      Paráda!
    </h2>

    <p id="emptyText">
      V „Co mi nejde“ teď nemáš žádné otázky.
    </p>

    <button
      class="all-button"
      type="button"
      onclick="setMode('all')"
    >
      🎯 Procvičovat všechny otázky
    </button>

  </div>

</main>


<script src="otazky-data.js"></script>
<script src="zvuk.js"></script>

<script>

/* =====================================================
   PROFIL
===================================================== */

const activeProfileId =
  localStorage.getItem(
    "zlataUdiceActiveProfile"
  );


function getProfiles() {

  try {

    const profiles =
      JSON.parse(
        localStorage.getItem(
          "zlataUdiceProfiles"
        )
      );

    return Array.isArray(profiles)
      ? profiles
      : [];

  } catch {

    return [];

  }

}


const activeProfile =
  getProfiles().find(
    function(profile) {

      return (
        String(profile.id) ===
        String(activeProfileId)
      );

    }
  );


if (activeProfile) {

  document.getElementById(
    "playerInfo"
  ).textContent =

    (activeProfile.avatar || "👤") +
    " " +
    (activeProfile.name || "");

}


/* =====================================================
   KLÍČ PRO "CO MI NEJDE"

   Každý hráč má svůj vlastní seznam.
===================================================== */

const LEGACY_PROBLEM_KEY =
  "zlataUdiceProblemQuestions";


const PROBLEM_KEY =
  activeProfileId
    ? "zlataUdiceProblemQuestions_" +
      activeProfileId
    : LEGACY_PROBLEM_KEY;


/* =====================================================
   PŘEVOD STARÝCH CHYB

   Pokud hráč ještě nemá vlastní seznam
   a existuje původní společný seznam,
   jednou ho zkopírujeme k tomuto hráči.

   Starý seznam nemažeme.
===================================================== */

function migrateOldProblems() {

  if (!activeProfileId) {
    return;
  }


  if (
    localStorage.getItem(
      PROBLEM_KEY
    ) !== null
  ) {
    return;
  }


  const oldData =
    localStorage.getItem(
      LEGACY_PROBLEM_KEY
    );


  if (oldData === null) {

    localStorage.setItem(
      PROBLEM_KEY,
      JSON.stringify([])
    );

    return;
  }


  try {

    const parsed =
      JSON.parse(oldData);


    if (Array.isArray(parsed)) {

      localStorage.setItem(
        PROBLEM_KEY,
        JSON.stringify(parsed)
      );

    } else {

      localStorage.setItem(
        PROBLEM_KEY,
        JSON.stringify([])
      );

    }

  } catch {

    localStorage.setItem(
      PROBLEM_KEY,
      JSON.stringify([])
    );

  }

}


migrateOldProblems();


/* =====================================================
   OTÁZKY
===================================================== */

const allQuestions =
  typeof questionsRaw !== "undefined"
    ? questionsRaw.map(
        function(q) {

          return {

            section:
              Number(q[0]),

            number:
              Number(q[1]),

            question:
              q[2],

            answers: [

              {
                text: q[3],
                originalNumber: 1
              },

              {
                text: q[4],
                originalNumber: 2
              },

              {
                text: q[5],
                originalNumber: 3
              }

            ],

            correct:
              Number(q[6])

          };

        }
      )
    : [];


/* =====================================================
   NÁZVY OKRUHŮ
===================================================== */

const sectionNames = {

  1: "Přírodovědné znalosti",

  2: "Chov ryb",

  3: "Zákon o rybářství",

  4: "Stanovy ČRS",

  5: "Rybolovná technika",

  6: "Závodní lov ryb udicí"

};


/* =====================================================
   PROMĚNNÉ
===================================================== */

let problemQuestions =
  loadProblemQuestions();


let mode =
  "all";


let selectedSection =
  "all";


let currentQuestions = [];

let currentIndex = 0;

let currentAnswers = [];

let answered = false;

let sessionCorrect = 0;

let sessionTotal = 0;


/* =====================================================
   HTML
===================================================== */

const totalCount =
  document.getElementById(
    "totalCount"
  );

const problemCount =
  document.getElementById(
    "problemCount"
  );

const sessionScore =
  document.getElementById(
    "sessionScore"
  );

const allModeButton =
  document.getElementById(
    "allModeButton"
  );

const wrongModeButton =
  document.getElementById(
    "wrongModeButton"
  );

const sectionFilter =
  document.getElementById(
    "sectionFilter"
  );

const questionCard =
  document.getElementById(
    "questionCard"
  );

const emptyBox =
  document.getElementById(
    "emptyBox"
  );

const emptyTitle =
  document.getElementById(
    "emptyTitle"
  );

const emptyText =
  document.getElementById(
    "emptyText"
  );

const questionCounter =
  document.getElementById(
    "questionCounter"
  );

const questionNumber =
  document.getElementById(
    "questionNumber"
  );

const sectionName =
  document.getElementById(
    "sectionName"
  );

const questionText =
  document.getElementById(
    "questionText"
  );

const questionSoundButton =
  document.getElementById(
    "questionSoundButton"
  );

const answersArea =
  document.getElementById(
    "answersArea"
  );

const feedback =
  document.getElementById(
    "feedback"
  );

const nextButton =
  document.getElementById(
    "nextButton"
  );


/* =====================================================
   ID OTÁZKY

   Stejný formát používá Zkušební test.

   Např.:
   1-15
   3-27
===================================================== */

function questionID(q) {

  return (
    q.section +
    "-" +
    q.number
  );

}


/* =====================================================
   NAČTENÍ "CO MI NEJDE"
===================================================== */

function loadProblemQuestions() {

  try {

    const stored =
      JSON.parse(
        localStorage.getItem(
          PROBLEM_KEY
        )
      );


    if (!Array.isArray(stored)) {
      return [];
    }


    /*
      Odstraníme případné duplicity.
    */

    return [
      ...new Set(
        stored.map(
          function(id) {
            return String(id);
          }
        )
      )
    ];

  } catch {

    return [];

  }

}


/* =====================================================
   ULOŽENÍ "CO MI NEJDE"
===================================================== */

function saveProblemQuestions() {

  /*
    Ještě jednou odstraníme duplicity.
  */

  problemQuestions =
    [
      ...new Set(
        problemQuestions
      )
    ];


  localStorage.setItem(
    PROBLEM_KEY,
    JSON.stringify(
      problemQuestions
    )
  );


  updateStats();

}


/* =====================================================
   PŘIDÁNÍ CHYBY
===================================================== */

function addProblemQuestion(q) {

  const id =
    questionID(q);


  if (
    !problemQuestions.includes(
      id
    )
  ) {

    problemQuestions.push(
      id
    );

    saveProblemQuestions();

  }

}


/* =====================================================
   ODEBRÁNÍ CHYBY

   Otázka se odstraní jen tehdy,
   když ji hráč správně zodpoví
   přímo v režimu "Co mi nejde".
===================================================== */

function removeProblemQuestion(q) {

  const id =
    questionID(q);


  problemQuestions =
    problemQuestions.filter(
      function(savedId) {

        return (
          savedId !== id
        );

      }
    );


  saveProblemQuestions();

}


/* =====================================================
   MÍCHÁNÍ
===================================================== */

function shuffle(array) {

  const copy =
    [...array];


  for (
    let i = copy.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      copy[i],
      copy[j]
    ] = [
      copy[j],
      copy[i]
    ];

  }


  return copy;

}


/* =====================================================
   STATISTIKY
===================================================== */

function updateStats() {

  totalCount.textContent =
    allQuestions.length;


  problemCount.textContent =
    problemQuestions.length;


  sessionScore.textContent =
    sessionCorrect +
    " / " +
    sessionTotal;

}


/* =====================================================
   REŽIM
===================================================== */

function setMode(
  newMode
) {

  mode =
    newMode;


  allModeButton.classList.toggle(
    "active",
    mode === "all"
  );


  wrongModeButton.classList.toggle(
    "active",
    mode === "wrong"
  );


  /*
    Znovu načteme seznam z localStorage.

    Díky tomu se projeví i chyba,
    kterou hráč před chvílí udělal
    ve Zkušebním testu.
  */

  problemQuestions =
    loadProblemQuestions();


  prepareQuestions();

}


/* =====================================================
   ZMĚNA OKRUHU
===================================================== */

function changeSection() {

  selectedSection =
    sectionFilter.value;

  prepareQuestions();

}


/* =====================================================
   PŘÍPRAVA OTÁZEK
===================================================== */

function prepareQuestions() {

  let questions =
    [...allQuestions];


  /*
    Režim Co mi nejde.
  */

  if (
    mode === "wrong"
  ) {

    questions =
      questions.filter(
        function(q) {

          return problemQuestions.includes(
            questionID(q)
          );

        }
      );

  }


  /*
    Filtr okruhu.
  */

  if (
    selectedSection !== "all"
  ) {

    const section =
      Number(
        selectedSection
      );


    questions =
      questions.filter(
        function(q) {

          return (
            q.section === section
          );

        }
      );

  }


  currentQuestions =
    shuffle(
      questions
    );


  currentIndex = 0;


  updateStats();


  if (
    currentQuestions.length === 0
  ) {

    showEmptyState();

    return;

  }


  emptyBox.style.display =
    "none";

  questionCard.style.display =
    "block";


  showQuestion();

}


/* =====================================================
   PRÁZDNÝ STAV
===================================================== */

function showEmptyState() {

  questionCard.style.display =
    "none";

  emptyBox.style.display =
    "block";


  if (
    mode === "wrong"
  ) {

    emptyTitle.textContent =
      "🎉 Paráda!";

    emptyText.textContent =
      selectedSection === "all"
        ? "V „Co mi nejde“ teď nemáš žádné otázky."
        : "V tomto okruhu už v „Co mi nejde“ nemáš žádné otázky.";

  } else {

    emptyTitle.textContent =
      "Žádné otázky";

    emptyText.textContent =
      "Pro tento výběr nejsou k dispozici žádné otázky.";

  }

}


/* =====================================================
   ZOBRAZENÍ OTÁZKY
===================================================== */

function showQuestion() {

  if (
    !currentQuestions.length
  ) {

    showEmptyState();
    return;

  }


  /*
    Pokud jsme došli na konec,
    zamícháme otázky znovu.
  */

  if (
    currentIndex >=
    currentQuestions.length
  ) {

    prepareQuestions();
    return;

  }


  answered = false;


  feedback.className =
    "feedback";

  feedback.textContent =
    "";

  nextButton.style.display =
    "none";


  const q =
    currentQuestions[
      currentIndex
    ];


  currentAnswers =
    shuffle(
      q.answers
    );


  questionCounter.textContent =
    "Otázka " +
    (currentIndex + 1) +
    " z " +
    currentQuestions.length;


  questionNumber.textContent =
    "#" +
    q.section +
    "-" +
    q.number;


  sectionName.textContent =
    q.section +
    " – " +
    (
      sectionNames[
        q.section
      ] || ""
    );


  questionText.textContent =
    q.question;


  questionSoundButton.onclick =
    function() {

      playQuestionSound(
        q
      );

    };


  answersArea.innerHTML =
    "";


  currentAnswers.forEach(
    function(answer) {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "answer-row";


      const answerButton =
        document.createElement(
          "button"
        );

      answerButton.type =
        "button";

      answerButton.className =
        "answer-button";

      answerButton.textContent =
        answer.text;


      answerButton.onclick =
        function() {

          answerQuestion(
            q,
            answer,
            answerButton
          );

        };


      const soundButton =
        document.createElement(
          "button"
        );

      soundButton.type =
        "button";

      soundButton.className =
        "answer-sound";

      soundButton.textContent =
        "🔊";


      soundButton.onclick =
        function(event) {

          event.stopPropagation();

          playAnswerSound(
            q,
            answer
          );

        };


      row.appendChild(
        answerButton
      );

      row.appendChild(
        soundButton
      );

      answersArea.appendChild(
        row
      );

    }
  );


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =====================================================
   ODPOVĚĎ
===================================================== */

function answerQuestion(
  q,
  answer,
  clickedButton
) {

  if (answered) {
    return;
  }


  answered = true;

  sessionTotal++;


  const isCorrect =
    answer.originalNumber ===
    q.correct;


  const answerButtons =
    answersArea.querySelectorAll(
      ".answer-button"
    );


  answerButtons.forEach(
    function(button) {

      button.disabled =
        true;

    }
  );


  /*
    Zvuková tlačítka necháváme aktivní,
    aby si dítě mohlo odpovědi
    znovu poslechnout.
  */


  if (isCorrect) {

    sessionCorrect++;


    clickedButton.classList.add(
      "correct"
    );


    feedback.className =
      "feedback correct";

    feedback.innerHTML =
      "✅ Správně!";


    /*
      Důležité:

      Správná odpověď odstraní otázku
      z "Co mi nejde" POUZE tehdy,
      když hráč právě procvičuje
      tento seznam.
    */

    if (
      mode === "wrong"
    ) {

      removeProblemQuestion(
        q
      );

    }

  } else {

    clickedButton.classList.add(
      "wrong"
    );


    /*
      Zvýrazníme správnou odpověď.
    */

    answerButtons.forEach(
      function(button) {

        const matchingAnswer =
          currentAnswers.find(
            function(item) {

              return (
                item.text ===
                button.textContent
              );

            }
          );


        if (
          matchingAnswer &&
          matchingAnswer.originalNumber ===
          q.correct
        ) {

          button.classList.add(
            "correct"
          );

        }

      }
    );


    const correctAnswer =
      q.answers.find(
        function(item) {

          return (
            item.originalNumber ===
            q.correct
          );

        }
      );


    feedback.className =
      "feedback wrong";

    feedback.innerHTML =
      "❌ Špatně.<br>" +
      "Správná odpověď: <strong>" +
      escapeHtml(
        correctAnswer
          ? correctAnswer.text
          : ""
      ) +
      "</strong>";


    /*
      Chybnou otázku uložíme
      tomuto konkrétnímu hráči.
    */

    addProblemQuestion(
      q
    );

  }


  updateStats();


  nextButton.style.display =
    "block";

}


/* =====================================================
   DALŠÍ OTÁZKA
===================================================== */

function nextQuestion() {

  currentIndex++;


  /*
    V režimu "Co mi nejde" se mohl
    seznam po správné odpovědi změnit.

    Není ale potřeba okamžitě
    přestavovat celý seznam.
    Pokračujeme v aktuálním kole.
  */


  if (
    currentIndex >=
    currentQuestions.length
  ) {

    prepareQuestions();

  } else {

    showQuestion();

  }

}


/* =====================================================
   ZVUK
===================================================== */

function padQuestionNumber(
  number
) {

  return String(number)
    .padStart(
      3,
      "0"
    );

}


/* =====================================================
   PŘEHRÁNÍ MP3 + ZÁLOŽNÍ HLAS
===================================================== */

function playAudioFile(
  path,
  fallbackText
) {

  /*
    Pokud zvuk.js obsahuje vlastní
    stopSound(), nejdřív zastavíme
    předchozí zvuk.
  */

  if (
    typeof window.stopSound ===
    "function"
  ) {

    window.stopSound();

  }


  const audio =
    new Audio(
      encodeURI(path)
    );


  audio.play().catch(
    function() {

      /*
        Pokud MP3 neexistuje,
        použijeme hlas telefonu.
      */

      if (
        "speechSynthesis" in window
      ) {

        window.speechSynthesis.cancel();


        const speech =
          new SpeechSynthesisUtterance(
            fallbackText
          );


        speech.lang =
          "cs-CZ";


        window.speechSynthesis.speak(
          speech
        );

      }

    }
  );

}


/* =====================================================
   ZVUK OTÁZKY
===================================================== */

function playQuestionSound(
  q
) {

  const path =
    "OTÁZKY 1/otazka-" +
    q.section +
    "-" +
    padQuestionNumber(
      q.number
    ) +
    ".mp3";


  playAudioFile(
    path,
    q.question
  );

}


/* =====================================================
   ZVUK ODPOVĚDI
===================================================== */

function playAnswerSound(
  q,
  answer
) {

  const path =
    "OTÁZKY 1/odpoved-" +
    q.section +
    "-" +
    padQuestionNumber(
      q.number
    ) +
    "-" +
    answer.originalNumber +
    ".mp3";


  playAudioFile(
    path,
    answer.text
  );

}


/* =====================================================
   OCHRANA TEXTU
===================================================== */

function escapeHtml(
  text
) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    String(
      text || ""
    );


  return div.innerHTML;

}


/* =====================================================
   START
===================================================== */

updateStats();

prepareQuestions();

</script>
