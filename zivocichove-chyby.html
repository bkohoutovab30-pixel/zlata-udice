<!DOCTYPE html>
<html lang="cs">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <title>Co mi nejde – Živočichové | Zlatá udice</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef7fb;
      color: #17324d;
    }


    .app {
      max-width: 600px;
      margin: auto;
      min-height: 100vh;
      padding: 20px;
    }


    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }


    .back {
      color: #567;
      text-decoration: none;
      font-weight: bold;
    }


    .player {
      color: #567;
      font-size: 14px;
      font-weight: bold;
    }


    .header {
      text-align: center;
      margin-bottom: 20px;
    }


    .header-icon {
      font-size: 42px;
    }


    .header h1 {
      margin: 5px 0;
      font-size: 28px;
    }


    .header p {
      margin: 0;
      color: #678;
    }


    /* =========================
       POČET CHYB
    ========================= */


    .mistake-count {
      background: white;
      border-radius: 14px;
      padding: 14px;
      margin: 20px 0;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
    }


    .mistake-count strong {
      font-size: 24px;
    }


    .mistake-count span {
      display: block;
      margin-top: 4px;
      color: #789;
      font-size: 13px;
    }


    /* =========================
       KARTA
    ========================= */


    .animal-card {
      background: white;
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      text-align: center;
    }


    .photo {
      width: 100%;
      min-height: 280px;
      background: #f3f7f9;
      border-radius: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #789;
      margin-bottom: 20px;
      overflow: hidden;
    }


    .animal-photo {
      display: block;
      width: 100%;
      height: auto;
      max-height: 420px;
      object-fit: contain;
      border-radius: 18px;
    }


    .photo-placeholder {
      width: 100%;
      min-height: 280px;
      border: 2px dashed #c7d8e2;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }


    .photo-icon {
      font-size: 60px;
      margin-bottom: 10px;
    }


    .question {
      font-size: 21px;
      font-weight: bold;
      margin: 5px 0 18px;
    }


    /* =========================
       ODPOVĚDI
    ========================= */


    .answers {
      display: grid;
      gap: 12px;
    }


    .answer-row {
      display: grid;
      grid-template-columns: 1fr 52px;
      gap: 8px;
    }


    .answer-button {
      width: 100%;
      border: 2px solid #d7e5ec;
      background: white;
      color: #17324d;
      border-radius: 14px;
      padding: 15px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      text-align: left;
    }


    .answer-button.correct {
      background: #dff4e5;
      border-color: #65a876;
    }


    .answer-button.wrong {
      background: #f9dfdf;
      border-color: #c77;
    }


    .answer-button:disabled {
      cursor: default;
    }


    .answer-sound {
      border: none;
      border-radius: 14px;
      background: #e6f2f7;
      color: #17324d;
      font-size: 21px;
      cursor: pointer;
    }


    .answer-sound:active {
      transform: scale(0.96);
    }


    /* =========================
       VÝSLEDEK
    ========================= */


    .result {
      min-height: 28px;
      margin-top: 18px;
      font-size: 18px;
      font-weight: bold;
    }


    .result.correct {
      color: #387848;
    }


    .result.wrong {
      color: #a64f4f;
    }


    /* =========================
       DALŠÍ
    ========================= */


    .next-button {
      display: none;
      width: 100%;
      margin-top: 16px;
      border: none;
      border-radius: 14px;
      background: #17324d;
      color: white;
      padding: 16px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }


    .sound-message {
      min-height: 18px;
      margin-top: 12px;
      color: #789;
      font-size: 12px;
    }


    /* =========================
       PRÁZDNÝ SEZNAM
    ========================= */


    .empty-box {
      display: none;
      background: white;
      border-radius: 22px;
      padding: 35px 20px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }


    .empty-icon {
      font-size: 60px;
      margin-bottom: 15px;
    }


    .empty-box h2 {
      margin: 0 0 10px;
      font-size: 25px;
    }


    .empty-box p {
      margin: 0 0 20px;
      color: #678;
      line-height: 1.5;
    }


    .practice-link {
      display: inline-block;
      background: #17324d;
      color: white;
      text-decoration: none;
      padding: 14px 20px;
      border-radius: 14px;
      font-weight: bold;
    }


    @media (max-width: 520px) {

      .app {
        padding: 15px;
      }


      .photo,
      .photo-placeholder {
        min-height: 220px;
      }


      .animal-photo {
        max-height: 340px;
      }


      .answer-button {
        font-size: 16px;
        padding: 14px 12px;
      }

    }

  </style>

</head>


<body>


<main class="app">


  <!-- HORNÍ LIŠTA -->

  <div class="topbar">

    <a
      class="back"
      href="zivocichove.html"
    >
      ← Živočichové
    </a>


    <div
      class="player"
      id="playerInfo"
    ></div>

  </div>


  <!-- HLAVIČKA -->

  <div class="header">

    <div class="header-icon">
      ❤️ 🦆
    </div>

    <h1>
      Co mi nejde
    </h1>

    <p>
      Procvičuj živočichy, které ti dělají problémy
    </p>

  </div>


  <!-- POČET -->

  <div
    class="mistake-count"
    id="mistakeCountBox"
  >

    <strong
      id="mistakeCount"
    >
      0
    </strong>

    <span>
      živočichů k procvičení
    </span>

  </div>


  <!-- KARTA -->

  <div
    class="animal-card"
    id="animalCard"
  >


    <div
      class="photo"
      id="photoArea"
    ></div>


    <div class="question">
      Který živočich je na obrázku?
    </div>


    <div
      class="answers"
      id="answers"
    ></div>


    <div
      class="result"
      id="result"
    ></div>


    <button
      class="next-button"
      id="nextButton"
      type="button"
      onclick="nextQuestion()"
    >
      Další →
    </button>


    <div
      class="sound-message"
      id="soundMessage"
    ></div>


  </div>


  <!-- VŠECHNO UMÍM -->

  <div
    class="empty-box"
    id="emptyBox"
  >

    <div class="empty-icon">
      🏆
    </div>

    <h2>
      Paráda!
    </h2>

    <p>
      Teď tu nemáš žádného živočicha k procvičení.
      Pokračuj v běžném procvičování.
    </p>

    <a
      class="practice-link"
      href="zivocichove-procvicovani.html"
    >
      🎯 Procvičovat živočichy
    </a>

  </div>


</main>


<script src="zivocichove-data.js"></script>


<script>


/* ========================================
   PROMĚNNÉ
======================================== */

let currentAnimal = null;

let currentAnswers = [];

let answered = false;

let animalAudio = null;


/* ========================================
   PROFILY
======================================== */

function getProfiles() {

  const saved =
    localStorage.getItem(
      "zlataUdiceProfiles"
    );


  if (!saved) {

    return [];

  }


  try {

    return JSON.parse(saved);

  }
  catch {

    return [];

  }

}


/* ========================================
   HRÁČ
======================================== */

const activeProfileId =
  localStorage.getItem(
    "zlataUdiceActiveProfile"
  );


const activePlayer =
  getProfiles().find(
    function(profile) {

      return (
        profile.id ===
        activeProfileId
      );

    }
  );


if (activePlayer) {

  document.getElementById(
    "playerInfo"
  ).textContent =
    (activePlayer.avatar || "") +
    " " +
    (activePlayer.name || "");

}


/* ========================================
   KLÍČ CHYB

   STEJNÝ JAKO V PROCVIČOVÁNÍ
======================================== */

const mistakesKey =
  "zlataUdiceAnimalMistakes_" +
  (activeProfileId || "default");


/* ========================================
   HTML PRVKY
======================================== */

const animalCard =
  document.getElementById(
    "animalCard"
  );


const emptyBox =
  document.getElementById(
    "emptyBox"
  );


const mistakeCountBox =
  document.getElementById(
    "mistakeCountBox"
  );


const mistakeCount =
  document.getElementById(
    "mistakeCount"
  );


const photoArea =
  document.getElementById(
    "photoArea"
  );


const answersArea =
  document.getElementById(
    "answers"
  );


const resultArea =
  document.getElementById(
    "result"
  );


const nextButton =
  document.getElementById(
    "nextButton"
  );


const soundMessage =
  document.getElementById(
    "soundMessage"
  );


/* ========================================
   NÁZEV -> SOUBOR
======================================== */

function createFileName(name) {

  return String(name)
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "");

}


/* ========================================
   NÁHODNÉ POŘADÍ
======================================== */

function shuffle(array) {

  const copy =
    [...array];


  for (
    let i = copy.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      copy[i],
      copy[j]
    ] =
    [
      copy[j],
      copy[i]
    ];

  }


  return copy;

}


/* ========================================
   NAČTENÍ CHYB
======================================== */

function getMistakes() {

  const saved =
    localStorage.getItem(
      mistakesKey
    );


  if (!saved) {

    return [];

  }


  try {

    const data =
      JSON.parse(saved);


    if (!Array.isArray(data)) {

      return [];

    }


    /*
      Podpora staršího i nového způsobu.

      Pokud je uložen jen název,
      dohledáme živočicha v animals.
    */

    return data
      .map(
        function(item) {

          if (
            typeof item === "string"
          ) {

            return animals.find(
              function(animal) {

                return (
                  animal.name === item
                );

              }
            );

          }


          if (
            item &&
            item.name
          ) {

            /*
              Raději použijeme aktuální
              data ze zivocichove-data.js.
            */

            const found =
              animals.find(
                function(animal) {

                  return (
                    animal.name ===
                    item.name
                  );

                }
              );


            return found || item;

          }


          return null;

        }
      )
      .filter(Boolean);

  }
  catch {

    return [];

  }

}


/* ========================================
   ULOŽENÍ CHYB
======================================== */

function saveMistakes(items) {

  const cleanItems =
    items.map(
      function(item) {

        return {

          card:
            item.card || "",

          name:
            item.name,

          image:
            item.image || ""

        };

      }
    );


  localStorage.setItem(
    mistakesKey,
    JSON.stringify(cleanItems)
  );

}


/* ========================================
   ODSTRANĚNÍ CHYBY
======================================== */

function removeMistake(item) {

  const mistakes =
    getMistakes();


  const filtered =
    mistakes.filter(
      function(savedItem) {

        return (
          savedItem.name !==
          item.name
        );

      }
    );


  saveMistakes(
    filtered
  );

}


/* ========================================
   PLACEHOLDER OBRÁZKU
======================================== */

function showPlaceholder() {

  photoArea.innerHTML =
    '<div class="photo-placeholder">' +
      '<div class="photo-icon">🖼️</div>' +
      '<strong>Fotografii doplníme</strong>' +
      '<span>Pro tohoto živočicha zatím fotografii nemáme.</span>' +
    '</div>';

}


/* ========================================
   FOTOGRAFIE
======================================== */

function showPhoto(item) {

  showPlaceholder();


  const baseName =
    createFileName(
      item.name
    );


  const possibleImages =
    [];


  if (item.image) {

    possibleImages.push(
      item.image
    );

  }


  possibleImages.push(

    baseName + ".webp",
    baseName + "-2.webp",
    baseName + "-3.webp",

    baseName + ".jpg",
    baseName + "-2.jpg",
    baseName + "-3.jpg",

    baseName + ".jpeg",
    baseName + "-2.jpeg",
    baseName + "-3.jpeg",

    baseName + ".png",
    baseName + "-2.png",
    baseName + "-3.png"

  );


  let attempt = 0;


  function tryNextImage() {

    if (
      attempt >=
      possibleImages.length
    ) {

      return;

    }


    const img =
      new Image();


    img.onload =
      function() {

        if (
          !currentAnimal ||
          currentAnimal.name !==
          item.name
        ) {

          return;

        }


        img.className =
          "animal-photo";


        img.alt =
          item.name;


        photoArea.innerHTML =
          "";


        photoArea.appendChild(
          img
        );

      };


    img.onerror =
      function() {

        attempt++;

        tryNextImage();

      };


    img.src =
      possibleImages[attempt];

  }


  tryNextImage();

}


/* ========================================
   ZASTAVENÍ ZVUKU
======================================== */

function stopAnimalSound() {

  if (!animalAudio) {

    return;

  }


  try {

    animalAudio.pause();

    animalAudio.currentTime =
      0;

  }
  catch (error) {

  }


  animalAudio =
    null;

}


/* ========================================
   ZVUK NÁZVU
======================================== */

function playAnimalName(name) {

  stopAnimalSound();


  const fileName =
    createFileName(
      name
    ) +
    ".mp3";


  /*
    MP3 živočichů:

    zivocichove/nazev.mp3
  */

  const audioPath =
    "zivocichove/" +
    fileName;


  soundMessage.textContent =
    "🔊 " +
    name;


  const audio =
    new Audio(
      audioPath
    );


  animalAudio =
    audio;


  audio.addEventListener(
    "ended",
    function() {

      if (
        animalAudio === audio
      ) {

        animalAudio =
          null;

      }


      soundMessage.textContent =
        "";

    },
    {
      once: true
    }
  );


  audio.addEventListener(
    "error",
    function() {

      if (
        animalAudio === audio
      ) {

        animalAudio =
          null;

      }


      soundMessage.textContent =
        "Zvuk nebyl nalezen.";

    },
    {
      once: true
    }
  );


  const promise =
    audio.play();


  if (
    promise &&
    typeof promise.catch ===
    "function"
  ) {

    promise.catch(
      function() {

        soundMessage.textContent =
          "Zvuk se nepodařilo přehrát.";

      }
    );

  }

}


/* ========================================
   ODPOVĚDI
======================================== */

function createAnswers() {

  answersArea.innerHTML =
    "";


  currentAnswers.forEach(
    function(item) {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "answer-row";


      /* ODPOVĚĎ */

      const answerButton =
        document.createElement(
          "button"
        );


      answerButton.type =
        "button";


      answerButton.className =
        "answer-button";


      answerButton.textContent =
        item.name;


      answerButton.dataset.name =
        item.name;


      answerButton.onclick =
        function() {

          checkAnswer(
            item,
            answerButton
          );

        };


      /* ZVUK */

      const soundButton =
        document.createElement(
          "button"
        );


      soundButton.type =
        "button";


      soundButton.className =
        "answer-sound";


      soundButton.textContent =
        "🔊";


      soundButton.setAttribute(
        "aria-label",
        "Přehrát " +
        item.name
      );


      soundButton.onclick =
        function(event) {

          event.stopPropagation();


          playAnimalName(
            item.name
          );

        };


      row.appendChild(
        answerButton
      );


      row.appendChild(
        soundButton
      );


      answersArea.appendChild(
        row
      );

    }
  );

}


/* ========================================
   NOVÁ OTÁZKA
======================================== */

function newQuestion() {

  stopAnimalSound();


  answered =
    false;


  resultArea.textContent =
    "";


  resultArea.className =
    "result";


  nextButton.style.display =
    "none";


  soundMessage.textContent =
    "";


  const mistakes =
    getMistakes();


  mistakeCount.textContent =
    mistakes.length;


  /*
    UŽ NENÍ CO PROCVIČOVAT
  */

  if (
    mistakes.length === 0
  ) {

    animalCard.style.display =
      "none";


    mistakeCountBox.style.display =
      "none";


    emptyBox.style.display =
      "block";


    return;

  }


  animalCard.style.display =
    "block";


  mistakeCountBox.style.display =
    "block";


  emptyBox.style.display =
    "none";


  /*
    Vybereme náhodně jeden
    problémový druh.
  */

  currentAnimal =
    mistakes[
      Math.floor(
        Math.random() *
        mistakes.length
      )
    ];


  /*
    Tři špatné odpovědi bereme
    z CELÉHO seznamu živočichů.
  */

  const wrongOptions =
    shuffle(
      animals.filter(
        function(item) {

          return (
            item.name !==
            currentAnimal.name
          );

        }
      )
    ).slice(
      0,
      3
    );


  currentAnswers =
    shuffle(
      [
        currentAnimal,
        ...wrongOptions
      ]
    );


  showPhoto(
    currentAnimal
  );


  createAnswers();

}


/* ========================================
   KONTROLA ODPOVĚDI
======================================== */

function checkAnswer(
  selectedItem,
  selectedButton
) {

  if (answered) {

    return;

  }


  answered =
    true;


  const buttons =
    document.querySelectorAll(
      ".answer-button"
    );


  buttons.forEach(
    function(button) {

      button.disabled =
        true;


      if (
        button.dataset.name ===
        currentAnimal.name
      ) {

        button.classList.add(
          "correct"
        );

      }

    }
  );


  /* =========================
     SPRÁVNĚ
  ========================= */

  if (
    selectedItem.name ===
    currentAnimal.name
  ) {

    selectedButton.classList.add(
      "correct"
    );


    resultArea.className =
      "result correct";


    resultArea.textContent =
      "✅ Správně! " +
      currentAnimal.name;


    /*
      Správná odpověď =
      odstraníme z Co mi nejde.
    */

    removeMistake(
      currentAnimal
    );


    const remaining =
      getMistakes();


    mistakeCount.textContent =
      remaining.length;


    if (
      remaining.length === 0
    ) {

      nextButton.textContent =
        "Hotovo 🏆";

    }
    else {

      nextButton.textContent =
        "Další →";

    }

  }


  /* =========================
     ŠPATNĚ
  ========================= */

  else {

    selectedButton.classList.add(
      "wrong"
    );


    resultArea.className =
      "result wrong";


    resultArea.textContent =
      "❌ Správná odpověď je: " +
      currentAnimal.name;


    /*
      Při špatné odpovědi
      zůstává živočich v chybách.
    */

    nextButton.textContent =
      "Zkusit další →";

  }


  nextButton.style.display =
    "block";

}


/* ========================================
   DALŠÍ
======================================== */

function nextQuestion() {

  newQuestion();


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* ========================================
   START
======================================== */

if (
  typeof animals === "undefined" ||
  !Array.isArray(animals) ||
  animals.length === 0
) {

  animalCard.style.display =
    "none";


  mistakeCountBox.style.display =
    "none";


  emptyBox.style.display =
    "block";


  emptyBox.innerHTML =
    "<h2>Chyba</h2>" +
    "<p>Nepodařilo se načíst seznam živočichů.</p>";

}
else {

  newQuestion();

}


</script>


</body>

</html>
