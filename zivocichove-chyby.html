<!DOCTYPE html>
<html lang="cs">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <title>
    Co mi nejde – Živočichové | Zlatá udice
  </title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef7fb;
      color: #17324d;
    }


    .app {
      max-width: 600px;
      margin: auto;
      min-height: 100vh;
      padding: 20px;
    }


    /* =========================
       HORNÍ LIŠTA
    ========================= */

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }


    .back {
      color: #567;
      text-decoration: none;
      font-weight: bold;
    }


    .player {
      color: #567;
      font-size: 14px;
      font-weight: bold;
    }


    /* =========================
       HLAVIČKA
    ========================= */

    .header {
      text-align: center;
      margin-bottom: 20px;
    }


    .header-icon {
      font-size: 42px;
    }


    .header h1 {
      margin: 5px 0;
      font-size: 28px;
    }


    .header p {
      margin: 0;
      color: #678;
    }


    /* =========================
       POČET CHYB
    ========================= */

    .mistake-count {
      background: white;
      border-radius: 14px;
      padding: 14px;
      margin: 20px 0;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
    }


    .mistake-count strong {
      font-size: 24px;
    }


    .mistake-count span {
      display: block;
      margin-top: 4px;
      color: #789;
      font-size: 13px;
    }


    /* =========================
       KARTA
    ========================= */

    .animal-card {
      background: white;
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      text-align: center;
    }


    /* =========================
       FOTOGRAFIE
    ========================= */

    .photo {
      width: 100%;
      min-height: 280px;
      background: #f3f7f9;
      border: 2px dashed #c7d8e2;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #789;
      padding: 20px;
      margin-bottom: 22px;
      overflow: hidden;
    }


    .photo img {
      display: block;
      width: 100%;
      max-height: 350px;
      object-fit: contain;
      border-radius: 14px;
    }


    .photo-icon {
      font-size: 60px;
      margin-bottom: 10px;
    }


    /* =========================
       OTÁZKA
    ========================= */

    .question {
      font-size: 20px;
      font-weight: bold;
      margin: 5px 0 18px;
    }


    /* =========================
       ZOBRAZIT NÁZEV
    ========================= */

    .show-name {
      border: none;
      background: #17324d;
      color: white;
      padding: 14px 22px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }


    .show-name:active {
      transform: scale(0.98);
    }


    /* =========================
       ODPOVĚĎ
    ========================= */

    .answer {
      display: none;
    }


    .animal-name {
      font-size: 30px;
      margin: 5px 0 14px;
    }


    /* =========================
       ZVUK
    ========================= */

    .sound-button {
      border: none;
      background: #e6f2f7;
      color: #17324d;
      padding: 11px 17px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 22px;
    }


    .sound-button:active {
      transform: scale(0.97);
    }


    /* =========================
       VÍM / NEVÍM
    ========================= */

    .answer-question {
      color: #678;
      margin-bottom: 12px;
      font-weight: bold;
    }


    .answer-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }


    .answer-button {
      border: none;
      border-radius: 14px;
      padding: 15px 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }


    .know {
      background: #dff4e5;
      color: #276238;
    }


    .dont-know {
      background: #f9dfdf;
      color: #8c3f3f;
    }


    .answer-button:active {
      transform: scale(0.98);
    }


    /* =========================
       ZPRÁVA
    ========================= */

    .message {
      min-height: 24px;
      margin-top: 15px;
      font-weight: bold;
    }


    .message.correct {
      color: #387848;
    }


    .message.wrong {
      color: #a64f4f;
    }


    /* =========================
       DALŠÍ
    ========================= */

    .next-button {
      display: none;
      width: 100%;
      margin-top: 18px;
      border: none;
      border-radius: 14px;
      background: #17324d;
      color: white;
      padding: 15px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }


    /* =========================
       PRÁZDNÝ SEZNAM
    ========================= */

    .empty-box {
      display: none;
      background: white;
      border-radius: 22px;
      padding: 35px 20px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }


    .empty-icon {
      font-size: 60px;
      margin-bottom: 15px;
    }


    .empty-box h2 {
      margin: 0 0 10px;
      font-size: 25px;
    }


    .empty-box p {
      margin: 0 0 20px;
      color: #678;
      line-height: 1.5;
    }


    .practice-link {
      display: inline-block;
      background: #17324d;
      color: white;
      text-decoration: none;
      padding: 14px 20px;
      border-radius: 14px;
      font-weight: bold;
    }


    /* =========================
       MOBIL
    ========================= */

    @media (max-width: 520px) {

      .app {
        padding: 15px;
      }


      .photo {
        min-height: 220px;
      }


      .photo img {
        max-height: 320px;
      }


      .animal-name {
        font-size: 26px;
      }


      .answer-button {
        font-size: 15px;
        padding: 14px 8px;
      }

    }

  </style>

</head>


<body>


<main class="app">


  <!-- =========================
       HORNÍ LIŠTA
  ========================= -->

  <div class="topbar">

    <a
      class="back"
      href="zivocichove.html"
    >
      ← Živočichové
    </a>


    <div
      class="player"
      id="playerInfo"
    ></div>

  </div>


  <!-- =========================
       HLAVIČKA
  ========================= -->

  <div class="header">

    <div class="header-icon">
      ❤️🦆
    </div>

    <h1>
      Co mi nejde
    </h1>

    <p>
      Procvičuj živočichy, které ti dělají problémy
    </p>

  </div>


  <!-- =========================
       POČET
  ========================= -->

  <div
    class="mistake-count"
    id="mistakeCountBox"
  >

    <strong
      id="mistakeCount"
    >
      0
    </strong>

    <span>
      živočichů k procvičení
    </span>

  </div>


  <!-- =========================
       KARTA
  ========================= -->

  <div
    class="animal-card"
    id="animalCard"
  >


    <!-- OBRÁZEK -->

    <div
      class="photo"
      id="photoArea"
    ></div>


    <!-- OTÁZKA -->

    <div
      class="question"
      id="questionText"
    >
      Poznáš tohoto živočicha?
    </div>


    <!-- TLAČÍTKO ZOBRAZIT -->

    <div
      id="questionArea"
    >

      <button
        class="show-name"
        type="button"
        onclick="showAnswer()"
      >
        👁️ Zobrazit název
      </button>

    </div>


    <!-- ODPOVĚĎ -->

    <div
      class="answer"
      id="answerArea"
    >

      <h2
        class="animal-name"
        id="animalName"
      ></h2>


      <button
        class="sound-button"
        type="button"
        onclick="playCurrentAnimal()"
      >
        🔊 Poslechnout název
      </button>


      <div class="answer-question">
        Už tohoto živočicha poznáš?
      </div>


      <div class="answer-buttons">


        <button
          class="answer-button dont-know"
          type="button"
          onclick="saveAnswer(false)"
        >
          ❌ Ještě neumím
        </button>


        <button
          class="answer-button know"
          type="button"
          onclick="saveAnswer(true)"
        >
          ✅ Už umím
        </button>


      </div>

    </div>


    <!-- ZPRÁVA -->

    <div
      class="message"
      id="message"
    ></div>


    <!-- DALŠÍ -->

    <button
      class="next-button"
      id="nextButton"
      type="button"
      onclick="nextAnimal()"
    >
      Další živočich →
    </button>


  </div>


  <!-- =========================
       VŠECHNO UMÍM
  ========================= -->

  <div
    class="empty-box"
    id="emptyBox"
  >

    <div class="empty-icon">
      🏆
    </div>


    <h2>
      Paráda!
    </h2>


    <p>
      Teď tu nemáš žádného živočicha
      k procvičení.
      Pokračuj v běžném procvičování.
    </p>


    <a
      class="practice-link"
      href="zivocichove-procvicovani.html"
    >
      🎯 Procvičovat živočichy
    </a>

  </div>


</main>


<!-- =========================
     DATA ŽIVOČICHŮ
========================= -->

<script src="zivocichove-data.js"></script>


<!-- =========================
     SPOLEČNÝ ZVUK
========================= -->

<script src="zvuk.js"></script>


<script>


/* =========================
   PROMĚNNÉ
========================= */

let currentAnimal = null;

let lastAnimalName = "";

let answered = false;


/* =========================
   PROFILY
========================= */

function getProfiles() {

  const saved =
    localStorage.getItem(
      "zlataUdiceProfiles"
    );


  if (!saved) {

    return [];

  }


  try {

    return JSON.parse(
      saved
    );

  }

  catch {

    return [];

  }

}


/* =========================
   AKTIVNÍ HRÁČ
========================= */

const activeProfileId =
  localStorage.getItem(
    "zlataUdiceActiveProfile"
  );


if (!activeProfileId) {

  window.location.href =
    "profily.html";

}


const activePlayer =
  getProfiles().find(
    function(profile) {

      return (
        profile.id ===
        activeProfileId
      );

    }
  );


if (!activePlayer) {

  localStorage.removeItem(
    "zlataUdiceActiveProfile"
  );


  window.location.href =
    "profily.html";

}

else {

  document.getElementById(
    "playerInfo"
  ).textContent =
    (activePlayer.avatar || "") +
    " " +
    (activePlayer.name || "");

}


/* =========================
   KLÍČ CHYB
========================= */

const mistakesKey =
  "zlataUdiceAnimalMistakes_" +
  activeProfileId;


/* =========================
   HTML PRVKY
========================= */

const animalCard =
  document.getElementById(
    "animalCard"
  );


const emptyBox =
  document.getElementById(
    "emptyBox"
  );


const mistakeCountBox =
  document.getElementById(
    "mistakeCountBox"
  );


const mistakeCount =
  document.getElementById(
    "mistakeCount"
  );


const photoArea =
  document.getElementById(
    "photoArea"
  );


const questionArea =
  document.getElementById(
    "questionArea"
  );


const answerArea =
  document.getElementById(
    "answerArea"
  );


const animalName =
  document.getElementById(
    "animalName"
  );


const message =
  document.getElementById(
    "message"
  );


const nextButton =
  document.getElementById(
    "nextButton"
  );


/* =========================
   NÁZEV SOUBORU
========================= */

function createFileName(name) {

  return String(name)

    .normalize("NFD")

    .replace(
      /[\u0300-\u036f]/g,
      ""
    )

    .toLowerCase()

    .replace(
      /[^a-z0-9]+/g,
      "-"
    )

    .replace(
      /^-+|-+$/g,
      ""
    );

}


/* =========================
   NAČTENÍ CHYB
========================= */

function getMistakes() {

  const saved =
    localStorage.getItem(
      mistakesKey
    );


  if (!saved) {

    return [];

  }


  try {

    const data =
      JSON.parse(
        saved
      );


    if (!Array.isArray(data)) {

      return [];

    }


    return data

      .map(
        function(item) {


          /* STARŠÍ FORMÁT */

          if (
            typeof item ===
            "string"
          ) {

            return animals.find(
              function(animal) {

                return (
                  animal.name ===
                  item
                );

              }
            );

          }


          /* NOVĚJŠÍ FORMÁT */

          if (
            item &&
            item.name
          ) {

            const found =
              animals.find(
                function(animal) {

                  return (
                    animal.name ===
                    item.name
                  );

                }
              );


            return found || item;

          }


          return null;

        }
      )

      .filter(
        Boolean
      );

  }

  catch {

    return [];

  }

}


/* =========================
   ULOŽENÍ CHYB
========================= */

function saveMistakes(items) {

  const cleanItems =
    items.map(
      function(item) {

        return {

          card:
            item.card || "",

          name:
            item.name,

          image:
            item.image || ""

        };

      }
    );


  localStorage.setItem(
    mistakesKey,
    JSON.stringify(
      cleanItems
    )
  );

}


/* =========================
   ODSTRANĚNÍ Z CHYB
========================= */

function removeMistake(item) {

  const mistakes =
    getMistakes();


  const filtered =
    mistakes.filter(
      function(savedItem) {

        return (
          savedItem.name !==
          item.name
        );

      }
    );


  saveMistakes(
    filtered
  );

}


/* =========================
   PLACEHOLDER
========================= */

function showPlaceholder() {

  photoArea.innerHTML = `

    <div>

      <div class="photo-icon">
        🖼️
      </div>

      <strong>
        Fotografii doplníme
      </strong>

      <div style="margin-top:6px;">
        Pro tohoto živočicha zatím fotografii nemáme.
      </div>

    </div>

  `;

}


/* =========================
   FOTOGRAFIE
========================= */

function showPhoto(item) {

  showPlaceholder();


  const baseName =
    createFileName(
      item.name
    );


  const possibleImages =
    [];


  if (item.image) {

    possibleImages.push(
      item.image
    );

  }


  possibleImages.push(

    baseName + ".webp",
    baseName + "-2.webp",
    baseName + "-3.webp",

    baseName + ".jpg",
    baseName + "-2.jpg",
    baseName + "-3.jpg",

    baseName + ".jpeg",
    baseName + "-2.jpeg",
    baseName + "-3.jpeg",

    baseName + ".png",
    baseName + "-2.png",
    baseName + "-3.png"

  );


  let attempt =
    0;


  function tryNextImage() {

    if (
      attempt >=
      possibleImages.length
    ) {

      return;

    }


    const img =
      new Image();


    img.onload =
      function() {

        if (
          !currentAnimal ||
          currentAnimal.name !==
          item.name
        ) {

          return;

        }


        img.alt =
          item.name;


        photoArea.innerHTML =
          "";


        photoArea.appendChild(
          img
        );

      };


    img.onerror =
      function() {

        attempt++;

        tryNextImage();

      };


    img.src =
      possibleImages[
        attempt
      ];

  }


  tryNextImage();

}


/* =========================
   ZASTAVENÍ ZVUKU
========================= */

function stopCurrentSound() {

  if (
    typeof stopSound ===
    "function"
  ) {

    stopSound();

  }

}


/* =========================
   PŘEHRÁNÍ NÁZVU
========================= */

function playCurrentAnimal() {

  if (!currentAnimal) {

    return;

  }


  stopCurrentSound();


  if (
    typeof playNamedSound ===
    "function"
  ) {

    playNamedSound(
      currentAnimal.name,
      "audio/zivocichove"
    );

  }

}


/* =========================
   VÝBĚR ŽIVOČICHA
========================= */

function chooseAnimal() {

  stopCurrentSound();


  answered =
    false;


  message.textContent =
    "";


  message.className =
    "message";


  questionArea.style.display =
    "block";


  answerArea.style.display =
    "none";


  nextButton.style.display =
    "none";


  const mistakes =
    getMistakes();


  mistakeCount.textContent =
    mistakes.length;


  /* =========================
     NIC NEZBÝVÁ
  ========================= */

  if (
    mistakes.length === 0
  ) {

    animalCard.style.display =
      "none";


    mistakeCountBox.style.display =
      "none";


    emptyBox.style.display =
      "block";


    return;

  }


  animalCard.style.display =
    "block";


  mistakeCountBox.style.display =
    "block";


  emptyBox.style.display =
    "none";


  let available =
    mistakes;


  /*
    Pokud máme více živočichů,
    neopakujeme stejného hned
    dvakrát za sebou.
  */

  if (
    mistakes.length > 1 &&
    lastAnimalName
  ) {

    available =
      mistakes.filter(
        function(item) {

          return (
            item.name !==
            lastAnimalName
          );

        }
      );

  }


  currentAnimal =
    available[
      Math.floor(
        Math.random() *
        available.length
      )
    ];


  lastAnimalName =
    currentAnimal.name;


  animalName.textContent =
    currentAnimal.name;


  showPhoto(
    currentAnimal
  );

}


/* =========================
   ZOBRAZIT ODPOVĚĎ
========================= */

function showAnswer() {

  if (!currentAnimal) {

    return;

  }


  questionArea.style.display =
    "none";


  answerArea.style.display =
    "block";


  /*
    Po zobrazení názvu
    ho rovnou přečteme.
  */

  playCurrentAnimal();

}


/* =========================
   UŽ UMÍM / JEŠTĚ NEUMÍM
========================= */

function saveAnswer(
  knowsIt
) {

  if (
    answered ||
    !currentAnimal
  ) {

    return;

  }


  answered =
    true;


  /* =========================
     UŽ UMÍM
  ========================= */

  if (knowsIt) {

    removeMistake(
      currentAnimal
    );


    message.className =
      "message correct";


    message.textContent =
      "✅ Super! Tento živočich už byl odstraněn z „Co mi nejde“.";


    const remaining =
      getMistakes();


    mistakeCount.textContent =
      remaining.length;


    if (
      remaining.length === 0
    ) {

      nextButton.textContent =
        "Hotovo 🏆";

    }

    else {

      nextButton.textContent =
        "Další živočich →";

    }

  }


  /* =========================
     JEŠTĚ NEUMÍM
  ========================= */

  else {

    message.className =
      "message wrong";


    message.textContent =
      "❤️ Nevadí, tento živočich zůstává k procvičení.";


    nextButton.textContent =
      "Další živočich →";

  }


  nextButton.style.display =
    "block";

}


/* =========================
   DALŠÍ ŽIVOČICH
========================= */

function nextAnimal() {

  stopCurrentSound();


  chooseAnimal();


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =========================
   START
========================= */

if (
  typeof animals ===
    "undefined" ||
  !Array.isArray(animals) ||
  animals.length === 0
) {

  animalCard.style.display =
    "none";


  mistakeCountBox.style.display =
    "none";


  emptyBox.style.display =
    "block";


  emptyBox.innerHTML =
    "<h2>Chyba</h2>" +
    "<p>Nepodařilo se načíst seznam živočichů.</p>";

}

else {

  chooseAnimal();

}


</script>


</body>

</html>
