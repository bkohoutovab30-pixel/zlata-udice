<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">

  <title>Procvičování ryb | Zlatá udice</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef7fb;
      color: #17324d;
    }

    .app {
      max-width: 600px;
      margin: auto;
      min-height: 100vh;
      padding: 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .back {
      color: #567;
      text-decoration: none;
      font-weight: bold;
    }

    .player {
      font-size: 14px;
      font-weight: bold;
      color: #567;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header-icon { font-size: 42px; }

    .header h1 {
      margin: 5px 0;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      color: #678;
    }

    .score {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 20px 0;
    }

    .score-box {
      background: white;
      border-radius: 14px;
      padding: 12px 5px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
    }

    .score-number {
      display: block;
      font-size: 22px;
      font-weight: bold;
    }

    .score-label {
      display: block;
      margin-top: 3px;
      font-size: 12px;
      color: #789;
    }

    .fish-card {
      background: white;
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      text-align: center;
    }

    .photo {
      width: 100%;
      min-height: 280px;
      background: #f3f7f9;
      border: 2px dashed #c7d8e2;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #789;
      padding: 20px;
      margin-bottom: 22px;
      overflow: hidden;
    }

    .photo img {
      display: block;
      width: 100%;
      max-height: 350px;
      object-fit: contain;
      border-radius: 14px;
    }

    .photo-icon {
      font-size: 60px;
      margin-bottom: 10px;
    }

    .question {
      font-size: 20px;
      font-weight: bold;
      margin: 5px 0 18px;
    }

    .show-name {
      border: none;
      background: #17324d;
      color: white;
      padding: 14px 22px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .answer { display: none; }

    .fish-name {
      font-size: 30px;
      margin: 5px 0 14px;
    }

    .sound-button {
      border: none;
      background: #e6f2f7;
      color: #17324d;
      padding: 11px 17px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 22px;
    }

    .answer-question {
      color: #678;
      margin-bottom: 12px;
    }

    .answer-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .answer-button {
      border: none;
      border-radius: 14px;
      padding: 15px 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .wrong {
      background: #fde8e8;
      color: #9b2929;
    }

    .correct {
      background: #e2f4e8;
      color: #27683a;
    }

    .info {
      margin-top: 20px;
      text-align: center;
      color: #789;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<main class="app">

  <div class="topbar">
    <a class="back" href="ryby.html">← Ryby</a>
    <div class="player" id="playerInfo"></div>
  </div>

  <div class="header">
    <div class="header-icon">🎯🐟</div>
    <h1>Procvičování</h1>
    <p>Zkus rybu poznat bez nápovědy</p>
  </div>

  <div class="score">

    <div class="score-box">
      <span class="score-number" id="totalScore">0</span>
      <span class="score-label">Procvičeno</span>
    </div>

    <div class="score-box">
      <span class="score-number" id="correctScore">0</span>
      <span class="score-label">✅ Vím</span>
    </div>

    <div class="score-box">
      <span class="score-number" id="wrongScore">0</span>
      <span class="score-label">❌ Nevím</span>
    </div>

  </div>

  <div class="fish-card">

    <div class="photo" id="photoArea"></div>

    <div id="questionArea">

      <div class="question">
        Poznáš tuto rybu?
      </div>

      <button class="show-name" onclick="showAnswer()">
        👁️ Zobrazit název
      </button>

    </div>

    <div class="answer" id="answerArea">

      <h2 class="fish-name" id="fishName"></h2>

      <button class="sound-button" onclick="playName()">
        🔊 Přehrát název
      </button>

      <div class="answer-question">
        Věděl/a jsi správnou odpověď?
      </div>

      <div class="answer-buttons">

        <button class="answer-button wrong" onclick="answer(false)">
          ❌ Nevěděl/a
        </button>

        <button class="answer-button correct" onclick="answer(true)">
          ✅ Věděl/a
        </button>

      </div>

    </div>

  </div>

  <div class="info">
    Ryby označené jako „Nevěděl/a“
    se uloží do ❤️ Co mi nejde
    pouze tomuto hráči.
  </div>

</main>

<script>

const fish = [
  {card:"1", name:"Amur bílý"},
  {card:"2", name:"Blatňák tmavý"},
  {card:"3", name:"Bolen dravý"},
  {card:"4", name:"Candát obecný"},
  {card:"5", name:"Candát východní"},
  {card:"8", name:"Cejn velký"},
  {card:"9", name:"Cejnek malý"},
  {card:"10", name:"Drsek menší"},
  {card:"11", name:"Hlavačka mramorovaná"},
  {card:"12", name:"Hlavatka obecná"},
  {card:"13", name:"Hořavka duhová"},
  {card:"17", name:"Hrouzek obecný"},
  {card:"18", name:"Jelec jesen"},
  {card:"19", name:"Jelec proudník"},
  {card:"20", name:"Jelec tloušť"},
  {card:"21", name:"Jeseter malý"},
  {card:"22", name:"Ježdík obecný"},
  {card:"23", name:"Ježdík žlutý"},
  {card:"24", name:"Kapr obecný"},
  {card:"25", name:"Karas obecný"},
  {card:"26", name:"Karas stříbřitý"},
  {card:"27", name:"Koljuška tříostná"},
  {card:"28", name:"Lipan podhorní"},
  {card:"29", name:"Lín obecný"},
  {card:"30", name:"Losos obecný"},
  {card:"31", name:"Mník jednovousý"},
  {card:"32", name:"Mřenka mramorovaná"},
  {card:"33", name:"Okoun říční"},
  {card:"34", name:"Okounek pstruhový"},
  {card:"35", name:"Ostroretka stěhovavá"},
  {card:"36", name:"Ostrucha křivočará"},
  {card:"37", name:"Ouklej obecná"},
  {card:"38", name:"Ouklejka pruhovaná"},
  {card:"39", name:"Parma obecná"},
  {card:"40", name:"Parma středomořská"},
  {card:"41", name:"Perlín ostrobřichý"},
  {card:"42", name:"Piskoř pruhovaný"},
  {card:"43", name:"Plotice obecná"},
  {card:"44", name:"Podoustev říční"},
  {card:"45", name:"Pstruh duhový"},
  {card:"46", name:"Pstruh obecný - f. mořská"},
  {card:"47", name:"Pstruh obecný - f. potoční"},
  {card:"50", name:"Siven americký"},
  {card:"51", name:"Síh severní - maréna"},
  {card:"52", name:"Síh peleď"},
  {card:"53", name:"Slunečnice pestrá"},
  {card:"54", name:"Slunka stříbřitá"},
  {card:"55", name:"Střevle potoční"},
  {card:"56", name:"Střevlička východní"},
  {card:"57", name:"Sumec velký"},
  {card:"58", name:"Sumeček americký"},
  {card:"59", name:"Štika obecná"},
  {card:"60", name:"Tolstolobik bílý"},
  {card:"62", name:"Úhoř říční"},
  {card:"63", name:"Vranka obecná"},
  {card:"64", name:"Vranka pruhoploutvá"}
];


/* PROFIL */

const activeProfileId =
  localStorage.getItem("zlataUdiceActiveProfile");

if (!activeProfileId) {
  window.location.href = "profily.html";
}

function getProfiles() {

  const saved =
    localStorage.getItem("zlataUdiceProfiles");

  if (!saved) return [];

  try {
    return JSON.parse(saved);
  }
  catch {
    return [];
  }
}

const activePlayer =
  getProfiles().find(
    profile => profile.id === activeProfileId
  );

if (!activePlayer) {

  localStorage.removeItem(
    "zlataUdiceActiveProfile"
  );

  window.location.href = "profily.html";

}
else {

  document.getElementById("playerInfo").textContent =
    activePlayer.avatar + " " + activePlayer.name;
}


/* DATA HRÁČE */

const mistakesKey =
  "zlataUdiceFishMistakes_" + activeProfileId;

const progressKey =
  "zlataUdiceFishProgress_" + activeProfileId;


/* PROMĚNNÉ */

let currentFish = null;
let previousFish = null;

let sessionTotal = 0;
let sessionCorrect = 0;
let sessionWrong = 0;

const fishName =
  document.getElementById("fishName");

const photoArea =
  document.getElementById("photoArea");

const questionArea =
  document.getElementById("questionArea");

const answerArea =
  document.getElementById("answerArea");

const totalScore =
  document.getElementById("totalScore");

const correctScore =
  document.getElementById("correctScore");

const wrongScore =
  document.getElementById("wrongScore");


/* NÁZEV SOUBORU */

function createImageName(name) {

  return name
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()

    /* obě formy pstruha hledáme
       pod společným názvem pstruh-obecny */

    .replace(/\s*-\s*f\.\s*.*$/, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "");
}


/* PLACEHOLDER */

function showPlaceholder() {

  photoArea.innerHTML = `
    <div class="photo-icon">🖼️</div>
    <strong>Fotografii doplníme</strong>
    <span>Pro tuto rybu zatím fotografii nemáme.</span>
  `;
}


/* FOTOGRAFIE */

function showPhoto(item) {

  showPlaceholder();

  const baseName =
    createImageName(item.name);

  const possibleImages = [
    baseName + ".webp",
    baseName + "-2.webp",
    baseName + "-3.webp",

    baseName + ".jpg",
    baseName + "-2.jpg",
    baseName + "-3.jpg",

    baseName + ".jpeg",
    baseName + "-2.jpeg",

    baseName + ".png",
    baseName + "-2.png"
  ];

  let attempt = 0;

  function tryNextImage() {

    if (attempt >= possibleImages.length) {
      return;
    }

    const img = new Image();

    img.onload = function() {

      if (
        currentFish === null ||
        fish[currentFish].name !== item.name
      ) {
        return;
      }

      img.alt = item.name;

      photoArea.innerHTML = "";
      photoArea.appendChild(img);
    };

    img.onerror = function() {

      attempt++;
      tryNextImage();
    };

    img.src = possibleImages[attempt];
  }

  tryNextImage();
}


/* NÁHODNÁ RYBA */

function chooseRandomFish() {

  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }

  let newFish;

  do {

    newFish =
      Math.floor(Math.random() * fish.length);

  }
  while (
    fish.length > 1 &&
    newFish === previousFish
  );

  currentFish = newFish;
  previousFish = newFish;

  fishName.textContent =
    fish[currentFish].name;

  showPhoto(
    fish[currentFish]
  );

  questionArea.style.display = "block";
  answerArea.style.display = "none";
}


/* ODHALENÍ */

function showAnswer() {

  questionArea.style.display = "none";
  answerArea.style.display = "block";
}


/* ZVUK */

function playName() {

  if (
    !("speechSynthesis" in window) ||
    currentFish === null
  ) {
    return;
  }

  window.speechSynthesis.cancel();

  const speech =
    new SpeechSynthesisUtterance(
      fish[currentFish].name
    );

  speech.lang = "cs-CZ";
  speech.rate = 0.85;
  speech.pitch = 1;

  const voices =
    window.speechSynthesis.getVoices();

  const czechVoice =
    voices.find(
      voice =>
        voice.lang &&
        voice.lang.toLowerCase().startsWith("cs")
    );

  if (czechVoice) {
    speech.voice = czechVoice;
  }

  window.speechSynthesis.speak(speech);
}


/* ODPOVĚĎ */

function answer(knewIt) {

  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }

  sessionTotal++;

  if (knewIt) {

    sessionCorrect++;

    removeFromMistakes(
      fish[currentFish].card
    );

  }
  else {

    sessionWrong++;

    addToMistakes(
      fish[currentFish]
    );
  }

  saveProgress(knewIt);
  updateScore();
  chooseRandomFish();
}


/* SKÓRE */

function updateScore() {

  totalScore.textContent = sessionTotal;
  correctScore.textContent = sessionCorrect;
  wrongScore.textContent = sessionWrong;
}


/* CHYBY */

function getMistakes() {

  const saved =
    localStorage.getItem(mistakesKey);

  if (!saved) return [];

  try {
    return JSON.parse(saved);
  }
  catch {
    return [];
  }
}

function saveMistakes(mistakes) {

  localStorage.setItem(
    mistakesKey,
    JSON.stringify(mistakes)
  );
}

function addToMistakes(fishItem) {

  const mistakes =
    getMistakes();

  const alreadyExists =
    mistakes.some(
      item => item.card === fishItem.card
    );

  if (!alreadyExists) {

    mistakes.push(fishItem);
    saveMistakes(mistakes);
  }
}

function removeFromMistakes(card) {

  let mistakes =
    getMistakes();

  mistakes =
    mistakes.filter(
      item => item.card !== card
    );

  saveMistakes(mistakes);
}


/* DLOUHODOBÝ POKROK */

function getProgress() {

  const saved =
    localStorage.getItem(progressKey);

  if (!saved) {
    return {
      total: 0,
      correct: 0,
      wrong: 0
    };
  }

  try {

    const progress =
      JSON.parse(saved);

    return {
      total: Number(progress.total) || 0,
      correct: Number(progress.correct) || 0,
      wrong: Number(progress.wrong) || 0
    };

  }
  catch {

    return {
      total: 0,
      correct: 0,
      wrong: 0
    };
  }
}

function saveProgress(knewIt) {

  const progress =
    getProgress();

  progress.total++;

  if (knewIt) {
    progress.correct++;
  }
  else {
    progress.wrong++;
  }

  localStorage.setItem(
    progressKey,
    JSON.stringify(progress)
  );
}


/* START */

chooseRandomFish();

</script>

</body>
</html>
